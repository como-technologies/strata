[package]
name = "strata-fuzz"
version = "0.28.0"
edition = "2024"
# The floor of the workspace: this crate uses the same `if let` chains as strata.
rust-version.workspace = true
description = "The fuzz targets and the property tests of strata, strata-preflight, and strata-report-endpoint, on bolero"
license = "Apache-2.0"
repository.workspace = true
publish = false

# A target is a test. On stable Rust, `cargo test -p strata-fuzz` runs each one on its corpus and on
# random input. On nightly, `cargo bolero` runs the same test under libFuzzer: see `just fuzz`. The
# crate has no code outside its tests, but rustdoc reads its comments for `just lint`, and rustdoc
# builds no dev-dependency. So each dependency is a normal dependency.
[dependencies]
bolero = "0.13"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
strata = { path = ".." }
strata-preflight = { path = "../preflight" }
strata-report-endpoint = { path = "../report-endpoint" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
