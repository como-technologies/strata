[book]
title = "strata"
description = "Record, compare, and check Palette cluster profile versions as releases."
authors = ["Como Technologies"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail the build if SUMMARY.md names a page that does not exist.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

# mdbook-lint is not a preprocessor here. `just docs-lint` runs it, and so does CI. As a
# preprocessor it stops the build on a workstation that does not have it: `optional` skips a
# command that the system reports as absent, and a PATH with an entry that is not a directory
# makes the system report "permission denied" instead. Then `just docs-serve` fails with
# "Unable to run the preprocessor `lint`" and builds no book.

[output.html]
git-repository-url = "https://github.com/como-technologies/strata"
edit-url-template = "https://github.com/como-technologies/strata/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js", "gruvbox/gruvbox.js", "gruvbox/mermaid-gruvbox.js"]
default-theme = "gruvbox"
preferred-dark-theme = "gruvbox"
additional-css = ["gruvbox/css/variables.css", "gruvbox/highlight.css"]

[output.html.redirect]
# The page was development/walkthrough.md before its name said preflight.
"/development/walkthrough.html" = "preflight-walkthrough.html"
