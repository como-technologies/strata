section: profiles
title: Profiles and packs
about: |
  The profiles of the entity: their order, their versions, their templates, and their variables.
rules:
  - id: profile-order
    title: The order of the add-on profiles means nothing
    engines: [all]
    tier: static
    severity: note
    status: seen
    when: (.profiles | length) > 0
    what: |
      Palette stores the profiles in the order it receives, and the provider sends a set, so two
      clusters from one configuration get two orders. The install order on the cluster is the pack
      priority, not the profile order. Never compare the raw order. This note names an entity with
      more than one add-on profile, where a reader can assume an order.
    check:
      kind: static
      expr: |
        [ .profiles | map(select((.source.type // "") == "add-on"))
          | select(length > 1)
          | "the entity names \(length) add-on profiles (\(map(.source.name) | join(", "))): their order means nothing, and the install order is the pack priority" ]
    fix:
      owner: palette
      text: Sort the profiles by a stated key in the API; the provider keeps the configured order.
    evidence:
      - kind: run
        ref: a live run
        note: the provider discards the configured order
      - kind: run
        ref: a live run
        note: the install order on the cluster does not depend on the profile order
      - kind: source
        note: the profiles are a set since v0.28.1
      - kind: source
        note: Palette orders the packs of the add-on profiles by the priority of each pack, not by the order of the profiles
    tests:
      - fault: fixtures/eks/two-addons.json
        clean: fixtures/eks/full-records.json

  - id: position-zero
    title: The profile at position 0 is the infrastructure profile
    engines: [all]
    tier: static
    severity: warn
    status: source
    when: (.profiles | length) > 0 and (.entity.spec.profiles | length) > 0
    what: |
      Some readers of a cluster read the profile at position 0 as the infrastructure profile. The
      console puts an add-on at position 0 on each cluster it creates with an add-on. Each reader
      then reads the wrong profile, in one case only. The FIPS guard of the console matters in a
      FIPS tenant, and the `clusterProfileTemplate` field of the dashboard API matters to a client
      that reads it. The repave check of CNI and CSI matters when an add-on profile holds a CNI or
      a CSI pack. The check reads the record of the first profile of the entity, whose `type` must
      be `cluster` or `infra`.
    check:
      kind: static
      expr: |
        def addon: (.source.type // "") as $t | $t != "cluster" and $t != "infra";
        .clusterUid as $cluster
        | .entity.spec.profiles[0].uid as $first
        | [ .profiles[] | select(addon) | .source.name as $p | (.packs // [])[]
            | select(.layer == "cni" or .layer == "csi") | "the \(.layer) pack \(.name) of \($p)" ] as $layers
        | [ .profiles[] | select(.source.uid == $first) | select(addon) | .source.name as $p
            | "profile \($p) at position 0 is of type \(.source.type // "unknown"), not cluster or infra: a reader of position 0 reads \($p) as the infrastructure profile",
              "the FIPS guard of the console reads it in a FIPS tenant only",
              "only a client that reads the field clusterProfileTemplate of the dashboard API gets \($p)",
              (if ($layers | length) > 0
                then "the repave check of CNI and CSI can read \($layers | join(", "))"
                else "no add-on profile holds a CNI or a CSI pack, so the repave check of CNI and CSI is right" end),
              (if $cluster == null
                then "put the infrastructure profile at position 0 of spec.profiles of the create"
                else ("the cluster keeps this order, because a PUT of the profiles in another order changes nothing",
                      "read the infrastructure profile by its type in spec.clusterProfileTemplates, and the FIPS mode in status.fips.mode") end) ]
    fix:
      owner: palette
      text: Read the infrastructure profile by its type, not by its position.
    evidence:
      - kind: run
        ref: a live run
        note: the FIPS guard of the console passes when position 0 is an add-on; reproduced against FIPS fixtures
      - kind: source
        note: the position-0 reads and the first-match pack lookups
      - kind: source
        note: the console of Palette guards the FIPS choice when it shows the details of a cluster
    tests:
      - fault: fixtures/eks/addon-first.json
        clean: fixtures/eks/full-records.json

  - id: edit-in-place
    title: A published profile version stays as published
    engines: [all]
    tier: race
    severity: warn
    status: seen
    what: |
      The API takes an edit of a published version: the version keeps its uid and its number, stays
      published, and no new version appears. The `immutable-clusterprofiles` flag of the provider
      stops the edit through the provider alone. The API, the console, and a push again of a pack
      change the version whatever the flag says. No check before the build finds an edit. `strata
      verify` on a record from before reports `DRIFT`, and the audit log names who changed it.
    reproduce:
      - "strata verify <record.json> --who"
    fix:
      owner: palette
      text: Lock a published version on the server, as a setting.
    evidence:
      - kind: run
        ref: strata live example
        note: a PUT of a published version is accepted, and the version keeps its uid and its number
      - kind: doc
        ref: https://docs.spectrocloud.com/profiles/cluster-profiles/modify-cluster-profiles/update-cluster-profile/
      - kind: source
        note: the immutable-clusterprofiles feature_preview flag is a check of the provider

  - id: template-lock-route
    title: The lock of a cluster template covers each route of an edit
    engines: [all]
    tier: race
    severity: warn
    status: seen
    what: |
      A cluster template locks the profile versions it links. The lock refuses a `PUT` of the whole
      version with `ClusterProfileUpdateValidationFailure`, and takes an edit through the route of
      one manifest, `PUT /v1/clusterprofiles/{uid}/packs/{pack}/manifests/{manifest}`, then the
      publish. The linked version changes. No check before the build finds it; `strata verify` on
      a record from before reports `DRIFT`.
    reproduce:
      - "strata verify <record.json> --who"
    fix:
      owner: palette
      text: Check the lock on the route of one pack and of one manifest too.
    evidence:
      - kind: run
        ref: "#81"
      - kind: doc
        ref: https://docs.spectrocloud.com/cluster-templates/

  - id: template-outside
    title: No profile of the entity is linked to a cluster template
    engines: [all]
    tier: palette
    severity: fail
    status: seen
    when: (.entity.spec.profiles | length) > 0
    what: |
      A cluster outside a template cannot use a profile version that a template links: Palette
      refuses the create with `ClusterCreateWithTemplateProfileForbidden`. `GET /v1/clusterprofiles/{uid}`
      lists the templates in `status.inUseClusterTemplates`. The check reads each profile of the
      entity, one request for each, and fails for each profile that a template links when the
      entity names no `clusterTemplate`. An add-on profile is a profile of the entity too.
    check:
      kind: palette
      method: GET
      each: .entity.spec.profiles
      path: /v1/clusterprofiles/{{ $item.uid }}
      expr: |
        (.entity.spec.clusterTemplate // null) as $template
        | [ .responses[] | .item.uid as $u | .response as $r
            | if ($r.ok | not) then "Palette cannot read profile \($u): \($r.body.code // $r.status)"
              elif (($r.body.status.inUseClusterTemplates // []) | length) > 0 and $template == null
              then "profile \($u)\(if ($r.body.metadata.name // "") != "" then " (\($r.body.metadata.name))" else "" end) is linked to the cluster template \([ $r.body.status.inUseClusterTemplates[] | .name // .uid ] | join(", ")), and the entity names no clusterTemplate: Palette refuses the create with ClusterCreateWithTemplateProfileForbidden"
              else empty end ]
    reproduce:
      - "for u in {{ [ .entity.spec.profiles[].uid ] | join(\" \") }}; do {{ palette_curl }} \"${PALETTE_API:-https://api.spectrocloud.com}/v1/clusterprofiles/$u\" | jq '{name: .metadata.name, templates: .status.inUseClusterTemplates}'; done"
    fix:
      owner: none
      text: Build the cluster from the template, or use a version that no template links.
    evidence:
      - kind: run
        ref: "#81"
        note: a cluster outside the template, built with a linked version, is refused
      - kind: source
        note: Palette checks that a cluster template links no profile of the entity
      - kind: doc
        ref: https://docs.spectrocloud.com/cluster-templates/
    tests:
      - fault: fixtures/eks/template-linked.json
        clean: fixtures/eks/full-records.json
      - fault: fixtures/eks/template-linked-second.json

  - id: variables-in-use
    title: The variable definitions of a version in use stay as they are
    engines: [all]
    tier: palette
    severity: note
    status: source
    when: (.entity.spec.profiles | length) > 0
    what: |
      Palette refuses a change of the variable definitions of a profile version that a cluster
      uses. Its message: "you must create a new version of your cluster profile before you can
      modify the variables". The packs, the values, and the manifests have no such rule. This note
      names the clusters that use the first profile of the entity, from `status.inUseClusters`.
    check:
      kind: palette
      method: GET
      path: /v1/clusterprofiles/{{ .entity.spec.profiles[0].uid }}
      expr: |
        .entity.spec.profiles[0].uid as $u
        | if (.response.ok | not) then ["Palette cannot read profile \($u): \(.response.body.code // .response.status)"]
          elif ((.response.body.status.inUseClusters // []) | length) > 0
          then ["profile \(.response.body.metadata.name // $u) is in use by \(.response.body.status.inUseClusters | length | count_of("cluster")) (\([ .response.body.status.inUseClusters[] | .name // .uid ] | join(", "))): a change of its variable definitions is refused; make a new version"]
          else [] end
    reproduce:
      - "{{ palette_curl }} \"${PALETTE_API:-https://api.spectrocloud.com}/v1/clusterprofiles/{{ .entity.spec.profiles[0].uid }}\" | jq '.status.inUseClusters'"
    evidence:
      - kind: source
        note: Palette tests the clusters that use the profile version before it updates the variables
      - kind: doc
        ref: https://docs.spectrocloud.com/profiles/cluster-profiles/create-cluster-profiles/define-profile-variables/modify-cluster-profile-variables/
    tests:
      - fault: fixtures/eks/profile-in-use.json
        clean: fixtures/eks/full-records.json

  - id: version-string
    title: Each profile version is MAJOR.MINOR.PATCH
    engines: [all]
    tier: static
    severity: warn
    status: seen
    when: (.profiles | length) > 0
    what: |
      Palette keeps a version string as given (`1.2`, `v1.2.3`), where its documentation says it
      normalizes it. Two spellings of one version are two versions.
    check:
      kind: static
      expr: |
        [ .profiles[] | select((.source.version // "") | test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)
          | "profile \(.source.name) has the version \(.source.version), not MAJOR.MINOR.PATCH" ]
    evidence:
      - kind: run
        ref: "#81"
    tests:
      - fault: fixtures/eks/version-v.json
        clean: fixtures/eks/clean.json

  - id: macro-flag-scope
    title: The content of a profile reads no macro
    engines: [all]
    tier: static
    severity: note
    status: source
    when: (.profiles | length) > 0
    what: |
      A macro is a name and a value, with no version and no digest. A profile whose values or
      manifests read `{{.spectro.macro.<name>}}` gets a new value at once, in the running cluster.
      No publish, no notification, and no audit entry comes with it. The `immutable-clusterprofiles`
      flag of the provider covers the profile, not the macro. This note names each pack that reads
      a macro.
    check:
      kind: static
      expr: |
        [ .profiles[] | .source.name as $p | .packs[]
          | select((((.values // "") + "\n" + ((.manifests // []) | map(.content // "") | join("\n")))) | test("\\{\\{\\s*\\.spectro\\.macro\\."))
          | "profile \($p): pack \(.name)@\(.version) reads a user macro; a change of the macro value changes the cluster with no publish and no audit entry" ]
    reproduce:
      - "strata snapshot cluster:<uid> --macros"
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/cluster-management/macros/
      - kind: source
        note: the immutable-clusterprofiles feature_preview flag checks the profile resource alone
    tests:
      - fault: fixtures/eks/macro-values.json
        clean: fixtures/eks/addon-profile.json
