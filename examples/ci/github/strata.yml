# Strata on GitHub Actions: the comment, the merge gate, and the scheduled drift report.
#
# Copy this file to .github/workflows/strata.yml in your own repository and set the refs and the
# records that your repository holds. It calls the three reusable workflows of the strata
# repository, so a version bump is one line in three places.
#
# Secrets to set in the repository or the organization:
#   PALETTE_API_KEY     needed to read Palette: for a ref that is not a snapshot file, for the
#                       verify in the merge gate, and for the drift report.
#   STRATA_READ_TOKEN   a token that can read the strata repository, while it is private.
#
# Make the gate the check that the merge button waits for: Settings, Branches, the rule for the
# default branch, "Require status checks to pass" with "Require branches to be up to date".

name: strata

on:
  pull_request:
  schedule:
    # the drift report, every morning; the runs of one repository must stand minutes apart
    - cron: "17 6 * * *"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # one comment on the pull request, and a label from the impact
  comment:
    if: github.event_name == 'pull_request'
    uses: como-technologies/strata/.github/workflows/comment.yml@v0.6.1
    with:
      a: releases/dev.json          # the record the default branch has
      b: candidate.yaml             # what this pull request proposes
      strata-version: v0.6.1
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # the records of the merge result, against the default branch as it is now
  gate:
    if: github.event_name == 'pull_request'
    uses: como-technologies/strata/.github/workflows/merge-gate.yml@v0.6.1
    with:
      records: releases/**/*.json
      strata-version: v0.6.1
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # one issue per record that drifted or could not be checked
  verify:
    if: github.event_name == 'schedule'
    uses: como-technologies/strata/.github/workflows/verify.yml@v0.6.1
    with:
      records: releases/**/*.json
      strata-version: v0.6.1
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}
