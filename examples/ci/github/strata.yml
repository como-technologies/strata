# Strata on GitHub Actions: the comment, the merge gate, the scheduled drift report and upstream
# report, and the two gates that run on demand.
#
# Copy this file to .github/workflows/strata.yml in your own repository and set the refs and the
# records that your repository holds. It calls seven reusable workflows of the strata repository,
# and an eighth when you use the job of the preflight comment.
# A version bump is sixteen lines here: each job names the tag twice, once in `uses: ...@TAG` and once
# in `strata-version:`. Both must carry the same tag. `uses:` selects the workflow file, and
# `strata-version:` is what each workflow checks this repository out at and installs the binary
# for, so a mismatch runs one release's workflow against another release's scripts.
#
# Secrets to set in the repository or the organization:
#   PALETTE_API_KEY     needed to read Palette. A job needs it for a ref that is not a
#                       snapshot file, for `repave: true`, and for the verify of the merge
#                       gate. The drift and upstream reports need it too.
#   STRATA_READ_TOKEN   a token that can read the strata repository, while it is private.
#
# STRATA_REPORT=1 sends the report at the end of a run that wrote a line to the log. A called
# workflow gets no variable from this file, so set it in a job of your own that runs strata. The log
# is in the state folder of the runner, so save the folder when the runner does not stay.
# docs/src/automation/scripts.md says more.
#
# A token does not give access to a reusable workflow of a private repository. While the strata
# repository is private, its access setting must also allow your repository. In the strata
# repository, open Settings, Actions, General, Access. Select "Accessible from repositories in the
# organization". docs/src/automation/pr-comments.md describes both steps.
#
# Make the gate the check that the merge button waits for: Settings, Branches, the rule for the
# default branch, "Require status checks to pass" with "Require branches to be up to date".

name: strata

on:
  pull_request:
  schedule:
    # the drift report and the upstream report, every morning; the runs of one repository must
    # stand minutes apart
    - cron: "17 6 * * *"
  # the two gates below answer a question a person asks at a moment of their choosing, so they run
  # on demand and not on a pull request or a schedule
  workflow_dispatch:
    inputs:
      promote:
        description: The records to check, in promotion order, such as "releases/dev.json releases/prod.json"
        default: ""
      retire:
        description: The profile version to retire, as name@version
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # one comment on the pull request, and a label from the impact
  comment:
    if: github.event_name == 'pull_request'
    uses: como-technologies/strata/.github/workflows/comment.yml@v0.31.0
    with:
      a: releases/dev.json          # the record the default branch has
      b: candidate.yaml             # what this pull request proposes
      # repave: true               # a cluster against a version: the answer of Palette decides the label
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # can Palette build the cluster this pull request changes? The static tier, with the records of
  # this repository: no key, milliseconds. The live tier runs before the build, with the key, from
  # the job that builds: see docs/src/automation/preflight.md
  preflight:
    if: github.event_name == 'pull_request'
    uses: como-technologies/strata/.github/workflows/preflight.yml@v0.31.0
    with:
      source: clusters/payments.json  # the body of the create that this repository keeps
      cloud: eks
      tier: static
      records: releases/**/*.json
      # no-exec: true               # run no command of a cloud tool
      # rule: example-region        # only these rules, by id, separated by spaces
      # verbose: true               # print what each check ran to the log
      # ready: "80"                 # exit 1 when the readiness is under this percentage
      # out: preflight              # the directory of report.md and the other files
      # watch: true                 # source: cluster:UID; the job from the create, with the key,
      # every: "30"                 #   reads the build every 30 seconds
      # limit: "3600"               #   for 3600 seconds at most
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}

  # the report of the preflight as one comment on the pull request, updated on each push. Remove
  # the comment marks to use it. The condition runs the job also after a failed preflight,
  # because a person must read a failed report
  # preflight-comment:
  #   needs: preflight
  #   if: ${{ !cancelled() && github.event_name == 'pull_request' }}
  #   uses: como-technologies/strata/.github/workflows/preflight-comment.yml@v0.31.0
  #   with:
  #     strata-version: v0.31.0
  #   secrets:
  #     strata-token: ${{ secrets.STRATA_READ_TOKEN }}

  # the records of the merge result, against the default branch as it is now
  gate:
    if: github.event_name == 'pull_request'
    uses: como-technologies/strata/.github/workflows/merge-gate.yml@v0.31.0
    with:
      records: releases/**/*.json
      # allow-no-digest: true       # accept a pack from a registry that lists no digest
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # one issue per record that drifted or could not be checked
  verify:
    if: github.event_name == 'schedule'
    uses: como-technologies/strata/.github/workflows/verify.yml@v0.31.0
    with:
      records: releases/**/*.json
      # allow-no-digest: true       # accept a pack from a registry that lists no digest
      # who: true                   # name who changed a record that drifted, from the audit log
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # one issue per pack that a record pins behind a newer version of its registry. Behind is a
  # decision and not an error, so it keeps its own issues, apart from the drift report
  upstream:
    if: github.event_name == 'schedule'
    uses: como-technologies/strata/.github/workflows/upstream.yml@v0.31.0
    with:
      records: releases/**/*.json
      # no-impact: true             # skip the comparison and the question to Palette
      # save: behind.json           # keep the report of the run as the artifact strata-behind
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}

  # the records of a promotion are one release, before a cluster moves
  promote-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.promote != ''
    uses: como-technologies/strata/.github/workflows/promote-gate.yml@v0.31.0
    with:
      records: ${{ inputs.promote }}
      # allow: registry-move no-digest   # the differences to accept, separated by spaces
      # project: dev                     # the project of a ref such as name@version
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}
      # palette-project-uid: ${{ secrets.PALETTE_PROJECT_UID }}   # the project by uid

  # no cluster runs the version, so the delete that follows is safe
  retire-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.retire != ''
    uses: como-technologies/strata/.github/workflows/retire-gate.yml@v0.31.0
    with:
      version: ${{ inputs.retire }}
      strata-version: v0.31.0
    secrets:
      strata-token: ${{ secrets.STRATA_READ_TOKEN }}
      palette-api-key: ${{ secrets.PALETTE_API_KEY }}
