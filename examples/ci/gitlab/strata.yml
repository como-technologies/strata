# Strata on GitLab CI: the comment, the merge gate, the scheduled drift report and upstream
# report, the two gates that run on demand, and the two jobs of the records of the observer.
#
# Include it from .gitlab-ci.yml and set the variables your project needs:
#
#   include:
#     - local: .gitlab/strata.yml      # or a remote: URL, or a component
#   variables:
#     STRATA_VERSION: vX.Y.Z          # a release that carries the seven scripts
#     STRATA_A: releases/dev.json      # the record the target branch has
#     STRATA_B: candidate.yaml         # what this merge request proposes
#     # STRATA_REPAVE: "true"       # a cluster against a version: the answer of Palette decides the label
#     STRATA_RECORDS: "releases/**/*.json"
#
# Each job reads more variables than these; the list below has the default of each one, and
# docs/src/automation/gitlab.md says what each one does.
#
# CI/CD variables to set, masked:
#   GITLAB_TOKEN      a project or group access token with the api scope. The job token cannot
#                     write notes, labels or issues, so the jobs need this one.
#   PALETTE_API_KEY   needed to read Palette. A job needs it for a ref that is not a
#                     snapshot file, for STRATA_REPAVE, and for the verify of the merge
#                     gate. The drift and upstream reports need it too.
#   STRATA_TOKEN      a token that can read the strata releases, while that repository is private.
#
# A CI/CD variable of the type File, for the two jobs of the observer:
#   STRATA_OBSERVER_KUBECONFIG  a kubeconfig of the role publisher of the chart of the observer.
#                               Without it, the two jobs do not run.
#
# STRATA_REPORT: "1" in the variables of a job sends the report at the end of a run that wrote a
# line to the log. The log is in the state folder of the runner, so save the folder when the runner
# does not stay. docs/src/automation/scripts.md says more.
#
# The jobs run on a merge request pipeline. Turn on "Pipelines must succeed" in the project's
# merge request settings, so the merge button waits for strata-merge-gate.

variables:
  STRATA_VERSION: v0.32.0
  STRATA_REPO: como-technologies/strata
  STRATA_LABEL: repave
  STRATA_THRESHOLD: repave
  STRATA_REPAVE: "false"
  STRATA_DRIFT_LABEL: strata-drift
  STRATA_BEHIND_LABEL: strata-behind
  STRATA_ROLLBACK_LABEL: rollback
  # "true" accepts a pack with no upstream digest, in the merge gate and in the drift report
  STRATA_ALLOW_NO_DIGEST: "false"
  # "true" adds who changed a record that drifted, and when, to its drift issue
  STRATA_WHO: "false"
  # "true" skips the comparison of each pin that is behind, and the question to Palette
  STRATA_NO_IMPACT: "false"
  # a file for the report of the upstream job; the job strata-upstream-save keeps it as an artifact.
  # Empty keeps none.
  STRATA_SAVE: ""
  # the differences that the promotion gate accepts, separated by spaces: registry-move no-digest
  STRATA_PROMOTE_ALLOW: ""
  # the preflight job: the source, the cloud, the tiers, the records, and the options of the
  # command by the same names. The default tier is static, with no request to Palette.
  STRATA_PREFLIGHT_SOURCE: clusters/payments.json
  STRATA_PREFLIGHT_CLOUD: eks
  STRATA_PREFLIGHT_CHANGE: ""
  STRATA_PREFLIGHT_TIER: static
  STRATA_PREFLIGHT_RECORDS: "releases/**/*.json"
  STRATA_PREFLIGHT_PROBES: ""
  STRATA_PREFLIGHT_RELEASE: ""
  STRATA_PREFLIGHT_STRICT: "false"
  STRATA_PREFLIGHT_READY: ""
  STRATA_PREFLIGHT_NO_EXEC: "false"
  STRATA_PREFLIGHT_RULE: ""
  STRATA_PREFLIGHT_VERBOSE: "false"
  # "true" watches the build of the cluster in STRATA_PREFLIGHT_SOURCE, which is cluster:UID
  STRATA_PREFLIGHT_WATCH: "false"
  STRATA_PREFLIGHT_EVERY: ""
  STRATA_PREFLIGHT_LIMIT: ""
  STRATA_PREFLIGHT_OUT: preflight
  # "true" posts the report as one note on the merge request, which needs GITLAB_TOKEN
  STRATA_PREFLIGHT_COMMENT: "false"
  # the two jobs of the observer: the folder of the first-seen records, the namespace of the
  # observer, the approved records that the publish job writes, and the version of kubectl
  STRATA_OBSERVER_DIR: releases/observer
  STRATA_OBSERVER_NAMESPACE: strata-observer
  STRATA_OBSERVER_RECORDS: "releases/observer/*.json"
  STRATA_KUBECTL_VERSION: "1.35.0"

# Installs the release binary and the scripts of one strata version, with the checksums checked.
.strata:
  image: debian:stable-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl jq git
    - |
      set -eu
      auth=()
      if [ -n "${STRATA_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $STRATA_TOKEN"); fi
      release="https://api.github.com/repos/$STRATA_REPO/releases/tags/$STRATA_VERSION"
      id=$(curl -fsSL "${auth[@]}" "$release" \
        | jq -r '.assets[] | select(.name == "install-strata.sh") | .id')
      curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" -o install-strata.sh \
        "https://api.github.com/repos/$STRATA_REPO/releases/assets/$id"
      bash install-strata.sh --version "$STRATA_VERSION" --dir "$CI_PROJECT_DIR/.strata"
    - export STRATA_BIN="$CI_PROJECT_DIR/.strata/strata"

# One comment on the merge request that follows each push, and the impact as a label.
strata-comment:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # STRATA_REPAVE "true" asks Palette if the change repaves the cluster, and its answer decides the label
    - |
      repave=""
      if [ "$STRATA_REPAVE" = "true" ]; then repave=--repave; fi
      .strata/pr-comment.sh "$STRATA_A" "$STRATA_B" \
        --label "$STRATA_LABEL" --threshold "$STRATA_THRESHOLD" $repave

# Can Palette build the cluster this merge request changes? The static tier, with the records of
# this repository: no key, milliseconds. The installer puts strata-preflight beside strata, and
# `strata preflight` runs it. The live tier runs before the build, with the key, from the job that
# builds: see docs/src/automation/preflight.md. The report is the job's artifact. The script
# preflight.sh reads the variables STRATA_PREFLIGHT_* and builds the options of the command. The
# reusable workflow sets the same variables from its inputs.
strata-preflight:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # the static tier reads nothing from Palette, so this job does not connect, also when the
    # other jobs have the key
    - |
      offline=""
      if [ "$STRATA_PREFLIGHT_TIER" = static ] && [ "$STRATA_PREFLIGHT_WATCH" != "true" ]; then
        offline=--offline
      fi
      .strata/preflight.sh $offline
  artifacts:
    when: always
    paths: ["$STRATA_PREFLIGHT_OUT/"]

# The check the merge button waits for: the records of the merge result, against the target
# branch as it is now. GIT_DEPTH 0 gives the job the history a merge needs.
strata-merge-gate:
  extends: .strata
  stage: test
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git config user.email "strata@$CI_SERVER_HOST"
    - git config user.name "strata merge gate"
    # the label is how a reviewer says that a backwards pin is a rollback
    - |
      rollback=""
      if printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr ',' '\n' \
        | grep -qx "$STRATA_ROLLBACK_LABEL"; then rollback=--allow-rollback; fi
      allow_no_digest=""
      if [ "$STRATA_ALLOW_NO_DIGEST" = "true" ]; then allow_no_digest=--allow-no-digest; fi
      .strata/merge-gate.sh $STRATA_RECORDS $rollback $allow_no_digest

# A scheduled pipeline: verify every record, and keep one issue open per record that drifted or
# could not be checked. Add the schedule in CI/CD > Schedules.
strata-verify:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      allow_no_digest=""
      if [ "$STRATA_ALLOW_NO_DIGEST" = "true" ]; then allow_no_digest=--allow-no-digest; fi
      who=""
      if [ "$STRATA_WHO" = "true" ]; then who=--who; fi
      .strata/verify-report.sh $STRATA_RECORDS --label "$STRATA_DRIFT_LABEL" $allow_no_digest $who

# The same schedule: keep one issue open per pack that a record pins behind a newer version of its
# registry. Behind is a decision and not an error, so it keeps its own issues and its own job.
# This job keeps no artifact. When STRATA_SAVE names a file, the next job runs in its place.
strata-upstream:
  extends: .strata
  stage: test
  rules:
    - if: $STRATA_SAVE
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      no_impact=""
      if [ "$STRATA_NO_IMPACT" = "true" ]; then no_impact=--no-impact; fi
      save=()
      if [ -n "$STRATA_SAVE" ]; then save=(--save "$STRATA_SAVE"); fi
      .strata/upstream-report.sh $STRATA_RECORDS --label "$STRATA_BEHIND_LABEL" $no_impact \
        "${save[@]+"${save[@]}"}"

# The same job, when STRATA_SAVE names a file. It keeps that file as an artifact. No job has an
# artifact with an empty path.
strata-upstream-save:
  extends: strata-upstream
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $STRATA_SAVE
  artifacts:
    when: always
    paths: ["$STRATA_SAVE"]

# The records of a promotion are one release, before a cluster moves. A manual job: run it from the
# pipeline view, with STRATA_PROMOTE set to the records in promotion order. STRATA_PROMOTE_ALLOW
# lists the differences to accept. A ref such as name@version reads PALETTE_PROJECT (a name) or
# PALETTE_PROJECT_UID, which a CI/CD variable sets.
strata-promote-gate:
  extends: .strata
  stage: test
  when: manual
  rules:
    - if: $STRATA_PROMOTE
  script:
    - |
      allow=()
      for a in $STRATA_PROMOTE_ALLOW; do allow+=(--allow "$a"); done
      $STRATA_BIN same-release $STRATA_PROMOTE "${allow[@]+"${allow[@]}"}"

# No cluster runs the version, so a delete can follow. A manual job: set STRATA_RETIRE to
# name@version. Exit 1 names each cluster that still runs it, and the delete must not run.
strata-retire-gate:
  extends: .strata
  stage: test
  when: manual
  rules:
    - if: $STRATA_RETIRE
  script:
    - $STRATA_BIN consumers "$STRATA_RETIRE"

# kubectl at the version STRATA_KUBECTL_VERSION, with its checksum checked. The two jobs of the
# observer run it.
.kubectl:
  script:
    - |
      set -eu
      at="https://dl.k8s.io/release/v$STRATA_KUBECTL_VERSION/bin/linux/amd64"
      curl -fsSLo /usr/local/bin/kubectl "$at/kubectl"
      echo "$(curl -fsSL "$at/kubectl.sha256")  /usr/local/bin/kubectl" | sha256sum -c -
      chmod +x /usr/local/bin/kubectl

# A scheduled pipeline: read the first-seen records of the observer, and keep one merge request
# open with them, so that a review approves them. GITLAB_TOKEN pushes the branch, because a job
# token cannot push.
strata-observer-propose:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $STRATA_OBSERVER_KUBECONFIG
  script:
    - !reference [.kubectl, script]
    - export KUBECONFIG="$STRATA_OBSERVER_KUBECONFIG"
    - git config user.email "strata@$CI_SERVER_HOST"
    - git config user.name "strata observer"
    - git remote set-url origin "https://oauth2:$GITLAB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - |
      .strata/observer-propose.sh --dir "$STRATA_OBSERVER_DIR" \
        --namespace "$STRATA_OBSERVER_NAMESPACE" --base "$CI_DEFAULT_BRANCH"

# A push to the default branch: write the approved records into the Secrets of the observer, with
# the revision of the push. The page of the observer then removes the notice of the first-seen
# records. A replace removes each key that the records do not hold, also a key of the seed.
strata-observer-publish:
  extends: .strata
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STRATA_OBSERVER_KUBECONFIG
  script:
    - !reference [.kubectl, script]
    - export KUBECONFIG="$STRATA_OBSERVER_KUBECONFIG"
    # the shell expands the patterns, and a pattern that finds no file stops the job
    - |
      set -o pipefail
      set -f
      patterns=($STRATA_OBSERVER_RECORDS)
      set +f
      shopt -s globstar nullglob
      records=()
      for pattern in "${patterns[@]}"; do
        found=($pattern)
        if [ "${#found[@]}" -eq 0 ]; then echo "no record matches $pattern" >&2; exit 2; fi
        records+=("${found[@]}")
      done
      .strata/observer-records.sh --revision "$CI_COMMIT_SHA" \
        --namespace "$STRATA_OBSERVER_NAMESPACE" "${records[@]}" | kubectl replace -f -
