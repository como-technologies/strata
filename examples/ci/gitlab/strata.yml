# Strata on GitLab CI: the comment, the merge gate, the scheduled drift report and upstream
# report, and the two gates that run on demand.
#
# Include it from .gitlab-ci.yml and set the variables your project needs:
#
#   include:
#     - local: .gitlab/strata.yml      # or a remote: URL, or a component
#   variables:
#     STRATA_VERSION: vX.Y.Z          # a release that carries the five scripts
#     STRATA_A: releases/dev.json      # the record the target branch has
#     STRATA_B: candidate.yaml         # what this merge request proposes
#     STRATA_RECORDS: "releases/**/*.json"
#
# CI/CD variables to set, masked:
#   GITLAB_TOKEN      a project or group access token with the api scope. The job token cannot
#                     write notes, labels or issues, so the jobs need this one.
#   PALETTE_API_KEY   needed to read Palette: for a ref that is not a snapshot file, for the
#                     verify in the merge gate, and for the drift and upstream reports.
#   STRATA_TOKEN      a token that can read the strata releases, while that repository is private.
#
# The jobs run on a merge request pipeline. Turn on "Pipelines must succeed" in the project's
# merge request settings, so the merge button waits for strata-merge-gate.

variables:
  STRATA_VERSION: v0.20.0
  STRATA_REPO: como-technologies/strata
  STRATA_LABEL: repave
  STRATA_THRESHOLD: repave
  STRATA_DRIFT_LABEL: strata-drift
  STRATA_BEHIND_LABEL: strata-behind
  STRATA_ROLLBACK_LABEL: rollback

# Installs the release binary and the scripts of one strata version, with the checksums checked.
.strata:
  image: debian:stable-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl jq git
    - |
      set -eu
      auth=()
      if [ -n "${STRATA_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $STRATA_TOKEN"); fi
      release="https://api.github.com/repos/$STRATA_REPO/releases/tags/$STRATA_VERSION"
      id=$(curl -fsSL "${auth[@]}" "$release" \
        | jq -r '.assets[] | select(.name == "install-strata.sh") | .id')
      curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" -o install-strata.sh \
        "https://api.github.com/repos/$STRATA_REPO/releases/assets/$id"
      bash install-strata.sh --version "$STRATA_VERSION" --dir "$CI_PROJECT_DIR/.strata"
    - export STRATA_BIN="$CI_PROJECT_DIR/.strata/strata"

# One comment on the merge request that follows each push, and the impact as a label.
strata-comment:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - .strata/pr-comment.sh "$STRATA_A" "$STRATA_B"
        --label "$STRATA_LABEL" --threshold "$STRATA_THRESHOLD"

# Can Palette build the cluster this merge request changes? The static tier, with the records of
# this repository: no key, milliseconds. The installer puts strata-preflight beside strata, and
# `strata preflight` runs it. The live tier runs before the build, with the key, from the job that
# builds: see docs/src/automation/preflight.md. The report is the job's artifact.
strata-preflight:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - .strata/strata preflight clusters/payments.json --cloud eks --tier static
        --records 'releases/**/*.json' --offline --out preflight --format markdown --quiet
        | tee preflight.md
  artifacts:
    when: always
    paths: [preflight/, preflight.md]

# The check the merge button waits for: the records of the merge result, against the target
# branch as it is now. GIT_DEPTH 0 gives the job the history a merge needs.
strata-merge-gate:
  extends: .strata
  stage: test
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git config user.email "strata@$CI_SERVER_HOST"
    - git config user.name "strata merge gate"
    # the label is how a reviewer says that a backwards pin is a rollback
    - |
      rollback=""
      if printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr ',' '\n' \
        | grep -qx "$STRATA_ROLLBACK_LABEL"; then rollback=--allow-rollback; fi
      .strata/merge-gate.sh $STRATA_RECORDS $rollback

# A scheduled pipeline: verify every record, and keep one issue open per record that drifted or
# could not be checked. Add the schedule in CI/CD > Schedules.
strata-verify:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - .strata/verify-report.sh $STRATA_RECORDS --label "$STRATA_DRIFT_LABEL"

# The same schedule: keep one issue open per pack that a record pins behind a newer version of its
# registry. Behind is a decision and not an error, so it keeps its own issues and its own job.
strata-upstream:
  extends: .strata
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - .strata/upstream-report.sh $STRATA_RECORDS --label "$STRATA_BEHIND_LABEL"

# The records of a promotion are one release, before a cluster moves. A manual job: run it from the
# pipeline view, with STRATA_PROMOTE set to the records in promotion order.
strata-promote-gate:
  extends: .strata
  stage: test
  when: manual
  rules:
    - if: $STRATA_PROMOTE
  script:
    - $STRATA_BIN same-release $STRATA_PROMOTE

# No cluster runs the version, so a delete can follow. A manual job: set STRATA_RETIRE to
# name@version. Exit 1 names each cluster that still runs it, and the delete must not run.
strata-retire-gate:
  extends: .strata
  stage: test
  when: manual
  rules:
    - if: $STRATA_RETIRE
  script:
    - $STRATA_BIN consumers "$STRATA_RETIRE"
