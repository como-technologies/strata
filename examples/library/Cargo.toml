[package]
name = "strata-library-example"
version = "0.1.0"
edition = "2024"
description = "A program that uses the strata library without its command line"
publish = false

[dependencies]
# Inside this repository. Elsewhere, a git dependency on a release tag; see
# docs/src/automation/library.md, Add the dependency.
strata = { path = "../..", package = "strata-palette" }
serde_json = "1"

# Not a member of the strata package: built on its own with `just library-example`.
[workspace]
