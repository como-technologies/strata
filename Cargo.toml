[workspace]
members = [".", "crates/strata-preflight", "crates/strata-report-endpoint", "xtask", "fuzz", "benches"]
# The root package is the strata app: `cargo build` and `cargo test` at the root build it alone.
# crates/ holds the other parts of strata, each in a folder with the name of its package:
# strata-preflight is the second binary of the release, and another repository can depend on it by
# name. strata-report-endpoint is a service on Cloud Run that no release carries. strata-knurl is
# not a member: it builds on its own with `just adapter-test`, so strata never builds knurl.
#
# xtask/, fuzz/, and benches/ are the tools of the development, and no release carries them.
# xtask/ is the stand-in for Palette and the runner of the book. fuzz/ holds the fuzz targets of
# strata, strata-preflight, and strata-report-endpoint. benches/ holds the benchmarks, the package
# strata-benches. `just test` runs the tests of each member, and `just bench` runs the benchmarks.
default-members = ["."]

# Edition 2024 needs 1.85, and the `if let` chains in this workspace need 1.88, which is where they
# became stable. Each member takes this number with `rust-version.workspace = true`, so one line
# names the floor of the workspace. The msrv job of .github/workflows/checks.yml builds with the
# version named here, so this number stays true.
#
# The address of the repository is one line too. `strata report --link` opens an issue there, and
# the endpoint of the report writes its issues there. `examples/live/report-send.sh` reads this line.
# A member that names a repository takes it with `repository.workspace = true`.
[workspace.package]
rust-version = "1.88"
repository = "https://github.com/como-technologies/strata"

[package]
# The name `strata` on crates.io belongs to another crate, so the package is strata-palette (#65).
# `[lib]` and `[[bin]]` keep the name `strata`: Rust code names the crate `strata`, and a person
# types the command `strata`.
name = "strata-palette"
version = "0.33.0"
edition = "2024"
rust-version.workspace = true
description = "Record, compare, and check Spectro Cloud Palette profile versions, the clusters and other objects that run them, and pack versions"
license = "Apache-2.0"
repository.workspace = true
readme = "README.md"
keywords = ["kubernetes", "spectrocloud", "palette", "drift", "diff"]
categories = ["command-line-utilities", "development-tools"]
# A package carries the sources of the library and of the binary, the license, and the README.
# Cargo adds the manifest and Cargo.lock. The book, the examples, the tests, the observer, and the
# tools of the development need the rest of this repository. So a package carries none of them.
# A list of what goes in keeps a new folder of the repository out of the package.
include = ["/src/", "/LICENSE", "/README.md"]
# The tests under tests/ are one crate, tests/main.rs: each file is a module of it. So a helper of
# tests/common/mod.rs with no caller in any test warns as dead code. 14 crates with a copy of the
# module each could not show that.
autotests = false
# benches/ is the package strata-benches, with a Cargo.toml of its own. Without this line, cargo
# also builds each file of benches/ as a benchmark of this package.
autobenches = false

[lib]
name = "strata"
path = "src/lib.rs"

[[bin]]
name = "strata"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
chrono = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
hex = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.11"
similar = "2"
thiserror = "2"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
# The test of the order of versions compares strata with this crate (#714). Pin it, so that a
# new release of the crate does not change the order under the test.
versions = "=8.0.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# These lints are in no default group of clippy. They keep the rules of "Comments" in
# docs/src/development/code.md: `just lint` fails on a comment that breaks one.
[lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"
too_long_first_doc_paragraph = "deny"
doc_markdown = "deny"

[profile.release]
strip = true
lto = "thin"

# The profile that `cargo bolero` builds the fuzz targets with. It is the profile that the tool
# expects. The profile is optimized and has one unit of code generation for each crate, so the
# coverage counters of libFuzzer cover the whole crate. See `just fuzz`.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
