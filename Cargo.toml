[package]
name = "strata"
version = "0.2.0"
edition = "2021"
description = "Record, compare, and verify Spectro Cloud Palette cluster profile versions as immutable, layered releases"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
