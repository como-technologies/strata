[workspace]
members = [".", "xtask", "preflight", "fuzz", "benches", "report-endpoint"]
# `cargo build` and `cargo test` at the root stay about strata alone. The development tooling in
# xtask/ builds when a recipe asks for it, and it never reaches a release. The preflight tool in
# preflight/ is a package of its own, `strata-preflight`. The release carries it as a second
# binary, `just build` builds it, and another repository can depend on it by name. The fuzz
# targets in fuzz/ are tests of both, and `just test` runs them.
#
# The benchmarks in benches/ are the package `strata-benches`: `just bench` builds them, and no
# release carries them. The endpoint of the report in report-endpoint/ is the package
# `strata-report-endpoint`. It is a service on Cloud Run that no release carries, and `just test`
# runs its tests.
default-members = ["."]

# Edition 2024 needs 1.85, and the `if let` chains in this workspace need 1.88, which is where they
# became stable. Each member takes this number with `rust-version.workspace = true`, so one line
# names the floor of the workspace. The msrv job of .github/workflows/checks.yml builds with the
# version named here, so this number stays true.
[workspace.package]
rust-version = "1.88"

[package]
name = "strata"
version = "0.27.0"
edition = "2024"
rust-version.workspace = true
description = "Record, compare, and check Spectro Cloud Palette profile versions, the clusters and other objects that run them, and pack versions"
license = "Apache-2.0"
repository = "https://github.com/como-technologies/strata"
readme = "README.md"
keywords = ["kubernetes", "spectrocloud", "palette", "drift", "diff"]
categories = ["command-line-utilities", "development-tools"]
# The book and the examples belong to this repository, and a package a consumer builds needs
# neither. `.cargo/` goes with them: its alias names the xtask package, which a published package
# does not carry, so the alias would fail for whoever unpacks one.
exclude = ["docs/", "examples/", ".github/", ".cargo/"]
# crates.io carries no private crate, and this repository is private, so a publish would make the
# sources public. Two things must happen before this line goes: the repository becomes public, and
# the package takes another name, because `strata` on crates.io belongs to another crate.
publish = false
# The tests under tests/ are one crate, tests/main.rs: each file is a module of it. So a helper of
# tests/common/mod.rs with no caller in any test warns as dead code. 14 crates with a copy of the
# module each could not show that.
autotests = false
# benches/ is the package strata-benches, with a Cargo.toml of its own. Without this line, cargo
# also builds each file of benches/ as a benchmark of this package.
autobenches = false

[lib]
name = "strata"
path = "src/lib.rs"

[[bin]]
name = "strata"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
hex = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
thiserror = "2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# These lints are in no default group of clippy. They keep the rules of "Comments" in
# docs/src/development/code.md: `just lint` fails on a comment that breaks one.
[lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"
too_long_first_doc_paragraph = "deny"
doc_markdown = "deny"

[profile.release]
strip = true
lto = "thin"

# The profile that `cargo bolero` builds the fuzz targets with. It is the profile that the tool
# expects. The profile is optimized and has one unit of code generation for each crate, so the
# coverage counters of libFuzzer cover the whole crate. See `just fuzz`.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
