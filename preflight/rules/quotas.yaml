section: quotas
title: Quotas and limits
about: |
  The quotas of the cloud and the floors of Palette: what a build asks for, against what the
  account can give.
rules:
  - id: aws-quotas
    title: The vCPU quota of the region covers the pools
    engines: [aws, eks]
    tier: cloud
    severity: fail
    status: source
    what: |
      A build asks EC2 for the vCPUs of each pool, one VPC, one internet gateway, and a load
      balancer. Each zone adds an elastic IP and a NAT gateway. A quota that is short fails during
      the build with `VcpuLimitExceeded`, `VpcLimitExceeded`, `AddressLimitExceeded`, or
      `NatGatewayLimitExceeded`. Palette reads no quota, and no route of Palette lists one.

      The check reads one quota, the on-demand standard vCPUs (`L-1216C47A`), from the tool of the
      cloud. It compares the value with the vCPUs the on-demand pools ask for. The vCPUs of a type
      are the field `cpu` of the instance type route of Palette.

      When the query says nothing, the route lists only the types with 2 vCPUs or more and 4 GiB of
      memory or more. The check sends `cpuGtEq=0&memoryGtEq=0`, so the route lists the small types
      too. The route still omits some types, such as the old families. A pool of such a type fails
      the check, because the check cannot count its vCPUs. The check does not read the usage, so a
      pass is not a proof. The other quotas are in the reproduce lines.
    when: .entity.spec.cloudAccountUid != null
    check:
      kind: exec
      needs: [aws]
      palette:
        path: '/v1/clouds/{{ .accountKind }}/regions/{{ .entity.spec.cloudConfig.region }}/instancetypes?cloudAccountUid={{ .entity.spec.cloudAccountUid }}&cpuGtEq=0&memoryGtEq=0'
      argv:
        - aws
        - service-quotas
        - get-service-quota
        - --service-code
        - ec2
        - --quota-code
        - L-1216C47A
        - --region
        - "{{ .entity.spec.cloudConfig.region }}"
        - --output
        - json
      expr: |
        .entity.spec.cloudConfig.region as $r
        | if (.response.ok | not) then ["Palette cannot list the instance types of region \($r): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          elif ((.response.body.instanceTypes | type) != "array") then ["Palette gave no list of instance types for region \($r)"]
          elif .exec.exit != 0 then ["aws service-quotas get-service-quota failed: \(.exec.stderr | .[:200])"]
          else .response.body.instanceTypes as $types
          | ([ .entity.spec.machinepoolconfig[]
               | select((.cloudConfig.capacityType // "on-demand") != "spot")
               | select((.poolConfig.size // 0) > 0)
               | (.cloudConfig.instanceType // "") as $t
               | { name: .poolConfig.name, size: .poolConfig.size, type: $t, cpu: ([ $types[] | select(.type == $t) | .cpu | select(type == "number") ] | first // null) } ]) as $pools
          | ([ $pools[] | select(.cpu != null) | .size * .cpu ] | add // 0) as $need
          | (.exec.stdout.Quota.Value // 0) as $q
          | (if $q < $need
             then ["the on-demand vCPU quota L-1216C47A in \($r) is \($q), and the pools ask for \($need) vCPUs: \([ $pools[] | select(.cpu != null) | "\(.size) x \(.type)" ] | join(", "))"]
             else [] end)
            + [ $pools[] | select(.cpu == null) | "pool \(.name): the instance type route of Palette lists no cpu for the type \(.type) in region \($r). The check cannot count the vCPUs of the pool." ]
          end
    reproduce:
      - "aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value   # on-demand standard vCPUs; L-34B43A08 is the spot vCPUs; L-0263D0A3 is the elastic IPs"
      - "aws service-quotas get-service-quota --service-code vpc --quota-code L-F678F1CE --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value   # VPCs for each region; L-A4707A72 internet gateways; L-FE5A380F NAT gateways for each zone"
      - "aws service-quotas get-service-quota --service-code elasticloadbalancing --quota-code L-E9E9831D --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value   # application load balancers; L-69A177A2 network load balancers"
      - "aws ec2 describe-vpcs --region {{ .entity.spec.cloudConfig.region }} --query 'length(Vpcs)'; aws ec2 describe-addresses --region {{ .entity.spec.cloudConfig.region }} --query 'length(Addresses)'; aws ec2 describe-nat-gateways --region {{ .entity.spec.cloudConfig.region }} --query 'length(NatGateways)'   # the usage"
    fix:
      owner: palette
      text: A preflight route that reads the quotas and the usage, and reports "unknown" without the permission.
    evidence:
      - kind: doc
        ref: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-resource-limits.html
      - kind: doc
        ref: https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html
      - kind: source
        note: the instance type route of Palette lists the vCPUs of each type in the field cpu. With no filter in the query, it drops each type under 2 vCPUs or 4 GiB. No route lists a quota.
    tests:
      - fault: fixtures/aws/vcpu-quota-low.json
        clean: fixtures/aws/vcpu-quota-clean.json
      - fault: fixtures/aws/vcpu-quota-list-refused.json
      - fault: fixtures/aws/vcpu-quota-type-not-listed.json
      - fault: fixtures/aws/vcpu-quota-small-type.json
        clean: fixtures/aws/vcpu-quota-small-type-clean.json

  - id: eks-quotas
    title: The EKS quotas cover the cluster and its node groups
    engines: [eks]
    tier: cloud
    severity: fail
    status: source
    what: |
      EKS limits the clusters in a region (`L-1194D53C`, 100 by default). It limits the managed node
      groups of a cluster (`L-6D54EA21`, 30), and the nodes of a node group (`L-BD136A63`, 450). A
      build over a limit fails with `ResourceLimitExceeded`. The check reads the nodes for each node group
      and compares the value with the size and the maximum size of each worker pool. The clusters in
      the region need the usage too; that line is in the reproduce lines.
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - service-quotas
        - get-service-quota
        - --service-code
        - eks
        - --quota-code
        - L-BD136A63
        - --region
        - "{{ .entity.spec.cloudConfig.region }}"
        - --output
        - json
      expr: |
        .entity.spec.cloudConfig.region as $r
        | if .exec.exit != 0 then ["aws service-quotas get-service-quota failed: \(.exec.stderr | .[:200])"]
          else (.exec.stdout.Quota.Value // 0) as $q
          | [ .entity.spec.machinepoolconfig[]
              | select((.poolConfig.isControlPlane // false) | not)
              | (if (.poolConfig.maxSize // 0) > (.poolConfig.size // 0) then .poolConfig.maxSize else (.poolConfig.size // 0) end) as $n
              | select($n > $q)
              | "pool \(.poolConfig.name) asks for \($n) nodes, and the quota L-BD136A63 (nodes for each managed node group) in \($r) is \($q)" ]
          end
    reproduce:
      - "aws service-quotas get-service-quota --service-code eks --quota-code L-1194D53C --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value; aws eks list-clusters --region {{ .entity.spec.cloudConfig.region }} --query 'length(clusters)'   # clusters for each region, and the usage"
      - "aws service-quotas get-service-quota --service-code eks --quota-code L-6D54EA21 --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value   # managed node groups for each cluster; the entity has {{ [ .entity.spec.machinepoolconfig[] | select((.poolConfig.isControlPlane // false) | not) ] | length }} worker pool(s)"
      - "aws service-quotas get-service-quota --service-code eks --quota-code L-BD136A63 --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value   # nodes for each managed node group"
    fix:
      owner: palette
      text: A preflight route that reads the quotas and the usage, and reports "unknown" without the permission.
    evidence:
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/userguide/service-quotas.html
    tests:
      - fault: fixtures/eks/node-quota-low.json
        clean: fixtures/eks/node-quota-clean.json

  - id: aws-sg-rules
    title: The rules of a security group stay under the quota
    engines: [aws]
    tier: cloud
    severity: warn
    status: inferred
    what: |
      CAPA writes the rules of the node security group, and the CNI and the load balancers add more.
      The quota `L-E79EC296` (inbound or outbound rules for each security group, 60 by default) can
      run out during the build or later, with `RulesPerSecurityGroupLimitExceeded`. No security group
      exists before the build, so a check needs the groups of a cluster that runs: the reproduce lines
      read them. This is a reading of the source, not a run.
    reproduce:
      - "aws service-quotas get-service-quota --service-code vpc --quota-code L-E79EC296 --region {{ .entity.spec.cloudConfig.region }} --query Quota.Value"
      - "aws ec2 describe-security-groups --region {{ .entity.spec.cloudConfig.region }} --filters Name=tag-key,Values=sigs.k8s.io/cluster-api-provider-aws/role --query 'SecurityGroups[].[GroupId,GroupName,length(IpPermissions),length(IpPermissionsEgress)]' --output table   # the groups CAPA made, during or after the build"
    fix:
      owner: palette
      text: Report the quota and the count of rules in a preflight route, with "unknown" without the permission.
    evidence:
      - kind: doc
        ref: https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html#vpc-limits-security-groups

  - id: gcp-quotas
    title: The CPU quota of the region covers the pools
    engines: [gcp, gke]
    tier: cloud
    severity: fail
    status: source
    what: |
      A build asks the region for CPUs, in-use addresses, disk, and instance groups, and the project
      for networks, firewalls, and routers. A quota that is short fails with `QUOTA_EXCEEDED`, in an
      event for GKE and in the machine status for GCP. Palette reads no quota, and no route of
      Palette lists one.

      The check reads the quotas of the region from the tool of the cloud. It compares the free
      `CPUS` (limit minus usage) with the CPUs the pools ask for. The CPUs of a machine type are the
      field `cpu` of the instance type route of Palette.

      When the query says nothing, the route lists only the types with 2 CPUs or more and 4 GiB of
      memory or more. The check sends `cpuGtEq=0&memoryGtEq=0`, so the route lists the small types
      too. The route still omits some types. A pool of such a type fails the check, because the
      check cannot count its CPUs. A family with its own metric (`N2_CPUS`, `C3_CPUS`) has its own
      limit, in the same output; the check does not read it.
    when: .entity.spec.cloudAccountUid != null
    check:
      kind: exec
      needs: [gcloud]
      palette:
        path: '/v1/clouds/{{ .accountKind }}/regions/{{ .entity.spec.cloudConfig.region }}/instancetypes?cloudAccountUid={{ .entity.spec.cloudAccountUid }}&cpuGtEq=0&memoryGtEq=0'
      argv:
        - gcloud
        - compute
        - regions
        - describe
        - "{{ .entity.spec.cloudConfig.region }}"
        - --project
        - "{{ .entity.spec.cloudConfig.project }}"
        - --format
        - json
      expr: |
        .entity.spec.cloudConfig.region as $r
        | if (.response.ok | not) then ["Palette cannot list the instance types of region \($r): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          elif ((.response.body.instanceTypes | type) != "array") then ["Palette gave no list of instance types for region \($r)"]
          elif .exec.exit != 0 then ["gcloud compute regions describe failed: \(.exec.stderr | .[:200])"]
          else .response.body.instanceTypes as $types
          | ([ .entity.spec.machinepoolconfig[]
               | select((.poolConfig.size // 0) > 0)
               | (.cloudConfig.instanceType // "") as $t
               | { name: .poolConfig.name, size: .poolConfig.size, type: $t, cpu: ([ $types[] | select(.type == $t) | .cpu | select(type == "number") ] | first // null) } ]) as $pools
          | ([ $pools[] | select(.cpu != null) | .size * .cpu ] | add // 0) as $need
          | ([ (.exec.stdout.quotas // [])[] | select(.metric == "CPUS") ] | .[0]) as $q
          | (if $q == null then ["no CPUS quota in the output of gcloud compute regions describe \($r)"]
             elif ($q.limit - $q.usage) < $need
             then ["CPUS in \($r): limit \($q.limit), usage \($q.usage), free \($q.limit - $q.usage); the pools ask for \($need) CPUs: \([ $pools[] | select(.cpu != null) | "\(.size) x \(.type)" ] | join(", "))"]
             else [] end)
            + [ $pools[] | select(.cpu == null) | "pool \(.name): the instance type route of Palette lists no cpu for the type \(.type) in region \($r). The check cannot count the CPUs of the pool." ]
          end
    reproduce:
      - "gcloud compute regions describe {{ .entity.spec.cloudConfig.region }} --project {{ .entity.spec.cloudConfig.project }} --format='table(quotas.metric,quotas.limit,quotas.usage)' | grep -E 'CPUS|IN_USE_ADDRESSES|SSD_TOTAL_GB|INSTANCE_GROUPS'"
      - "gcloud compute project-info describe --project {{ .entity.spec.cloudConfig.project }} --format='table(quotas.metric,quotas.limit,quotas.usage)' | grep -E 'NETWORKS|FIREWALLS|ROUTERS'"
    fix:
      owner: palette
      text: Read the region and project quotas in the GCP property route.
    evidence:
      - kind: doc
        ref: https://cloud.google.com/compute/resource-usage
    tests:
      - fault: fixtures/gke/cpu-quota-low.json
        clean: fixtures/gke/cpu-quota-clean.json
      - fault: fixtures/gke/cpu-quota-small-type.json
      - fault: fixtures/gke/cpu-quota-type-not-listed.json

  - id: worker-cpu-floor
    title: The workers have the CPU the packs need
    engines: [aws, gcp, gke, azure, aks, maas, vsphere]
    tier: palette
    severity: fail
    status: seen
    what: |
      The packs of the profiles need a minimum of CPU across the worker nodes: 4.1 cores with the
      lab packs, 5.3 with a monitoring stack. Palette refuses the create with "A minimum allocation
      of '4.1' CPU cores is required across all worker nodes". The validate route answers it in
      seconds, with the machine pools that fall short. On EKS the route reports no CPU floor for a
      managed node group. One `t3.xlarge` worker got `200` with no error; the aws route answers
      `MachinePoolWithMinCpuRequired` for the same pool. No run shows whether the EKS create fails
      later, so on EKS a pass is not a proof. `palette-validate` calls the same route and reports
      every error of it; this rule reads the CPU and memory errors of the pools alone.
    check:
      kind: palette
      method: POST
      path: /v1/spectroclusters/{{ .routeCloud }}/validate
      # the world gives the one body that each check of the route sends
      body: .validateBody
      expr: |
        .response as $r
        | if ($r.ok | not) then [] # a refusal of the whole entity is palette-validate's
          else [ ($r.body.machinePools.results // [])[] | .name as $n | (.errors // [])[]
                 | select((.message // "") | test("CPU|memory|cores"; "i"))
                 | "pool \($n): \(.message)" ]
          end
    fix:
      owner: provider
      text: Call the validate route at plan time.
    evidence:
      - kind: run
        ref: teardown lab
      - kind: run
        ref: preflight-plan eks 20260929T042910Z
        note: the EKS route answered 200 with no pool error for one t3.xlarge worker; the aws route answers MachinePoolWithMinCpuRequired for the same pool
      - kind: source
        note: Palette checks the resources of the machines against what the packs need
    tests:
      - fault: fixtures/eks/validate-cpu.json
        clean: fixtures/eks/clean.json

  - id: vcluster-min
    title: A virtual cluster has 3 cores or more
    engines: [all]
    tier: static
    severity: fail
    status: seen
    what: |
      Scope: cluster groups and the virtual clusters in them. Palette refuses a CPU limit under 3
      cores, and a memory limit under 3 GiB, in the limit config of a cluster group. A virtual
      cluster asks its size with `instanceType.maxCPU` of its pool. A virtual cluster is not a cloud
      type of strata-preflight, so there is no check here; the reproduce lines read the two sizes.
    reproduce:
      - "jq '.spec.machinepoolconfig[].cloudConfig.instanceType' virtual-cluster.json   # maxCPU must be 3 or more"
      - "curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/clustergroups/<uid>\" | jq .spec.clustersConfig.limitConfig"
    fix:
      owner: none
    evidence:
      - kind: run
        ref: teardown lab
      - kind: source
        note: Palette refuses a CPU limit under 3 cores, and a memory limit under 3 GiB or over 100000 GiB

  - id: azure-vcpu-quota
    title: The regional vCPU quota covers the pools
    engines: [azure, aks]
    tier: cloud
    severity: fail
    status: inferred
    what: |
      Azure refuses a virtual machine over the regional vCPU quota, or over the quota of the VM
      family, with `OperationNotAllowed`. Palette checks no Azure quota, and no route of Palette
      lists one; the docs leave the capacity to the operator. The check sums the vCPUs of the pools
      and compares them with the free `cores` of `az vm list-usage`.

      The vCPUs of a size are the field `cpu` of the instance type route of Palette. When the query
      says nothing, the route lists only the sizes with 2 vCPUs or more and 4 GiB of memory or more.
      The check sends `cpuGtEq=0&memoryGtEq=0`, so the route lists the small sizes too. A pool of a
      size that the route still does not list fails the check, because the check cannot count its
      vCPUs.

      On AKS the control plane pool has no node. The family quota can be lower than the regional
      one; the reproduce line prints it.
    when: .entity.spec.cloudAccountUid != null
    check:
      kind: exec
      needs: [az]
      palette:
        path: '/v1/clouds/{{ .accountKind }}/regions/{{ .entity.spec.cloudConfig.location }}/instancetypes?cloudAccountUid={{ .entity.spec.cloudAccountUid }}&subscriptionId={{ .entity.spec.cloudConfig.subscriptionId }}&cpuGtEq=0&memoryGtEq=0'
      argv:
        - az
        - vm
        - list-usage
        - --location
        - "{{ .entity.spec.cloudConfig.location }}"
        - --subscription
        - "{{ .entity.spec.cloudConfig.subscriptionId }}"
        - --output
        - json
      expr: |
        .cloud as $cloud | .entity.spec.cloudConfig.location as $loc
        | if (.response.ok | not) then ["Palette cannot list the instance types of region \($loc): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          elif ((.response.body.instanceTypes | type) != "array") then ["Palette gave no list of instance types for region \($loc)"]
          elif .exec.exit != 0 then ["az vm list-usage failed: \(.exec.stderr | .[:200])"]
          else .response.body.instanceTypes as $types
          | ([ .entity.spec.machinepoolconfig[] | select(($cloud == "aks" and (.poolConfig.isControlPlane // false)) | not)
               | (.cloudConfig.instanceType // "") as $t
               | { name: .poolConfig.name, size: (.poolConfig.size // 0), type: $t, cpu: ([ $types[] | select(.type == $t) | .cpu | select(type == "number") ] | first // null) } ]) as $pools
          | ([ $pools[] | select(.cpu != null) | .size * .cpu ] | add // 0) as $need
          | ([ (.exec.stdout // [])[] | select(.name.value == "cores") ] | first) as $cores
          | (if $cores == null then ["az vm list-usage gave no cores row for \($loc)"]
             else (($cores.limit // 0) - ($cores.currentValue // 0)) as $free
               | if $need > $free then ["the pools ask for \($need) vCPUs in \($loc), and the regional quota has \($free) free of \($cores.limit) (\($cores.currentValue) in use). Azure refuses the machines with OperationNotAllowed. The family quota of each type can be lower."] else [] end
             end)
            + [ $pools[] | select(.cpu == null and .size > 0) | "pool \(.name): the instance type route of Palette lists no cpu for the size \(.type) in region \($loc). The check cannot count the vCPUs of the pool." ]
          end
    reproduce:
      - "az vm list-usage --location {{ .entity.spec.cloudConfig.location }} --subscription {{ .entity.spec.cloudConfig.subscriptionId }} --query \"[?name.value=='cores' || contains(name.localizedValue, 'Family vCPUs')].[name.localizedValue,currentValue,limit]\" --output table"
      - "az vm list-skus --location {{ .entity.spec.cloudConfig.location }} --size {{ .entity.spec.machinepoolconfig[0].cloudConfig.instanceType }} --query '[].[name,family,capabilities[?name==`vCPUs`].value|[0]]' --output table"
    fix:
      owner: palette
      text: Read the usage of the region and the family in the validate route, with the vCPU count of the catalog.
    evidence:
      - kind: doc
        ref: https://learn.microsoft.com/en-us/azure/quotas/per-vm-quota-requests
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/azure/create-azure-cluster/
        note: ensure there is sufficient capacity in the preferred Azure region for vCPUs, VNets, and public IP addresses
      - kind: source
        note: name, reserved tags, instance type lookup, and profiles; no quota
    tests:
      - fault: fixtures/azure/vcpu-quota-low.json
        clean: fixtures/azure/vcpu-quota-clean.json
      - fault: fixtures/azure/vcpu-quota-small-size.json
      - fault: fixtures/azure/vcpu-quota-size-not-listed.json
