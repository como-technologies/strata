section: networking
title: Networking
about: |
  The zones, the subnets, the CIDRs, the routes, and the endpoints that a build needs. The section
  with the most rows and the least evidence: the lab runs go here first.
rules:
  - id: eks-one-zone
    title: EKS needs subnets in two zones
    engines: [eks]
    tier: static
    severity: fail
    status: source
    what: |
      EKS needs subnets in two availability zones or more. Palette checks the count of the control
      plane subnets, not the count of distinct zones. So a cluster with one zone passes each check
      of Palette and fails during the build.
    check:
      kind: static
      expr: |
        def zones: [ (.cloudConfig.azs // [])[], (.cloudConfig.subnets // [])[].az ] | map(select(. != null and . != "")) | unique;
        [ .entity.spec.machinepoolconfig[]
          | select((.cloudConfig.azs // []) != [] or (.cloudConfig.subnets // []) != [])
          | select((zones | length) < 2)
          | "pool \(.poolConfig.name) names \(zones | length) zone(s) (\(zones | join(", "))); EKS needs 2 or more" ]
    fix:
      owner: palette
      text: Check the count of distinct zones in the EKS validate route.
    reproduce:
      - "aws ec2 describe-subnets --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'Subnets[].AvailabilityZone' --output text | tr '\\t' '\\n' | sort -u"
    evidence:
      - kind: report
        ref: palette-precreate-validation-gaps-findings-2026-09-28 F6
      - kind: source
        note: no minimum count of zones for EKS
    tests:
      - fault: fixtures/eks/one-zone.json
        clean: fixtures/eks/clean.json

  - id: eks-unsupported-zone
    title: Each zone of the pools takes an EKS cluster
    engines: [eks]
    tier: cloud
    severity: fail
    status: inferred
    what: |
      EKS takes no cluster subnet in the zones use1-az3 (us-east-1), usw1-az2 (us-west-1), and
      cac1-az3 (ca-central-1), and none in a Local Zone or a Wavelength Zone. The build fails with
      `UnsupportedAvailabilityZoneException`. The zone id behind a name such as us-east-1e differs
      for each account, so the check asks EC2 for the ids of the zones the pools name. Palette does
      not check the zone.
    when: ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.azs // [])[], ((.cloudConfig.subnets // [])[] | .az // empty) ] | map(select(. != null and . != "")) | unique | length) > 0
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-availability-zones
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=zone-name,Values={{ [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.azs // [])[], ((.cloudConfig.subnets // [])[] | .az // empty) ] | map(select(. != null and . != "")) | unique | join(",") }}'
        - --output
        - json
      expr: |
        def zones: [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.azs // [])[], ((.cloudConfig.subnets // [])[] | .az // empty) ] | map(select(. != null and . != "")) | unique;
        .entity.spec.cloudConfig.region as $region | zones as $want
        | if .exec.exit != 0 then ["aws ec2 describe-availability-zones failed: \(.exec.stderr | .[:200])"]
          else (.exec.stdout.AvailabilityZones // []) as $z
            | ["use1-az3", "usw1-az2", "cac1-az3"] as $refused
            | [ ($want[] | select(. as $n | ($z | map(.ZoneName) | index($n)) == null) | "zone \(.) is not in region \($region) for this account"),
                ($z[] | . as $zone | select(($refused | index($zone.ZoneId)) != null) | "zone \(.ZoneName) is \(.ZoneId): EKS takes no cluster subnet in it"),
                ($z[] | select((.ZoneType // "availability-zone") != "availability-zone") | "zone \(.ZoneName) is a \(.ZoneType): EKS takes no cluster subnet in a Local Zone or a Wavelength Zone"),
                ($z[] | select((.State // "available") != "available") | "zone \(.ZoneName) is \(.State), not available") ]
          end
    reproduce:
      - "aws ec2 describe-availability-zones --region {{ .entity.spec.cloudConfig.region }} --query 'AvailabilityZones[].[ZoneName,ZoneId,ZoneType,State]' --output table"
    fix:
      owner: palette
      text: Check the zone ids of the pools against the list of EKS in the validate route.
    evidence:
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/userguide/network-reqs.html
        note: the table of disallowed zone ids, and no Outposts or Wavelength subnet for the cluster
    tests:
      - fault: fixtures/eks/zone-use1-az3.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: aws-dynamic-cidr-overlap
    title: The pod and service CIDRs stay outside the VPC of dynamic placement
    engines: [aws]
    tier: static
    severity: fail
    status: source
    what: |
      For dynamic placement (no vpcId) Palette makes the VPC with 10.0.0.0/16. A pod CIDR or a
      service CIDR of the Kubernetes pack inside it breaks the routes of the nodes. Palette checks
      the CIDRs against the VPC for static placement alone: `validatePackValues` returns at once
      when vpcId is empty. The check reads `pack.podCIDR` and `pack.serviceClusterIpRange`, or the
      kubeadm `networking.podSubnet` and `serviceSubnet`, of the Kubernetes pack.
    when: (.profiles | length) > 0
    check:
      kind: static
      expr: |
        def is_cidr: type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$");
        def ip($s): $s | split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net($cidr; $p): ip($cidr | split("/")[0]) as $n | reduce range(0; 32 - $p) as $i ($n; (. / 2) | floor);
        def overlaps($a; $b): ([($a | split("/")[1] | tonumber), ($b | split("/")[1] | tonumber)] | min) as $p | net($a; $p) == net($b; $p);
        def k8s_cidrs: [ .profiles[]? | .packs[]? | select(.layer == "k8s") | .name as $n | .valuesCanon as $v
          | {name: $n, field: "pack.podCIDR", cidr: ($v.pack.podCIDR // $v.kubeadmconfig.clusterConfiguration.networking.podSubnet)},
            {name: $n, field: "pack.serviceClusterIpRange", cidr: ($v.pack.serviceClusterIpRange // $v.kubeadmconfig.clusterConfiguration.networking.serviceSubnet)}
          | select(.cidr | is_cidr) ];
        if (.entity.spec.cloudConfig.vpcId // "") != "" then []
        else [ k8s_cidrs[] | select(overlaps(.cidr; "10.0.0.0/16"))
               | "pack \(.name) sets \(.field) \(.cidr), which overlaps the VPC CIDR 10.0.0.0/16 of dynamic placement; Palette skips this check when vpcId is empty" ] end
    fix:
      owner: palette
      text: Run the CIDR check against 10.0.0.0/16 for dynamic placement too.
    evidence:
      - kind: source
        note: '"no validation for dynamic placement" when vpcId is empty; validateK8SCidr tests the VPC CIDR against pack.podCIDR and pack.serviceClusterIpRange'
      - kind: source
        note: 10.0.0.0/16, which Palette uses for the VPC of dynamic placement
    tests:
      - fault: fixtures/aws/pod-cidr-in-vpc.json
        clean: fixtures/aws/clean.json

  - id: aws-local-zone-letter
    title: Each zone of dynamic placement ends in its own letter
    engines: [aws]
    tier: static
    severity: fail
    status: source
    what: |
      For dynamic placement Palette derives the two subnet CIDRs of each zone from the last letter
      of the zone name (`getAwsAZSubnetCidr`). The letter a gives 10.0.0.0/24 and 10.0.1.0/24, and
      b gives 10.0.2.0/24 and 10.0.3.0/24. A Local Zone or a Wavelength Zone such as us-east-1-bos-1a ends
      in the letter of a parent zone, so two zones get one CIDR pair, and the VPC create fails.
    check:
      kind: static
      expr: |
        if (.entity.spec.cloudConfig.vpcId // "") != "" then []
        else ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.azs // [])[] ] | map(select(. != null and . != "")) | unique) as $zones
          | [ $zones | group_by(.[-1:]) | .[] | select(length > 1)
              | (.[0] | .[-1:] | explode[0] - 97) as $i
              | "zones \(join(", ")) end in the letter \(.[0] | .[-1:]): Palette derives the subnet CIDRs 10.0.\($i * 2).0/24 and 10.0.\($i * 2 + 1).0/24 from that letter for each of them, and the second pair collides" ] end
    fix:
      owner: palette
      text: Refuse two zones with one last letter, or derive the CIDR from the zone id.
    evidence:
      - kind: source
        note: the CIDR comes from the last character of the zone name alone
    tests:
      - fault: fixtures/aws/local-zone-letter.json
        clean: fixtures/aws/clean.json

  - id: eks-cidr-overlap
    title: The EKS service CIDR stays outside the VPC
    engines: [eks]
    tier: static
    severity: fail
    status: source
    what: |
      EKS takes its service CIDR from the Kubernetes pack: Palette reads `pack.serviceClusterIpRange`
      into the CAPI cluster network (`GetClusterNetwork`), and CAPA passes it to EKS. Palette has no
      CIDR check for EKS. For dynamic placement the VPC is 10.0.0.0/16, and a service CIDR inside it
      breaks the routes. For static placement the VPC CIDR needs `describe-vpcs`: see reproduce.
      The catalog row names the key `serviceIpv4Cidr`; that is the field of EKS, not of the pack.
    when: (.profiles | length) > 0
    check:
      kind: static
      expr: |
        def is_cidr: type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$");
        def ip($s): $s | split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net($cidr; $p): ip($cidr | split("/")[0]) as $n | reduce range(0; 32 - $p) as $i ($n; (. / 2) | floor);
        def overlaps($a; $b): ([($a | split("/")[1] | tonumber), ($b | split("/")[1] | tonumber)] | min) as $p | net($a; $p) == net($b; $p);
        def k8s_cidrs: [ .profiles[]? | .packs[]? | select(.layer == "k8s") | .name as $n | .valuesCanon as $v
          | {name: $n, field: "pack.podCIDR", cidr: ($v.pack.podCIDR // $v.kubeadmconfig.clusterConfiguration.networking.podSubnet)},
            {name: $n, field: "pack.serviceClusterIpRange", cidr: ($v.pack.serviceClusterIpRange // $v.kubeadmconfig.clusterConfiguration.networking.serviceSubnet)}
          | select(.cidr | is_cidr) ];
        if (.entity.spec.cloudConfig.vpcId // "") != "" then []
        else [ k8s_cidrs[] | select(overlaps(.cidr; "10.0.0.0/16"))
               | "pack \(.name) sets \(.field) \(.cidr), which overlaps the VPC CIDR 10.0.0.0/16 of dynamic placement; Palette has no CIDR check for EKS" ] end
    reproduce:
      - "aws ec2 describe-vpcs --vpc-ids {{ .entity.spec.cloudConfig.vpcId }} --region {{ .entity.spec.cloudConfig.region }} --query 'Vpcs[].CidrBlockAssociationSet[].CidrBlock' --output text"
    fix:
      owner: palette
      text: Add the CIDR check of the AWS validate route to the EKS one, for both placements.
    evidence:
      - kind: source
        note: pack.podCIDR and pack.serviceClusterIpRange of the Kubernetes pack become the CAPI cluster network
      - kind: source
        note: no CIDR check; Palette checks the CIDR of AWS alone
    tests:
      - fault: fixtures/eks/service-cidr-in-vpc.json
        clean: fixtures/eks/service-cidr-clean.json

  - id: gcp-dynamic-cidr-overlap
    title: The pod and service CIDRs stay outside the subnet of a dynamic network
    engines: [gcp, gke]
    tier: static
    severity: fail
    status: source
    what: |
      With no network in the entity, Palette makes a network `<cluster>-network` and one subnet
      with 10.0.0.0/16 in the region, for GCP and GKE alike (`convertCloudCluster`,
      `convertManagedCloudCluster`). A pod CIDR or a service CIDR of the Kubernetes pack inside it
      breaks the routes. GKE gives the pods their own secondary ranges; the pack CIDRs apply to a
      GCP IaaS cluster, and the check reads them where they are.
    when: (.profiles | length) > 0
    check:
      kind: static
      expr: |
        def is_cidr: type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$");
        def ip($s): $s | split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net($cidr; $p): ip($cidr | split("/")[0]) as $n | reduce range(0; 32 - $p) as $i ($n; (. / 2) | floor);
        def overlaps($a; $b): ([($a | split("/")[1] | tonumber), ($b | split("/")[1] | tonumber)] | min) as $p | net($a; $p) == net($b; $p);
        def k8s_cidrs: [ .profiles[]? | .packs[]? | select(.layer == "k8s") | .name as $n | .valuesCanon as $v
          | {name: $n, field: "pack.podCIDR", cidr: ($v.pack.podCIDR // $v.kubeadmconfig.clusterConfiguration.networking.podSubnet)},
            {name: $n, field: "pack.serviceClusterIpRange", cidr: ($v.pack.serviceClusterIpRange // $v.kubeadmconfig.clusterConfiguration.networking.serviceSubnet)}
          | select(.cidr | is_cidr) ];
        if (.entity.spec.cloudConfig.network // "") != "" then []
        else [ k8s_cidrs[] | select(overlaps(.cidr; "10.0.0.0/16"))
               | "pack \(.name) sets \(.field) \(.cidr), which overlaps the subnet CIDR 10.0.0.0/16 that Palette makes for a dynamic network" ] end
    fix:
      owner: palette
      text: Check the pack CIDRs against 10.0.0.0/16 in the GCP validate route when the network is empty.
    evidence:
      - kind: source
        note: subnetCidrRange 10.0.0.0/16 for the one subnet of a dynamic network
    tests:
      - fault: fixtures/gcp/pod-cidr-in-network.json
        clean: fixtures/gcp/k8s-cidrs-clean.json

  - id: gke-secondary-ranges
    title: The subnet of a static GKE network carries secondary ranges
    engines: [gke]
    tier: cloud
    severity: warn
    status: inferred
    what: |
      A VPC-native GKE cluster takes its pod and service addresses from two secondary ranges of the
      subnet. Palette sets none, so GKE makes its own in the subnet: they can run out, and in a
      shared VPC subnet of another project GKE cannot make them. The check lists the subnets of the
      static network in the region and reports the pool subnets with no secondary range.
    when: .cloud == "gke" and (.entity.spec.cloudConfig.network // "") != ""
    check:
      kind: exec
      needs: [gcloud]
      argv:
        - gcloud
        - compute
        - networks
        - subnets
        - list
        - --network
        - '{{ .entity.spec.cloudConfig.network }}'
        - --regions
        - '{{ .entity.spec.cloudConfig.region }}'
        - --project
        - '{{ .entity.spec.cloudConfig.project }}'
        - --format
        - json
      expr: |
        .entity.spec.cloudConfig as $c
        | ([ .entity.spec.machinepoolconfig[]? | .cloudConfig.subnet // empty | select(. != "") ] | unique) as $named
        | if .exec.exit != 0 then ["gcloud compute networks subnets list failed: \(.exec.stderr | .[:200])"]
          else (.exec.stdout // []) as $subnets
            | if ($subnets | length) == 0 then ["network \($c.network) has no subnet in region \($c.region) of project \($c.project)"]
              else [ ($named[] | select(. as $n | ($subnets | map(.name) | index($n)) == null) | "subnet \(.) of a pool is not in network \($c.network) in region \($c.region)"),
                     ($subnets[] | . as $s | select(($named | length) == 0 or ($named | index($s.name)) != null)
                       | select(((.secondaryIpRanges // []) | length) == 0)
                       | "subnet \(.name) (\(.ipCidrRange)) has no secondary range: GKE makes its own pod and service ranges in it, which can run out or overlap in a shared VPC; Palette sets none") ]
              end
          end
    reproduce:
      - "gcloud compute networks subnets describe <subnet> --region {{ .entity.spec.cloudConfig.region }} --project {{ .entity.spec.cloudConfig.project }} --format 'value(ipCidrRange,secondaryIpRanges)'"
    fix:
      owner: palette
      text: Take the pod and service range names in the GKE cloud config, and check them in the GCP property route.
    evidence:
      - kind: doc
        ref: https://cloud.google.com/kubernetes-engine/docs/concepts/alias-ips
      - kind: source
        note: NodeNetwork.PodRangeName and PodRangeCidrBlock are compared, not set from the cloud config
    tests:
      - fault: fixtures/gke/no-secondary-ranges.json
        clean: fixtures/gke/static-network-clean.json

  - id: subnet-ips
    title: Each pool subnet has free addresses for its nodes and their pods
    engines: [aws, eks]
    tier: cloud
    severity: fail
    status: inferred
    what: |
      Each node takes one address, and the VPC CNI takes one more for each pod, with a warm pool of
      one ENI (up to 15 addresses on a t3.xlarge). EKS itself needs 6 free addresses in each cluster
      subnet, and asks for 16. A subnet that runs out fails the node group with
      `InsufficientFreeAddresses`. The check sums the nodes (maxSize) of the pools that use a
      subnet. It asks 16 for each node with the VPC CNI (1 with another CNI), plus 16 for the
      cluster. That is a floor, not the real need: the count of pods on each node decides it.
    when: (.cloud == "aws" or .cloud == "eks") and (.entity.spec.cloudConfig.vpcId // "") != "" and ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | length) > 0
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-subnets
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=subnet-id,Values={{ [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique | join(",") }}'
        - --output
        - json
      expr: |
        def ids: [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique;
        . as $w
        | (if .cloud == "eks" or ([ .profiles[]? | .packs[]? | select(.layer == "cni") | .name ] | any(.[]; test("aws-vpc"))) then 16 else 1 end) as $per
        | (if $per == 16 then "16 for each node with the VPC CNI" else "1 for each node" end) as $why
        | if .exec.exit != 0 then ["aws ec2 describe-subnets failed: \(.exec.stderr | .[:200])"]
          else (.exec.stdout.Subnets // []) as $s
            | [ ids[] | . as $id
                | ([ $w.entity.spec.machinepoolconfig[]? | select(([ (.cloudConfig.subnets // [])[] | .id ] | index($id)) != null) | (.poolConfig.maxSize // .poolConfig.size // 0) ] | add // 0) as $nodes
                | ([ $s[] | select(.SubnetId == $id) ] | .[0]) as $sub
                | select($sub != null)
                | ($nodes * $per + 16) as $need
                | select(($sub.AvailableIpAddressCount // 0) < $need)
                | "subnet \($id) has \($sub.AvailableIpAddressCount // 0) free addresses, and the pools that use it ask for \($nodes) nodes: about \($need) are needed (\($why), 16 for the cluster)" ]
          end
    reproduce:
      - "aws ec2 describe-subnets --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'Subnets[].[SubnetId,AvailabilityZone,CidrBlock,AvailableIpAddressCount]' --output table"
    fix:
      owner: palette
      text: Compare the free addresses of each subnet with the pools in the EKS property route.
    evidence:
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/userguide/network-reqs.html
        note: six addresses for the cluster in each subnet, 16 recommended
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/best-practices/ip-opt.html
        note: the VPC CNI keeps a warm pool of addresses on each node
    tests:
      - fault: fixtures/eks/subnet-full.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: private-egress
    title: Each private pool subnet has a route to the internet
    engines: [aws, eks, gcp, gke]
    tier: cloud
    severity: fail
    status: source
    what: |
      A node needs a 0.0.0.0/0 route to a NAT gateway, an internet gateway, a transit gateway, or a
      NAT instance. Without one it cannot reach Palette, EKS, or the registries: the nodes do not
      join, and the images do not pull. On AWS the row reports instances that delete every 30
      minutes with no end. The private test of Palette (`isSubnetPrivate`) reads the
      internet gateway route alone and checks no NAT route. The check runs for a static VPC on aws
      and eks. For GCP and GKE the router with NAT needs `gcloud compute routers list` (see
      reproduce), and the watch sees the nodes that never join.
    when: (.cloud == "aws" or .cloud == "eks") and (.entity.spec.cloudConfig.vpcId // "") != "" and ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | length) > 0
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-route-tables
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }}'
        - --output
        - json
      expr: |
        def ids: [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique;
        def egress: [ (.Routes // [])[] | select((.DestinationCidrBlock // "") == "0.0.0.0/0" and (.State // "active") == "active")
                      | select(((.NatGatewayId // "") != "") or ((.GatewayId // "") | test("^(igw|vgw)-")) or ((.TransitGatewayId // "") != "") or ((.NetworkInterfaceId // "") != "") or ((.InstanceId // "") != "") or ((.CoreNetworkArn // "") != "")) ] | length > 0;
        if .exec.exit != 0 then ["aws ec2 describe-route-tables failed: \(.exec.stderr | .[:200])"]
        else (.exec.stdout.RouteTables // []) as $t
          | ([ $t[] | select(any((.Associations // [])[]; .Main == true)) ] | .[0]) as $main
          | [ ids[] | . as $id
              | (([ $t[] | select(any((.Associations // [])[]; (.SubnetId // "") == $id)) ] | .[0]) // $main) as $rt
              | select($rt == null or ($rt | egress | not))
              | "subnet \($id) (route table \($rt.RouteTableId // "none")) has no 0.0.0.0/0 route to a NAT gateway, an internet gateway, a transit gateway, or a NAT instance: the nodes cannot join, and the images do not pull" ]
        end
    reproduce:
      aws:
        - "aws ec2 describe-route-tables --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'RouteTables[].[RouteTableId,Associations[].SubnetId,Routes[?DestinationCidrBlock==`0.0.0.0/0`].[GatewayId,NatGatewayId,TransitGatewayId]]' --output json"
      eks:
        - "aws ec2 describe-route-tables --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'RouteTables[].[RouteTableId,Associations[].SubnetId,Routes[?DestinationCidrBlock==`0.0.0.0/0`].[GatewayId,NatGatewayId,TransitGatewayId]]' --output json"
      gcp:
        - "gcloud compute routers list --project {{ .entity.spec.cloudConfig.project }} --regions {{ .entity.spec.cloudConfig.region }} --format 'table(name,network,nats[].name)'   # a router with a NAT on the network of the cluster"
      gke:
        - "gcloud compute routers list --project {{ .entity.spec.cloudConfig.project }} --regions {{ .entity.spec.cloudConfig.region }} --format 'table(name,network,nats[].name)'   # a router with a NAT on the network of the cluster"
    fix:
      owner: palette
      text: Check the default route of each pool subnet in the property routes, for AWS and GCP.
    evidence:
      - kind: source
        note: a subnet is private when its route table has no igw route; no test of a NAT route
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/userguide/private-clusters.html
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/aws/architecture/
    tests:
      - fault: fixtures/eks/no-default-route.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: static-subnets
    title: Each pool subnet exists, in the VPC and in the zone of the pool
    engines: [aws, eks]
    tier: cloud
    severity: fail
    status: source
    what: |
      A pool subnet that does not exist, is in another VPC, or is in another zone than the pool
      says fails during the build. `ValidateAwsSubnets` of Palette lists the subnets of the VPC and
      tests the public ones for MapPublicIpOnLaunch; a subnet id that is not in the VPC is never
      seen, and passes.
    when: (.cloud == "aws" or .cloud == "eks") and (.entity.spec.cloudConfig.vpcId // "") != "" and ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | length) > 0
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-subnets
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=subnet-id,Values={{ [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique | join(",") }}'
        - --output
        - json
      expr: |
        .entity.spec.cloudConfig.vpcId as $vpc | .entity.spec.cloudConfig.region as $region
        | if .exec.exit != 0 then ["aws ec2 describe-subnets failed: \(.exec.stderr | .[:200])"]
          else (.exec.stdout.Subnets // []) as $s
            | [ .entity.spec.machinepoolconfig[]? | .poolConfig.name as $pool | (.cloudConfig.subnets // [])[] | . as $want
                | ([ $s[] | select(.SubnetId == $want.id) ] | .[0]) as $have
                | if $have == null then "subnet \($want.id) of pool \($pool) is not in region \($region) for this account"
                  elif $have.VpcId != $vpc then "subnet \($want.id) of pool \($pool) is in VPC \($have.VpcId), not in \($vpc)"
                  elif ($want.az // "") != "" and $have.AvailabilityZone != $want.az then "subnet \($want.id) of pool \($pool) is in zone \($have.AvailabilityZone), not in \($want.az)"
                  else empty end ] | unique
          end
    reproduce:
      - "aws ec2 describe-subnets --region {{ .entity.spec.cloudConfig.region }} --subnet-ids {{ [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique | join(\" \") }} --query 'Subnets[].[SubnetId,VpcId,AvailabilityZone]' --output table"
    fix:
      owner: palette
      text: Refuse a pool subnet that the VPC listing does not hold, in the EKS property route.
    evidence:
      - kind: source
        note: the loop runs over the subnets of the VPC; a subnet of the request that is not among them is not tested
    tests:
      - fault: fixtures/eks/subnet-mismatch.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: eks-public-subnet-mapping
    title: Each public pool subnet maps a public address on launch
    engines: [eks]
    tier: palette
    severity: fail
    status: source
    what: |
      A public subnet (a route to an internet gateway) without MapPublicIpOnLaunch gives its nodes
      no public address, and they cannot reach the API server. `POST /v1/clouds/eks/properties/validate`
      finds it and answers `InvalidSubnetMapping`; the console calls it, and
      `POST /v1/spectroclusters/eks/validate` does not. The route also checks the SSH key, and that
      no EKS cluster of the name exists in the region.
    when: .cloud == "eks" and (.entity.spec.cloudConfig.vpcId // "") != "" and ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | length) > 0
    check:
      kind: palette
      method: POST
      path: /v1/clouds/eks/properties/validate
      body: |
        { cloudAccountUid: .entity.spec.cloudAccountUid,
          name: .entity.metadata.name,
          region: .entity.spec.cloudConfig.region,
          sshKeyName: (.entity.spec.cloudConfig.sshKeyName // ""),
          vpcId: .entity.spec.cloudConfig.vpcId,
          subnets: ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique) }
      expr: |
        if .response.ok then []
        else ["Palette refuses the EKS properties of the cluster: \(.response.body.code // .response.status): \(.response.body.message // "")"] end
    reproduce:
      - "aws ec2 describe-subnets --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'Subnets[].[SubnetId,MapPublicIpOnLaunch]' --output table"
    fix:
      owner: palette
      text: Call the EKS property route from the cluster validate route.
    evidence:
      - kind: source
        note: a public subnet without MapPublicIpOnLaunch answers InvalidSubnetMapping
    tests:
      - fault: fixtures/eks/public-subnet-no-map.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: lb-subnet-tags
    title: Each pool subnet carries a load balancer role tag
    engines: [aws, eks]
    tier: cloud
    severity: warn
    status: source
    what: |
      A subnet without `kubernetes.io/role/elb` (public) or `kubernetes.io/role/internal-elb`
      (private) is not found by the load balancer controller: a Service of type LoadBalancer stays
      Pending. For EKS with a static VPC Palette adds the tags during the build
      (`reconcileMCPSubnetTags`); the docs ask for them on the public subnets before the build. The
      check reads the tags of the pool subnets as they are now.
    when: (.cloud == "aws" or .cloud == "eks") and (.entity.spec.cloudConfig.vpcId // "") != "" and ([ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | length) > 0
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-subnets
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=subnet-id,Values={{ [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique | join(",") }}'
        - --output
        - json
      expr: |
        def ids: [ .entity.spec.machinepoolconfig[]? | (.cloudConfig.subnets // [])[] | .id // empty ] | unique;
        ids as $ids
        | if .exec.exit != 0 then ["aws ec2 describe-subnets failed: \(.exec.stderr | .[:200])"]
          else [ (.exec.stdout.Subnets // [])[] | . as $s | select(($ids | index($s.SubnetId)) != null)
                 | select(any((.Tags // [])[]; .Key == "kubernetes.io/role/elb" or .Key == "kubernetes.io/role/internal-elb") | not)
                 | "subnet \(.SubnetId) carries no kubernetes.io/role/elb (public) or kubernetes.io/role/internal-elb (private) tag: a Service of type LoadBalancer stays Pending until the tag is there" ]
          end
    reproduce:
      - "aws ec2 describe-tags --region {{ .entity.spec.cloudConfig.region }} --filters Name=resource-type,Values=subnet Name=key,Values=kubernetes.io/role/elb,kubernetes.io/role/internal-elb --output table"
    fix:
      owner: palette
      text: Check the tags of the pool subnets in the property routes, and add them for AWS as for EKS.
    evidence:
      - kind: source
        note: EKS with a static VPC gets the elb and internal-elb tags during the build
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/aws/architecture/
        note: the tags for automatic network discovery
      - kind: doc
        ref: https://docs.aws.amazon.com/eks/latest/userguide/network-reqs.html
    tests:
      - fault: fixtures/eks/no-lb-tags.json
        clean: fixtures/eks/static-vpc-clean.json

  - id: sg-name-collision
    title: No security group of the cluster is in the VPC before the build
    engines: [aws]
    tier: cloud
    severity: fail
    status: source
    what: |
      Palette makes the security groups `<cluster>-node`, `<cluster>-controlplane`,
      `<cluster>-apiserver-lb`, `<cluster>-lb`, and `<cluster>-bastion` in the VPC. A group of one
      of these names in the VPC already, such as one left by an earlier cluster of the name, fails
      the create. The docs name `<cluster>-node` as the one to check.
    when: (.entity.spec.cloudConfig.vpcId // "") != ""
    check:
      kind: exec
      needs: [aws]
      argv:
        - aws
        - ec2
        - describe-security-groups
        - --region
        - '{{ .entity.spec.cloudConfig.region }}'
        - --filters
        - 'Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }}'
        - 'Name=group-name,Values={{ .entity.metadata.name }}-node,{{ .entity.metadata.name }}-controlplane,{{ .entity.metadata.name }}-apiserver-lb,{{ .entity.metadata.name }}-lb,{{ .entity.metadata.name }}-bastion'
        - --output
        - json
      expr: |
        .entity.spec.cloudConfig.vpcId as $vpc
        | if .exec.exit != 0 then ["aws ec2 describe-security-groups failed: \(.exec.stderr | .[:200])"]
          else [ (.exec.stdout.SecurityGroups // [])[]
                 | "security group \(.GroupName) (\(.GroupId)) is in VPC \($vpc) already: Palette makes a group of that name for the cluster, and the create of it fails" ]
          end
    reproduce:
      - "aws ec2 describe-security-groups --region {{ .entity.spec.cloudConfig.region }} --filters Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} Name=group-name,Values={{ .entity.metadata.name }}-node --query 'SecurityGroups[].[GroupName,GroupId]' --output table"
    fix:
      owner: palette
      text: Check the group names in the AWS property route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/aws/create-cluster/
        note: the prerequisite on a security group named after the cluster with -node
    tests:
      - fault: fixtures/aws/sg-node-exists.json
        clean: fixtures/aws/static-vpc-clean.json

  - id: api-endpoint-reach
    title: The pilot can reach the API server of the cluster
    engines: [aws, eks, gcp, gke]
    tier: static
    severity: fail
    status: source
    what: |
      An internal load balancer, a private endpoint, or a firewall without port 6443 keeps the
      Palette pilot from the cluster. The pivot then fails, and the build waits.
    check:
      kind: static
      expr: |
        .entity.spec.cloudConfig as $c
        | [ (if ($c.controlPlaneLoadBalancer // "") == "internal" then "controlPlaneLoadBalancer is internal: the pilot needs a route to it, such as a private gateway" else empty end),
            (if .cloud == "eks" and ($c.endpointAccess.private // false)
                and (($c.endpointAccess | if has("public") then .public else true end) | not)
             then "endpointAccess is private alone: the pilot needs a private gateway or a route to the VPC" else empty end) ]
    fix:
      owner: palette
      text: Refuse a private endpoint with no private gateway at create.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/architecture/
        note: the pilot reaches each cluster through its API server
    tests:
      - fault: fixtures/eks/private-endpoint.json
        clean: fixtures/eks/clean.json

  - id: eks-public-cidrs
    title: The public endpoint CIDRs hold the NAT addresses and the Palette addresses
    engines: [eks]
    tier: static
    severity: fail
    status: source
    what: |
      With `endpointAccess.publicCIDRs`, Palette builds with public access open, and sets the CIDRs
      during the build only when private access is on too (`getDesiredManagedControlPlane`). After
      the pivot the target cluster gets the list as configured. Then the list must hold the
      addresses that Palette connects from, and with private access off also the NAT elastic IPs of
      the node subnets, or the node groups fail. The addresses are not in the entity: the check
      names the list and what it must hold.
    check:
      kind: static
      expr: |
        .entity.spec.cloudConfig.endpointAccess as $e
        | ($e.publicCIDRs // []) as $c
        | if ($c | length) == 0 or ($c | index("0.0.0.0/0")) != null then []
          elif ($e.private // false) then ["endpointAccess.publicCIDRs is \($c | join(", ")): the list must hold the public addresses that Palette connects from; strata-preflight cannot read them from the entity"]
          else ["endpointAccess.publicCIDRs is \($c | join(", ")) and endpointAccess.private is off: after the pivot the nodes reach the API server over the public endpoint, so the list must hold the NAT elastic IPs of the node subnets and the public addresses that Palette connects from; strata-preflight cannot read them from the entity"] end
    reproduce:
      - "aws ec2 describe-nat-gateways --region {{ .entity.spec.cloudConfig.region }} --filter Name=vpc-id,Values={{ .entity.spec.cloudConfig.vpcId }} --query 'NatGateways[].NatGatewayAddresses[].PublicIp' --output text"
    fix:
      owner: palette
      text: Check the list against the NAT addresses of the VPC and the addresses of Palette in the validate route.
    evidence:
      - kind: source
        note: the CIDRs apply in the pilot phase with private access alone, and in the target cluster as configured; Palette adds its own addresses from the configmap eks-public-access-cidrs in the pilot phase alone
    tests:
      - fault: fixtures/eks/public-cidrs.json
        clean: fixtures/eks/clean.json

  - id: agent-egress
    title: The cluster can reach Palette on 443
    engines: [all]
    tier: watch
    severity: fail
    status: source
    what: |
      A cluster whose nodes cannot reach Palette on 443 (and 4222 for NATS) runs, and its agent
      never connects. The status stays behind the real state.
    check:
      kind: watch
      expr: |
        if (.cluster.status.state // "") == "Running"
           and (.summary.status.health.state // "") == "Unknown"
           and (.elapsed // 0) > 600
        then ["the cluster is Running and its health is Unknown after \(.elapsed)s: the agent has not reported; check egress to Palette on 443 and 4222"]
        else [] end
    reproduce:
      - "curl -sS -o /dev/null -w '%{http_code}\\n' https://api.spectrocloud.com/v1/version   # from a node of the cluster"
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/architecture/networking-ports/
    tests:
      - fault: fixtures/eks/agent-silent.json
        clean: fixtures/eks/watch-running.json

  - id: proxy-no-proxy
    title: NO_PROXY holds the CIDRs of the cluster
    engines: [all]
    tier: static
    severity: fail
    status: inferred
    what: |
      A proxy in the pack values needs a NO_PROXY with the pod CIDR, the service CIDR, and the VPC
      CIDR. Without them the traffic of the cluster goes to the proxy, and the nodes and the pods
      cannot reach each other. The check reads the `values` of each pack for HTTP_PROXY,
      HTTPS_PROXY, or httpProxy. Then it looks for a NO_PROXY entry that covers each CIDR of the
      Kubernetes pack, and 10.0.0.0/16 for dynamic placement on aws and eks. A proxy set in the
      environment of Palette or of the PCG is not in the entity. For it Palette writes NO_PROXY
      with the service CIDR and USER_NO_PROXY, not the pod CIDR.
    when: (.profiles | length) > 0
    check:
      kind: static
      expr: |
        def is_cidr: type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$");
        def ip($s): $s | split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net($cidr; $p): ip($cidr | split("/")[0]) as $n | reduce range(0; 32 - $p) as $i ($n; (. / 2) | floor);
        def overlaps($a; $b): ([($a | split("/")[1] | tonumber), ($b | split("/")[1] | tonumber)] | min) as $p | net($a; $p) == net($b; $p);
        def k8s_cidrs: [ .profiles[]? | .packs[]? | select(.layer == "k8s") | .name as $n | .valuesCanon as $v
          | {name: $n, field: "pack.podCIDR", cidr: ($v.pack.podCIDR // $v.kubeadmconfig.clusterConfiguration.networking.podSubnet)},
            {name: $n, field: "pack.serviceClusterIpRange", cidr: ($v.pack.serviceClusterIpRange // $v.kubeadmconfig.clusterConfiguration.networking.serviceSubnet)}
          | select(.cidr | is_cidr) ];
        def covers($e; $c): ($e | split("/")[1] | tonumber) <= ($c | split("/")[1] | tonumber) and overlaps($e; $c);
        ([ .profiles[]? | .packs[]? | .values // "" ] | join("\n")) as $all
        | if ($all | test("HTTPS?_PROXY=|https?_proxy=|https?Proxy:")) | not then []
          else ([ $all | split("\n")[] | select(test("no_?proxy"; "i")) | sub("^[ \\t-]+"; "") ] | join(",")) as $np
            | ([ $np | split("[,= \"'\\t]+"; "g")[] | select(is_cidr) ]) as $entries
            | (if (.cloud == "aws" or .cloud == "eks") and (.entity.spec.cloudConfig.vpcId // "") == ""
               then [{who: "dynamic placement", field: "VPC CIDR", cidr: "10.0.0.0/16"}] else [] end) as $vpc
            | if $np == "" then ["the pack values set a proxy and no NO_PROXY: the pod CIDR, the service CIDR, the VPC CIDR, and the metadata address 169.254.169.254 must be in it"]
              else [ ((k8s_cidrs | map(.who = "pack \(.name)")) + $vpc)[] | . as $c
                     | select(($entries | any(.[]; covers(.; $c.cidr))) | not)
                     | "the pack values set a proxy, and NO_PROXY (\($np | .[:160])) has no entry that covers the \($c.field) \($c.cidr) of \($c.who)" ] end
          end
    fix:
      owner: palette
      text: Add the pod CIDR to the NO_PROXY that Palette writes, and check a NO_PROXY of the pack values at create.
    evidence:
      - kind: source
        note: NO_PROXY for containerd is 127.0.0.1, localhost, the service CIDR blocks, and USER_NO_PROXY; the pod CIDR is not in it
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/cluster-management/cluster-proxy/
    tests:
      - fault: fixtures/aws/proxy-no-cidrs.json
        clean: fixtures/aws/proxy-with-cidrs.json

  - id: cilium-on-eks
    title: A Cilium pack on EKS gives the pods addresses and routes the Services
    engines: [eks]
    tier: static
    severity: fail
    status: source
    what: |
      For a CNI pack whose name holds `cilium`, Palette turns the VPC CNI and kube-proxy off on EKS,
      unless the pack values set `charts.cilium.disableVPCCNI: false` or
      `charts.cilium.disableKubeProxy: false`. Cilium then must give the pods their addresses
      (`charts.cilium.eni.enabled: true` or `charts.cilium.ipam.mode: eni`) and route the Services
      (`charts.cilium.kubeProxyReplacement: true`, with `k8sServiceHost` and `k8sServicePort`).
      Without them the nodes have no CNI and no service proxy, and the cluster never runs.
    when: (.profiles | length) > 0
    check:
      kind: static
      expr: |
        [ .profiles[]? | .packs[]? | select(.layer == "cni") | select(.name | ascii_downcase | test("cilium"))
          | .name as $n | (.valuesCanon.charts.cilium // {}) as $raw | (if ($raw | type) == "object" then $raw else {} end) as $c
          | (if ($c | if has("disableVPCCNI") then .disableVPCCNI else true end)
                and (($c.eni.enabled // false) | not) and (($c.ipam.mode // "") != "eni")
             then "pack \($n) turns the VPC CNI off on EKS (charts.cilium.disableVPCCNI is not false), and its values set neither charts.cilium.eni.enabled: true nor charts.cilium.ipam.mode: eni: the pods get no address" else empty end),
            (if ($c | if has("disableKubeProxy") then .disableKubeProxy else true end)
                and ((($c.kubeProxyReplacement // false) | tostring) | test("^(true|strict)$") | not)
             then "pack \($n) turns kube-proxy off on EKS (charts.cilium.disableKubeProxy is not false), and its values do not set charts.cilium.kubeProxyReplacement: true with k8sServiceHost and k8sServicePort: the Services do not route" else empty end) ]
    fix:
      owner: palette
      text: Refuse a Cilium pack on EKS whose values set neither ENI mode nor kube-proxy replacement, in the validate route.
    evidence:
      - kind: source
        note: both default to true for a Cilium pack; charts.cilium.disableVPCCNI and charts.cilium.disableKubeProxy set to false keep them on
      - kind: source
        note: a CNI pack whose lowercase name holds cilium
      - kind: doc
        ref: https://docs.cilium.io/en/stable/network/concepts/ipam/eni/
      - kind: doc
        ref: https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
    tests:
      - fault: fixtures/eks/cilium-no-eni.json
        clean: fixtures/eks/cilium-eni.json

  - id: gcp-name-length
    title: The names GCP derives from the cluster name fit
    engines: [gcp, gke]
    tier: static
    severity: fail
    status: source
    what: |
      GCP takes at most 63 characters for a network or a subnet name, and at most 40 for a GKE
      cluster name. For a dynamic network Palette derives `<cluster>-network` and
      `<cluster>-network-<region>` from the cluster name (`getNetworkName`, `getSubnetName`).
    check:
      kind: static
      expr: |
        (.entity.metadata.name // "") as $n | (.entity.spec.cloudConfig.region // "") as $r
        | "\($n)-network" as $net | "\($net)-\($r)" as $sub
        | ((.entity.spec.cloudConfig.network // "") == "") as $dynamic
        | [ (if .cloud == "gke" and ($n | length) > 40 then "cluster name \($n) has \($n | length) characters; GKE takes at most 40" else empty end),
            (if $dynamic and ($net | length) > 63 then "the derived network name \($net) has \($net | length) characters; GCP takes at most 63" else empty end),
            (if $dynamic and ($sub | length) > 63 then "the derived subnet name \($sub) has \($sub | length) characters; GCP takes at most 63" else empty end) ]
    fix:
      owner: palette
      text: Check the derived name lengths in the name route.
    evidence:
      - kind: source
        note: Palette makes the names of the network and the subnet from the cluster name
      - kind: doc
        ref: https://cloud.google.com/compute/docs/naming-resources
    tests:
      - fault: fixtures/gke/long-name.json
        clean: fixtures/gke/clean.json

  - id: registry-https
    title: A registry name answers over HTTPS before Palette takes it
    engines: [all, lab]
    tier: watch
    severity: fail
    status: seen
    what: |
      Palette checks a registry at its create: the name must answer over HTTPS. A registry host
      that the lab starts gets its certificates after the instance is up, and a create before that
      fails. The lab waits for each name to answer over HTTPS first. strata-preflight has no watch
      for it: the wait is a step of the tool that makes the registry.
    reproduce:
      - "curl -s -o /dev/null -w '%{http_code}\\n' https://<registry host>/v2/"
    fix:
      owner: lab
      text: Wait for each registry name to answer over HTTPS before the registry resource.
    evidence:
      - kind: run
        ref: lab examples/live/terraform/registry-kinds.tf kinds_ready
        note: a loop of up to 90 tries on https://<name>/v2/ before each spectrocloud_registry resource

  - id: igw-detach
    title: The destroy removes each mapped address before the internet gateway detaches
    engines: [all, lab]
    tier: tool
    severity: fail
    status: seen
    what: |
      AWS refuses to detach an internet gateway while an address of the VPC is mapped
      (`DependencyViolation`). A destroy that removes the gateway before the instance with the
      public address fails on the detach. The lab makes the instance depend on the gateway, so the
      destroy removes the instance first.
    fix:
      owner: lab
      text: "`depends_on` from the instance to the gateway, so the destroy runs in the reverse order."
    evidence:
      - kind: run
        ref: lab examples/live/terraform/registry-kinds.tf aws_instance.kinds
        note: depends_on the gateway, with the reason in the comment

  - id: azure-subnets-in-vnet
    title: The subnets of a static Azure network are inside the vnet CIDR
    engines: [azure, aks]
    tier: static
    severity: fail
    status: source
    when: (.entity.spec.cloudConfig.vnetName // "") != ""
    what: |
      With `vnetName` set, the converter needs `vnetCidrBlock`: "Parameter 'VNet CIDR Block' should
      not be empty". It checks nothing else of the static network. Azure refuses a subnet outside
      the address space of its vnet. The check reads the CIDR of the control plane subnet and of
      the worker subnet, when given, against `vnetCidrBlock`. `azure-vnet-static` asks Azure, through
      Palette, whether the vnet and the subnets exist.
    check:
      kind: static
      expr: |
        def ip2n: split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net: split("/") | { n: (.[0] | ip2n), p: (.[1] | tonumber) };
        def inside($outer): (net) as $i | ($outer | net) as $o | ($i.p >= $o.p) and (($i.n / pow(2; 32 - $o.p) | floor) == ($o.n / pow(2; 32 - $o.p) | floor));
        def is_cidr: test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$");
        .entity.spec.cloudConfig as $c | ($c.vnetCidrBlock // "") as $v
        | if $v == "" then ["vnetName \($c.vnetName) is set and vnetCidrBlock is empty: the converter refuses the create with \"Parameter 'VNet CIDR Block' should not be empty\""]
          elif ($v | is_cidr | not) then ["vnetCidrBlock \($v) is not a CIDR"]
          else [ ({ name: "controlPlaneSubnet", s: $c.controlPlaneSubnet }, { name: "workerSubnet", s: $c.workerSubnet })
                 | select(.s != null) | .name as $n | (.s.cidrBlock // "") as $cidr
                 | select($cidr != "")
                 | if ($cidr | is_cidr | not) then "\($n) cidrBlock \($cidr) is not a CIDR"
                   elif ($cidr | inside($v) | not) then "\($n) \($cidr) is outside the vnet \($c.vnetName) \($v): Azure refuses a subnet outside the address space"
                   else empty end ]
          end
    fix:
      owner: palette
      text: Check the subnet CIDRs against the vnet CIDR in the converter.
    evidence:
      - kind: source
        note: "if str.IsNotEmpty(c.VnetName) { validator.ShouldNotBeEmpty(\"VNet CIDR Block\", c.VnetCidrBlock) }; the subnets are copied"
      - kind: doc
        ref: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
        note: a subnet address range must be inside the address space of the virtual network
    tests:
      - fault: fixtures/azure/subnet-outside-vnet.json
        clean: fixtures/azure/static-vnet-clean.json
      - fault: fixtures/azure/vnet-no-cidr.json

  - id: azure-vnet-static
    title: The vnet and the subnets of a static Azure network exist
    engines: [azure, aks]
    tier: palette
    severity: fail
    status: source
    when: (.entity.spec.cloudConfig.vnetName // "") != "" and .entity.spec.cloudAccountUid != null
    what: |
      With `vnetName` set, the provider builds the id of each subnet under the vnet in
      `vnetResourceGroup` (or the resource group of the cluster) and passes it to CAPZ. A vnet or a
      subnet that does not exist fails the build with `NotFound`. Palette checks none of them.
      `GET /v1/clouds/azure/regions/{region}/subscriptions/{sub}/networks` lists the vnets of the
      group with their address spaces and subnets; the check looks for the vnet, each named subnet,
      and the vnet CIDR in it.
    check:
      kind: palette
      method: GET
      path: /v1/clouds/azure/regions/{{ .entity.spec.cloudConfig.location }}/subscriptions/{{ .entity.spec.cloudConfig.subscriptionId }}/networks?cloudAccountUid={{ .entity.spec.cloudAccountUid }}&resourceGroup={{ .entity.spec.cloudConfig | if (.vnetResourceGroup // "") != "" then .vnetResourceGroup else .resourceGroup end }}
      expr: |
        .entity.spec.cloudConfig as $c | (if ($c.vnetResourceGroup // "") != "" then $c.vnetResourceGroup else $c.resourceGroup end) as $rg
        | if (.response.ok | not) then ["Palette cannot list the virtual networks of \($rg): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          else ([ (.response.body.virtualNetworkList // [])[] | select((.name | ascii_downcase) == ($c.vnetName | ascii_downcase)) ] | first) as $vnet
            | if $vnet == null then ["no virtual network \($c.vnetName) in resource group \($rg) of subscription \($c.subscriptionId): the build names its subnets by id under it, and Azure answers NotFound"]
              else ([ ($vnet.subnets // [])[] | .name | ascii_downcase ]) as $subs
                | [ ({ f: "controlPlaneSubnet", s: $c.controlPlaneSubnet }, { f: "workerSubnet", s: $c.workerSubnet })
                    | select(.s != null and ((.s.name // "") != "")) | .f as $f | .s.name as $n
                    | select(($subs | index($n | ascii_downcase)) == null)
                    | "\($f) \($n) is not a subnet of \($c.vnetName) (it has \($subs | join(", "))): the build names the subnet by id, and Azure answers NotFound" ]
                  + (if ($c.vnetCidrBlock // "") != "" and (($vnet.addressSpaces // []) | index($c.vnetCidrBlock)) == null then ["vnetCidrBlock \($c.vnetCidrBlock) is not an address space of \($c.vnetName) (\(($vnet.addressSpaces // []) | join(", ")))"] else [] end)
              end
          end
    reproduce:
      - "az network vnet show --resource-group {{ .entity.spec.cloudConfig | if (.vnetResourceGroup // \"\") != \"\" then .vnetResourceGroup else .resourceGroup end }} --name {{ .entity.spec.cloudConfig.vnetName }} --subscription {{ .entity.spec.cloudConfig.subscriptionId }} --query '{space: addressSpace.addressPrefixes, subnets: subnets[].[name,addressPrefix]}' --output json"
    fix:
      owner: palette
      text: Read the vnet and the subnets in the validate route when vnetName is set.
    evidence:
      - kind: source
        note: "/subscriptions/<sub>/resourceGroups/<vnetRG>/providers/Microsoft.Network/virtualNetworks/<vnet>/subnets/<name>, built from the config and never read back"
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/azure/create-azure-cluster/
        note: static placement fields Network Resource Group, Virtual Network, CIDR Block, Control Plane Subnet, Worker Subnet
    tests:
      - fault: fixtures/azure/vnet-subnet-missing.json
        clean: fixtures/azure/static-vnet-clean.json

  - id: azure-private-api-server
    title: A private API server load balancer has a static address, a DNS zone, and a PCG
    engines: [azure, aks]
    tier: static
    severity: fail
    status: source
    what: |
      An internal API server load balancer (`infraLBConfig.apiServerLB.type: Internal`) takes a
      static address alone: the docs say dynamic allocation "is no longer supported". It needs a
      private DNS zone, and it is available through a self-hosted PCG in Azure alone, because
      Palette must reach the API server. The check reads the load balancer fields, and the PCG
      annotation of the account when the world has one. For AKS, a private cluster with a custom
      `privateDNSZone` needs the name `private.<region>.azmk8s.io`.
    check:
      kind: static
      expr: |
        .entity.spec.cloudConfig as $c | ($c.infraLBConfig.apiServerLB // {}) as $lb
        | (if ($lb.type // "Public") == "Internal" then
             [ ( if ($lb.ipAllocationMethod // "Dynamic") != "Static" then "apiServerLB.type is Internal with ipAllocationMethod \($lb.ipAllocationMethod // "Dynamic"): the docs allow Static alone, with a valid apiServerLBStaticIP" else empty end ),
               ( if ($lb.ipAllocationMethod // "") == "Static" and ($lb.apiServerLBStaticIP // "") == "" then "apiServerLB.ipAllocationMethod is Static and apiServerLBStaticIP is empty" else empty end ),
               ( if ($lb.privateDNSName // "") == "" then "apiServerLB.type is Internal and privateDNSName is empty: a private DNS zone is required for the private API server load balancer" else empty end ),
               ( if .account != null and (.account.metadata.annotations.overlordUid // "") == "" then "apiServerLB.type is Internal and the cloud account names no PCG (annotation overlordUid): the private load balancer is available through a self-hosted PCG in Azure alone" else empty end ) ]
           else [] end)
        + (if .cloud == "aks" and ($c.apiServerAccessProfile.enablePrivateCluster // $c.enablePrivateCluster // false) then
             (($c.apiServerAccessProfile.privateDNSZone // "") as $z
              | if $z != "" and $z != "system" and $z != "none" and ($z | test("private\\.\($c.location)\\.azmk8s\\.io$") | not)
                then ["apiServerAccessProfile.privateDNSZone \($z) is not named private.\($c.location).azmk8s.io: AKS needs that name for the API server zone"] else [] end)
           else [] end)
    fix:
      owner: palette
      text: Check the three fields and the PCG in the validate route when the load balancer is Internal.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/azure/create-azure-cluster/
        note: only Static IP allocation is allowed; a private DNS zone is required; available only through a self-hosted PCG
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/azure/aks/
        note: the private DNS zone of the API server must be named private.<cluster-region>.azmk8s.io
      - kind: source
        note: defaults ipAllocationMethod to Dynamic and type to Public, and checks nothing
    tests:
      - fault: fixtures/azure/private-lb-dynamic.json
        clean: fixtures/azure/private-lb-clean.json
      - clean: fixtures/azure/clean.json

  - id: maas-domain
    title: The DNS domain of the cluster exists in MAAS
    engines: [maas]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null
    what: |
      `cloudConfig.domain` is required. Palette passes it to CAPMAAS as the DNS domain of the
      machines and registers the record of the cluster in it. Palette checks nothing about it.
      `GET /v1/cloudaccounts/maas/{uid}/properties/domains` lists the domains of MAAS through the
      PCG of the account; the check looks for the domain in the list. A refusal of the route names
      a PCG that is missing or not active.
    check:
      kind: palette
      method: GET
      path: /v1/cloudaccounts/maas/{{ .entity.spec.cloudAccountUid }}/properties/domains
      expr: |
        .entity.spec.cloudConfig.domain as $d
        | if (.response.ok | not) then ["Palette cannot list the domains of the MAAS account: \(.response.body.code // .response.status): \(.response.body.message // ""); the route needs the PCG of the account (annotation overlordUid) to be active"]
          else ([ (.response.body.items // [])[] | .name ]) as $names
            | if ($names | index($d)) != null then [] else ["domain \($d) is not a DNS domain of MAAS (it has \($names | join(", "))): Palette registers the cluster record in it, and CAPMAAS deploys the machines into it"] end
          end
    reproduce:
      - "maas $PROFILE domains read | jq -r '.[] | [.name, .is_default] | @tsv'"
    fix:
      owner: palette
      text: Read the domains of MAAS in the validate route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/architecture/
        note: Palette registers a DNS record in MAAS for the deployed cluster
      - kind: source
        note: DNSDomain is config.Spec.ClusterConfig.Domain
      - kind: source
        note: the route asks the PCG of the account, or the cloud service for a system gateway
    tests:
      - fault: fixtures/maas/domain-missing.json
        clean: fixtures/maas/clean.json

  - id: maas-zones
    title: Each availability zone of a MAAS pool exists in MAAS
    engines: [maas]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null
    what: |
      The zones of a pool are the MAAS zones CAPMAAS allocates machines from. A zone that is not in
      MAAS matches no machine, and the pool never fills. The create refuses a pool with no zone
      (`AvailabilityZoneRequired`); the validate route does not. `maas-pool-fields` reads the empty
      case. `GET /v1/cloudaccounts/maas/{uid}/properties/azs` lists the zones through the PCG.
    check:
      kind: palette
      method: GET
      path: /v1/cloudaccounts/maas/{{ .entity.spec.cloudAccountUid }}/properties/azs
      expr: |
        if (.response.ok | not) then ["Palette cannot list the zones of the MAAS account: \(.response.body.code // .response.status): \(.response.body.message // ""); the route needs the PCG of the account to be active"]
        else ([ (.response.body.items // [])[] | .name ]) as $zones
          | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.azs // [])[]
              | select(. as $z | ($zones | index($z)) == null)
              | "pool \($p) names zone \(.), which is not a MAAS zone (\($zones | join(", "))): CAPMAAS finds no machine in it" ]
        end
    reproduce:
      - "maas $PROFILE zones read | jq -r '.[].name'"
    fix:
      owner: palette
      text: Read the zones in the validate route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/create-manage-maas-clusters/
        note: "Availability zones: the MAAS zones in which to deploy nodes"
      - kind: source
        note: AvailabilityZoneRequired on the create path alone
    tests:
      - fault: fixtures/maas/zone-unknown.json
        clean: fixtures/maas/clean.json

  - id: maas-lxd-ipam
    title: LXD VM pools and IP pools follow the MAAS rules
    engines: [maas]
    tier: static
    severity: fail
    status: source
    what: |
      Four rules of the MAAS create that the validate route does not run. `useLxdVm` is for a
      control plane pool alone. `enableLxdVm` on the cluster and `useLxdVm` on a pool exclude each
      other. An IP pool (`network.parentPoolUid`) is for an LXD VM control plane pool alone: "IPAM
      Pool should be empty in machine pool". A network with `staticIp` needs a `parentPoolUid`. The
      IP pool must also be restricted to a single cluster and free; the reproduce line reads it.
    check:
      kind: static
      expr: |
        .entity.spec.cloudConfig as $c
        | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.poolConfig.isControlPlane // false) as $cp | (.cloudConfig.useLxdVm // false) as $lxd | (.cloudConfig.network // {}) as $n
            | ( if $lxd and ($cp | not) then "pool \($p) sets useLxdVm and is not a control plane pool: Palette refuses it with \"Use LXD VM configuration is restricted to control plane pool\"" else empty end ),
              ( if $lxd and ($c.enableLxdVm // false) then "pool \($p) sets useLxdVm and the cluster sets enableLxdVm: Palette refuses the pair (\"Use LXD configuration is not allowed for LXD hosted clusters\")" else empty end ),
              ( if (($n.parentPoolUid // "") != "") and (($cp and $lxd) | not) then "pool \($p) names IP pool \($n.parentPoolUid) and is not an LXD VM control plane pool: Palette refuses it with \"IPAM Pool should be empty in machine pool\"" else empty end ),
              ( if ($n.staticIp // false) and (($n.parentPoolUid // "") == "") then "pool \($p) sets network.staticIp with no parentPoolUid: the converter refuses it (\"ParentPoolUid should not be empty\")" else empty end ) ]
    reproduce:
      - "curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/overlords/maas/{{ .account.metadata.annotations.overlordUid // \"<pcg uid>\" }}/pools\" | jq '.items[] | {uid: .metadata.uid, name: .metadata.name, single: .spec.restrictToSingleCluster, inUse: .status.inUse}'"
    fix:
      owner: palette
      text: Run the LXD and IPAM checks in the validate route.
    evidence:
      - kind: source
        note: Palette checks the LXD VM config and the IPAM network config of a MAAS cluster
      - kind: source
        note: staticIp with an empty parentPoolUid is refused
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/create-manage-maas-lxd-clusters/
        note: the IP pool must have Restrict to a single cluster enabled
    tests:
      - fault: fixtures/maas/lxd-worker.json
        clean: fixtures/maas/lxd-clean.json
      - fault: fixtures/maas/ipam-on-worker.json
        clean: fixtures/maas/clean.json

  - id: edge-vip-multi-node
    title: A multi-node edge cluster has a virtual IP for the API server
    engines: [edge]
    tier: static
    severity: fail
    status: source
    what: |
      The docs need one address for the virtual IP (VIP) of the cluster, and the hosts of a
      cluster on one network. With one host, kube-vip is off and the host address serves. Palette
      does not check the count: a create with two hosts and no `controlPlaneEndpoint` passes, and
      kube-vip has no address. The converter refuses an empty host when the type is `VIP` and the
      endpoint object is there. The types are `VIP`, `External`, and `DDNS`; `IP` and an empty type
      are read as `VIP`. The check counts the hosts of every pool.
    check:
      kind: static
      expr: |
        ([ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // []) | length ] | add // 0) as $hosts
        | (.entity.spec.cloudConfig.controlPlaneEndpoint // {}) as $e | ($e.type // "") as $t | ($e.host // "") as $h
        | (if $t == "" or $t == "IP" then "VIP" else $t end) as $type
        | [ ( if (["VIP", "External", "DDNS"] | index($type)) == null then "controlPlaneEndpoint.type \($t) is not VIP, External, or DDNS" else empty end ),
            ( if $type == "VIP" and $h == "" and $hosts > 1 then "\($hosts) hosts and no controlPlaneEndpoint.host: a multi-node cluster needs one virtual IP for the API server; Palette does not check it, and kube-vip gets no address" else empty end ),
            ( if $type == "VIP" and $h != "" and ($h | test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"; "i") | not) then "controlPlaneEndpoint.host \($h) is not an IP or a host name" else empty end ),
            ( if $type == "DDNS" and $h == "" and (($e.ddnsSearchDomain // "") == "") then "controlPlaneEndpoint.type is DDNS with no host and no ddnsSearchDomain" else empty end ) ]
    fix:
      owner: palette
      text: Refuse a create with two hosts or more and no VIP in the edge-native validate route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/cluster-deployment/
        note: one IP address is required for the VIP of the cluster; hosts of one cluster must be on the same network
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/networking/kubevip/
        note: kube-vip is disabled when the VIP is the address of the host, as in a single-node cluster
      - kind: source
        note: an empty type or IP becomes VIP; the host is required for VIP alone; a nil endpoint passes with any host count
    tests:
      - fault: fixtures/edge/vip-no-host.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/vip-bad-type.json

  - id: edge-overlay-cidr
    title: The overlay network has a CIDR that holds the VIP
    engines: [edge]
    tier: static
    severity: fail
    status: source
    when: .entity.spec.cloudConfig.overlayNetworkConfiguration.enable // false
    what: |
      With the overlay network on, Palette parses `overlayNetworkConfiguration.cidr` and checks
      that `controlPlaneEndpoint.host` is inside it: `InvalidCidr` or `IPNotWithinCidrRange` at
      create, not at validate. The first address of the range is the overlay VIP. The range cannot
      change after the create. The hosts must share one layer-2 network that passes broadcasts.
      Palette has no default range; the console fills one in.
    check:
      kind: static
      expr: |
        def ip2n: split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        def net: split("/") | { n: (.[0] | ip2n), p: (.[1] | tonumber) };
        def inside($outer): (net) as $i | ($outer | net) as $o | ($i.p >= $o.p) and (($i.n / pow(2; 32 - $o.p) | floor) == ($o.n / pow(2; 32 - $o.p) | floor));
        def is_cidr: test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$");
        def is_ip: test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$");
        (.entity.spec.cloudConfig.overlayNetworkConfiguration.cidr // "") as $cidr | (.entity.spec.cloudConfig.controlPlaneEndpoint.host // "") as $h
        | if ($cidr | is_cidr | not) then ["overlayNetworkConfiguration.cidr \($cidr) is not a CIDR: Palette refuses the create with InvalidCidr"]
          elif $h == "" then ["the overlay network is on and controlPlaneEndpoint.host is empty: Palette checks the host against the CIDR and refuses an empty one; the first address of \($cidr) is the overlay VIP"]
          elif ($h | is_ip | not) then ["controlPlaneEndpoint.host \($h) is not an IP, and the overlay check needs one inside \($cidr)"]
          elif ("\($h)/32" | inside($cidr) | not) then ["controlPlaneEndpoint.host \($h) is outside the overlay CIDR \($cidr): Palette refuses the create with IPNotWithinCidrRange"]
          else [] end
    fix:
      owner: palette
      text: Run ValidateCidrConfig in the validate route.
    evidence:
      - kind: source
        note: validateCIDR(ControlPlaneEndpoint.Host, Cidr) when Enable; InvalidCidr and IPNotWithinCidrRange
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/networking/vxlan-overlay/
        note: the first IP address in the overlay CIDR range is the overlay VIP; the range cannot change after the create
    tests:
      - fault: fixtures/edge/overlay-vip-outside.json
        clean: fixtures/edge/overlay-clean.json
      - fault: fixtures/edge/overlay-bad-cidr.json

  - id: edge-host-nic
    title: The NIC of an edge host exists, and a host with two NICs has a static IP or the overlay
    engines: [edge]
    tier: palette
    severity: fail
    status: source
    what: |
      A host entry can name its NIC (`nicName`, or `nic.nicName`). The create checks the name against
      `spec.device.nics` of the host and refuses an unknown one ("Invalid nic name"); the validate
      route does not. The docs say a host with more than one NIC needs a static IP or the overlay
      network; DHCP is not supported there. The check reads the first host of the first pool with
      `GET /v1/edgehosts/{uid}`. A check of every host needs one request for each; the reproduce
      line loops.
    check:
      kind: palette
      method: GET
      path: /v1/edgehosts/{{ .entity.spec.machinepoolconfig[0].cloudConfig.edgeHosts[0].hostUid }}
      expr: |
        (.entity.spec.machinepoolconfig[0].cloudConfig.edgeHosts[0]) as $h | (.entity.spec.cloudConfig.overlayNetworkConfiguration.enable // false) as $overlay
        | ($h.nic.nicName // $h.nicName // "") as $want | ($h.nic.ip // $h.staticIP // "") as $ip
        | if (.response.ok | not) then ["Palette cannot read edge host \($h.hostUid): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          else (.response.body.spec.device.nics // []) as $nics | ([ $nics[] | .nicName ]) as $names
            | [ ( if $want != "" and ($names | index($want)) == null then "host \($h.hostUid) names NIC \($want), and the device has \($names | join(", ")): Palette refuses the create with \"Invalid nic name\"" else empty end ),
                ( if ($nics | length) > 1 and $ip == "" and ($overlay | not) then "host \($h.hostUid) has \($nics | length) NICs (\($names | join(", "))), no static IP, and no overlay network: the docs say DHCP is not supported on a host with more than one NIC" else empty end ) ]
          end
    reproduce:
      - "for h in {{ [ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // [])[] | .hostUid ] | join(\" \") }}; do curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/edgehosts/$h\" | jq -c '{uid: .metadata.uid, nics: [.spec.device.nics[] | {nicName, ip, isDefault}]}'; done"
    fix:
      owner: palette
      text: Run the NIC check in the validate route, and refuse DHCP on a host with two NICs.
    evidence:
      - kind: source
        note: IsValidNic against spec.device.nics of the host, on the create path
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/cluster-deployment/
        note: a host with more than one NIC must use static IP addresses or the network overlay; DHCP is not supported
    tests:
      - fault: fixtures/edge/nic-unknown.json
        clean: fixtures/edge/nic-clean.json
      - fault: fixtures/edge/multi-nic-dhcp.json
        clean: fixtures/edge/clean.json

  - id: edge-static-ip-nic
    title: A static IP on an edge host comes with a gateway, a subnet, and DNS
    engines: [edge]
    tier: static
    severity: warn
    status: inferred
    what: |
      The console asks four fields for a static address: the IP, the default gateway, the subnet
      mask, and a DNS server. Palette copies `nic` and checks none of them. A host with an address
      and no gateway cannot reach Palette, and the build waits for it. This is a reading of the
      docs and the converter, not a run. The check reads each host with `nic.ip` or `staticIP`.
    check:
      kind: static
      expr: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.edgeHosts // [])[]
          | select(((.nic.ip // .staticIP // "") != "")) | .hostUid as $u | (.nic // {}) as $n | (.nic.ip // .staticIP) as $ip
          | [ (if ($n.gateway // "") == "" then "gateway" else empty end), (if ($n.subnet // "") == "" then "subnet" else empty end), (if (($n.dns // []) | length) == 0 then "dns" else empty end) ] as $missing
          | select(($missing | length) > 0)
          | "host \($u) of pool \($p) has the static IP \($ip) and no \($missing | join(", ")): the console asks for all four, and Palette checks none" ]
    fix:
      owner: palette
      text: Check the four fields of a static NIC in the converter.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/cluster-deployment/
        note: static IP fields IP address, Default gateway, Subnet mask, DNS server
      - kind: source
        note: copies macAddr, ip, subnet, gateway, dns, nicName, and isDefault with no check
    tests:
      - fault: fixtures/edge/static-ip-no-gateway.json
        clean: fixtures/edge/nic-clean.json

  - id: vsphere-controlplane-endpoint
    title: The control plane endpoint of a vSphere cluster has a valid type and a host
    engines: [vsphere]
    tier: static
    severity: fail
    status: source
    what: |
      The types are `VIP`, `External`, and `DDNS`; an empty type is `DDNS`, and there is no `IP`.
      For `VIP` and `External` the converter needs a host ("Host endpoint should not be empty").
      With DHCP and `DDNS`, Palette reads the search domain from the DNS mapping of the PCG. The
      mapping is for the datacenter and the network. With none, the create fails with
      `MissingDDnsMapping`. No route lists the mappings, so the reproduce line names the console
      page. The docs say DHCP needs Dynamic DNS.
    check:
      kind: static
      expr: |
        (.entity.spec.cloudConfig.controlPlaneEndpoint // {}) as $e | ($e.type // "") as $t | ($e.host // "") as $h
        | (if $t == "" then "DDNS" else $t end) as $type
        | [ ( if (["VIP", "External", "DDNS"] | index($type)) == null then "controlPlaneEndpoint.type \($t) is not VIP, External, or DDNS (the vSphere enum has no IP)" else empty end ),
            ( if $type != "DDNS" and $h == "" then "controlPlaneEndpoint.type is \($type) and host is empty: the converter refuses it (\"Host endpoint should not be empty\")" else empty end ),
            ( if $type == "DDNS" and ($e.ddnsSearchDomain // "") != "" and (($e.ddnsSearchDomain // "") | test("^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$"; "i") | not) then "ddnsSearchDomain \($e.ddnsSearchDomain) is not a DNS name" else empty end ) ]
    reproduce:
      - "echo 'Palette console: Tenant Settings > Private Cloud Gateways > <pcg> > DNS: a mapping for datacenter {{ .entity.spec.cloudConfig.placement.datacenter }} and network {{ .entity.spec.cloudConfig.placement.network.networkName }}'   # needed for DHCP with DDNS"
    fix:
      owner: palette
      text: Refuse a DHCP cluster with DDNS and no DNS mapping in the validate route.
    evidence:
      - kind: source
        note: an empty type is DDNS; the host is required when the type is not DDNS; the enum is VIP, External, DDNS
      - kind: source
        note: MissingDDnsMapping(datacenter, networkName) for a DHCP cluster with DDNS and no mapping on the PCG
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/vmware/architecture/
        note: if you are using DHCP, Dynamic DNS is required
    tests:
      - fault: fixtures/vsphere/vip-no-host.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/vsphere/endpoint-bad-type.json
        clean: fixtures/vsphere/dhcp-clean.json

  - id: vsphere-static-ip-pool
    title: A static vSphere cluster names an IP pool on each placement
    engines: [vsphere]
    tier: static
    severity: fail
    status: source
    what: |
      With `staticIp` on the cluster, each placement network of a pool needs `parentPoolUid`, the
      uid of an IP pool of the PCG; the converter refuses an empty one. With `staticIp` off, no
      placement network can set `staticIp`; the converter refuses the pair. The docs say an IPAM
      pool is required for static addresses. A pool with no placements takes the placement of the
      cluster. `vsphere-ip-pool-capacity` reads the pool itself.
    check:
      kind: static
      expr: |
        (.entity.spec.cloudConfig.staticIp // false) as $static | (.entity.spec.cloudConfig.placement // {}) as $cp
        | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | ((.cloudConfig.placements // []) | if length == 0 then [$cp] else . end)[] | (.network // $cp.network // {}) as $n
            | ( if $static and (($n.parentPoolUid // "") == "") then "pool \($p), network \($n.networkName // "?"): staticIp is on and parentPoolUid is empty; the converter refuses it (\"ParentPoolUid should not be empty\")" else empty end ),
              ( if ($static | not) and ($n.staticIp // false) then "pool \($p), network \($n.networkName // "?"): the cluster is DHCP (staticIp false) and the placement network sets staticIp true; the converter refuses the pair" else empty end ) ]
    fix:
      owner: none
      text: The check exists in the converter; strata-preflight runs it before the request.
    evidence:
      - kind: source
        note: Palette checks the static IP data of each placement when it converts the network config
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/vmware/create-manage-vmware-clusters/
        note: an IPAM pool is required to assign static IP addresses to the nodes
    tests:
      - fault: fixtures/vsphere/static-no-pool.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/vsphere/dhcp-static-placement.json
        clean: fixtures/vsphere/dhcp-clean.json

  - id: vsphere-ip-pool-capacity
    title: The IP pool of the PCG has the addresses the cluster needs
    engines: [vsphere]
    tier: palette
    severity: fail
    status: source
    when: (.entity.spec.cloudConfig.staticIp // false) and ((.account.metadata.annotations.overlordUid // "") != "")
    what: |
      Each node takes one address, a control plane pool reserves two more, and a worker pool one
      more, for the rolling update. Palette counts the range from `start` to `end` less the allotted
      addresses. It counts at the machine pool create, after the cluster document exists. The
      failure is `IPPoolExhausted`, and the cluster stays at `IpAllocationDone`. A pool restricted to a single
      cluster that another cluster holds is refused. `GET /v1/overlords/vsphere/{uid}/pools` lists
      the pools of the PCG; the check reads the pool of the first placement and sums the pools
      that use it.
    check:
      kind: palette
      method: GET
      path: /v1/overlords/vsphere/{{ .account.metadata.annotations.overlordUid }}/pools
      expr: |
        def ip2n: split(".") | map(tonumber) | reduce .[] as $o (0; . * 256 + $o);
        .account.metadata.annotations.overlordUid as $ol | (.entity.spec.cloudConfig.placement // {}) as $cp
        | ([ .entity.spec.machinepoolconfig[] | { pool: .poolConfig.name, size: (.poolConfig.size // 0), extra: (if (.poolConfig.isControlPlane // false) then 2 else 1 end),
              uid: ((((.cloudConfig.placements // []) | first) // $cp).network.parentPoolUid // $cp.network.parentPoolUid // "") } ]) as $pools
        | ([ $pools[] | .uid | select(. != "") ] | first) as $uid
        | if $uid == null then []
          elif (.response.ok | not) then ["Palette cannot list the IP pools of PCG \($ol): \(.response.body.code // .response.status): \(.response.body.message // "")"]
          else ([ (.response.body.items // [])[] | select(.metadata.uid == $uid) ] | first) as $ip
            | if $ip == null then ["no IP pool \($uid) on PCG \($ol): the placement names it as parentPoolUid"]
              else ([ $pools[] | select(.uid == $uid) ]) as $mine
                | ([ $mine[] | .size + .extra ] | add) as $need
                | (($ip.spec.pool.end | ip2n) - ($ip.spec.pool.start | ip2n) + 1) as $total
                | (($ip.status.allottedIps // []) | length) as $used
                | ($total - $used) as $free
                | [ ( if ($ip.spec.restrictToSingleCluster // false) and ($ip.status.inUse // false) then "IP pool \($ip.metadata.name // $uid) is restricted to a single cluster and in use by \(($ip.status.associatedClusters // []) | join(", ")): Palette refuses another cluster on it" else empty end ),
                    ( if $need > $free then "IP pool \($ip.metadata.name // $uid) has \($free) free of \($total) addresses (\($used) allotted), and the pools \([ $mine[] | .pool ] | join(", ")) need \($need): one for each node, plus 2 for a control plane pool and 1 for a worker pool; Palette answers IPPoolExhausted, and the cluster stays at IpAllocationDone" else empty end ) ]
              end
          end
    reproduce:
      - "curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/overlords/vsphere/{{ .account.metadata.annotations.overlordUid }}/pools\" | jq '.items[] | {uid: .metadata.uid, name: .metadata.name, start: .spec.pool.start, end: .spec.pool.end, allotted: (.status.allottedIps | length), single: .spec.restrictToSingleCluster, inUse: .status.inUse}'"
    fix:
      owner: palette
      text: Run ValidateIpAvailability in the validate route.
    evidence:
      - kind: source
        note: free is the range less the allotted and the extra addresses; IPPoolExhausted
      - kind: source
        note: extra is 1, 2 for a control plane pool, 0 with RollingUpdateScaleIn
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/pcg/manage-pcg/create-manage-node-pool/
        note: two more IPs for a control plane pool and one for a worker pool; with too few, the cluster is not deployed
    tests:
      - fault: fixtures/vsphere/ip-pool-exhausted.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/vsphere/ip-pool-single-cluster.json

  - id: ntp-servers
    title: The NTP servers of the cluster are addresses, and a cluster that needs them has some
    engines: [maas, edge, vsphere]
    tier: static
    severity: warn
    status: source
    what: |
      The converter refuses an entry of `ntpServers` that is not an IPv4, IPv6, or DNS name. With
      no server, a vSphere cluster drifts: the docs recommend NTP servers. A multi-node edge cluster
      needs synchronized time; the cluster setting overwrites the per-host TUI and user-data
      setting, and with none each host keeps its own. MAAS gives its machines the time of the
      region controller, so an empty list is not a fault there. No check reaches the servers from
      the site; the reproduce line asks one from this machine.
    check:
      kind: static
      expr: |
        def is_addr: test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$") or test("^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$"; "i") or test("^[0-9a-f:]+$"; "i");
        .cloud as $cloud
        | ((.entity.spec.cloudConfig.ntpServers // []) | map(select(. != ""))) as $ntp
        | ([ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // []) | length ] | add // 0) as $hosts
        | [ ( $ntp[] | select(is_addr | not) | "ntpServers entry \(.) is not an address or a host name: the converter refuses the create" ),
            ( if ($ntp | length) == 0 then
                (if $cloud == "vsphere" then "no NTP server: the docs recommend NTP servers for a vSphere cluster, and without them the nodes drift"
                 elif $cloud == "edge" and $hosts > 1 then "no NTP server on a multi-node edge cluster: the docs need synchronized time across the hosts, and each host keeps its own TUI or user-data setting"
                 else empty end)
              else empty end ) ]
    reproduce:
      - "for s in {{ (.entity.spec.cloudConfig.ntpServers // []) | join(\" \") }}; do dig +short $s; nc -zu -w 2 $s 123 && echo \"$s answers on udp/123\"; done   # from this machine, not from the site"
    fix:
      owner: palette
      text: Warn in the validate route when a vSphere or a multi-node edge cluster names no NTP server.
    evidence:
      - kind: source
        note: validator.IsValidAddresses("NTP servers", ...)
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/vmware/create-manage-vmware-clusters/
        note: we recommend specifying NTP servers; without them, time drift issues
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/cluster-deployment/
        note: NTP servers correctly configured in a multi-node cluster; all nodes must have their time synchronized
    tests:
      - fault: fixtures/vsphere/ntp-empty.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/edge/ntp-bad.json
        clean: fixtures/edge/clean.json
