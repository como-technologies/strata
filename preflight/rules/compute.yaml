  - id: aks-system-pool
    title: An AKS cluster has one Linux system node pool with no taint
    engines: [aks]
    tier: static
    severity: fail
    status: source
    what: |
      AKS needs one system node pool. The create fails with `AksMissingSystemPool` ("At least one
      pool should be system node pool") when no pool has `managedPoolConfig.isSystemNodePool`; the
      validate route does not run the check. The converter reads `managedPoolConfig`, not
      `cloudConfig.isSystemNodePool`. A system pool is Linux (`AksInvalidSystemPoolOsType`), takes
      no taint (`AksSystemPoolTaintsNotSupported`), and has one node or more.
    check:
      kind: static
      expr: |
        .entity.spec.machinepoolconfig as $pools
        | ([ $pools[] | select(.managedPoolConfig.isSystemNodePool // false) ]) as $sys
        | (if ($sys | length) == 0 then ["no pool has managedPoolConfig.isSystemNodePool true: the create fails with AksMissingSystemPool after the validate route passed; the converter reads managedPoolConfig, not cloudConfig.isSystemNodePool"] else [] end)
          + [ $sys[] | .poolConfig.name as $p
              | ( if ((.managedPoolConfig.osType // "Linux") != "Linux") or ((.managedPoolConfig.osSku // "") | test("windows"; "i")) then "system pool \($p) is \(.managedPoolConfig.osSku // .managedPoolConfig.osType): a system pool is Linux (AksInvalidSystemPoolOsType)" else empty end ),
                ( if ((.poolConfig.taints // []) | length) > 0 then "system pool \($p) carries \(.poolConfig.taints | length) taint(s): AKS takes none on a system pool (AksSystemPoolTaintsNotSupported)" else empty end ),
                ( if (.poolConfig.size // 0) < 1 then "system pool \($p) has size \(.poolConfig.size // 0): a system pool needs one node or more" else empty end ) ]
    fix:
      owner: palette
      text: Run the system pool checks in the AKS validate route.
    evidence:
      - kind: source
        note: Palette returns AksMissingSystemPool when no pool is a system pool, and checks the OS type and the taints of a system pool
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/public-cloud/azure/aks/
        note: at least one system node pool; a system pool must have at least one node; system node pools are always Linux
    tests:
      - fault: fixtures/aks/no-system-pool.json
        clean: fixtures/aks/clean.json
      - fault: fixtures/aks/system-pool-windows.json

  - id: maas-resource-pool
    title: The resource pool of each MAAS machine pool exists
    engines: [maas]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null
    what: |
      CAPMAAS allocates the machines of a pool from the MAAS resource pool the pool names. A name
      that is not in MAAS matches no machine, and the pool never fills; Palette checks nothing
      about it. `GET /v1/cloudaccounts/maas/{uid}/properties/resourcePools` lists the pools of MAAS
      through the PCG of the account.
    check:
      kind: palette
      method: GET
      path: /v1/cloudaccounts/maas/{{ .entity.spec.cloudAccountUid }}/properties/resourcePools
      expr: |
        if (.response.ok | not) then ["Palette cannot list the resource pools of the MAAS account: \(.response.body.code // .response.status): \(.response.body.message // ""); the route needs the PCG of the account to be active"]
        else ([ (.response.body.items // [])[] | .name ]) as $pools
          | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.resourcePool // "") as $r
              | select($r != "" and (($pools | index($r)) == null))
              | "pool \($p) names resource pool \($r), which is not in MAAS (\($pools | join(", "))): CAPMAAS finds no machine to allocate" ]
        end
    reproduce:
      - "maas $PROFILE resource-pools read | jq -r '.[].name'"
    fix:
      owner: palette
      text: Read the resource pools in the validate route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/create-manage-maas-clusters/
        note: "Resource pool: the MAAS resource pool from which to deploy nodes"
      - kind: source
        note: ResourcePool, MinCPU, MinMemoryInMB, and Tags go to CAPMAAS
    tests:
      - fault: fixtures/maas/pool-missing.json
        clean: fixtures/maas/clean.json

  - id: maas-tags
    title: Each tag of a MAAS machine pool is a tag of MAAS
    engines: [maas]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null and ([ .entity.spec.machinepoolconfig[] | (.cloudConfig.tags // [])[] ] | length) > 0
    what: |
      Palette selects the machines that carry every tag of the pool. A tag that MAAS does not
      define is on no machine, so the pool matches none and never fills. `GET /v1/cloudaccounts/maas/{uid}/properties/tags`
      lists the tags through the PCG. A tag that exists can still be on too few machines;
      `maas-machines-ready` says how to count them.
    check:
      kind: palette
      method: GET
      path: /v1/cloudaccounts/maas/{{ .entity.spec.cloudAccountUid }}/properties/tags
      expr: |
        if (.response.ok | not) then ["Palette cannot list the tags of the MAAS account: \(.response.body.code // .response.status): \(.response.body.message // ""); the route needs the PCG of the account to be active"]
        else ([ (.response.body.items // [])[] | .name ]) as $tags
          | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.tags // [])[]
              | select(. as $t | ($tags | index($t)) == null)
              | "pool \($p) asks for tag \(.), which no MAAS tag defines (\($tags | join(", "))): a machine must carry every tag of the pool, so none matches" ]
        end
    reproduce:
      - "maas $PROFILE tags read | jq -r '.[].name'"
      - "maas $PROFILE tag machines {{ .entity.spec.machinepoolconfig[0].cloudConfig.tags[0] // \"<tag>\" }} | jq -r '.[] | [.hostname, .status_name, .pool.name] | @tsv'"
    fix:
      owner: palette
      text: Read the tags in the validate route.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/create-manage-maas-clusters/
        note: with multiple tags, Palette only selects machines that have all of the specified tags
    tests:
      - fault: fixtures/maas/tag-missing.json
        clean: fixtures/maas/clean.json

  - id: maas-pool-fields
    title: Each MAAS machine pool names a resource pool, an instance type, and a zone
    engines: [maas]
    tier: static
    severity: fail
    status: source
    what: |
      A pool without `resourcePool`, or without the three fields of `instanceType`, fails the
      create with a server error, not a 400. The create
      refuses a pool with no availability zone (`AvailabilityZoneRequired`) after the cluster
      document exists; the validate route does not. The check reads the three fields of each pool.
    check:
      kind: static
      expr: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | .cloudConfig as $c
          | ( if ($c.resourcePool // "") == "" then "pool \($p) names no resourcePool: the converter dereferences it, and the create fails" else empty end ),
            ( if ($c.instanceType // null) == null then "pool \($p) has no instanceType: the converter dereferences minCPU, minMemInMB, and minDiskSizeInGB, and the create fails" else empty end ),
            ( if (($c.azs // []) | length) == 0 then "pool \($p) names no availability zone: the create fails with AvailabilityZoneRequired after the validate route passed" else empty end ) ]
    fix:
      owner: palette
      text: Check the three fields in the validate route, and refuse a pool without them with a 400.
    evidence:
      - kind: source
        note: a pool with no resource pool or no instance type fails the create with a server error
      - kind: source
        note: AvailabilityZoneRequired on the create path
    tests:
      - fault: fixtures/maas/no-instance-type.json
        clean: fixtures/maas/clean.json

  - id: maas-machines-ready
    title: MAAS has enough Ready machines for each pool
    engines: [maas]
    tier: cloud
    severity: fail
    status: inferred
    what: |
      CAPMAAS allocates a machine in the `Ready` state from the resource pool, in one of the zones.
      The machine carries every tag of the pool, and has `minCPU` cores and `minMemInMB` of memory
      or more. With too few, the pool waits for a machine that never comes, and Palette says
      `Provisioning`. The PCG docs say the same for the PCG: machines in the Ready state for the
      zone and the pool. The MAAS CLI needs a login profile that the world does not carry. The MAAS
      API signs each call with OAuth 1.0 and the key, which the world holds redacted. So this rule has no check;
      the reproduce lines count with the CLI. The field names are those of the MAAS API; no run
      confirms them.
    reproduce:
      - "maas $PROFILE machines read | jq --arg pool {{ .entity.spec.machinepoolconfig[0].cloudConfig.resourcePool }} '[ .[] | select(.status_name == \"Ready\" and .pool.name == $pool) | {hostname, zone: .zone.name, tag_names, cpu_count, memory} ]'   # count >= the pool size; zone in {{ (.entity.spec.machinepoolconfig[0].cloudConfig.azs // []) | join(\",\") }}; tag_names hold {{ (.entity.spec.machinepoolconfig[0].cloudConfig.tags // []) | join(\",\") }}; cpu_count >= {{ .entity.spec.machinepoolconfig[0].cloudConfig.instanceType.minCPU }}; memory (MB) >= {{ .entity.spec.machinepoolconfig[0].cloudConfig.instanceType.minMemInMB }}"
      - "maas $PROFILE machines read | jq '[ .[] | .status_name ] | group_by(.) | map({state: .[0], n: length})'"
    fix:
      owner: palette
      text: Count the Ready machines that match each pool in the validate route, through the PCG.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/pcg/deploy-pcg/maas/
        note: one or more machines in the Ready state for the chosen availability zone and resource pool
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/maas/create-manage-maas-clusters/
        note: Minimum CPU and Minimum Memory select machines from the resource pool with at least that amount
      - kind: source
        note: ResourcePool, MinCPU, MinMemoryInMB, and Tags go to CAPMAAS; MinDiskSizeInGB is for LXD VMs alone

  - id: edge-two-node
    title: A two-node edge cluster has two control plane hosts, a primary, a secondary, and K3s
    engines: [edge]
    tier: static
    severity: fail
    status: source
    what: |
      With `isTwoNodeCluster`, the control plane pool holds two hosts and no more: "Two-node cluster
      can only support two control-plane edge hosts". One host is the `primary` candidate and one the
      `secondary`. The Kubernetes pack carries the k3s engine annotation (`TwoNodeClusterPackMissing`). A
      priority on a worker host, or with the mode off, is refused. The validate route runs the
      pack check alone; the create runs the rest. The docs also list Palette Optimized Canonical
      for two-node clusters; Palette takes K3s alone, and this rule follows Palette.
    check:
      kind: static
      expr: |
        def k8s_names: [ .profiles[]? | .packs[] | select(.layer == "k8s") | .name ];
        (.entity.spec.cloudConfig.isTwoNodeCluster // false) as $two
        | ([ .entity.spec.machinepoolconfig[] | select(.poolConfig.isControlPlane // false) | (.cloudConfig.edgeHosts // [])[] ]) as $cp
        | ([ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | select((.poolConfig.isControlPlane // false) | not) | (.cloudConfig.edgeHosts // [])[] | select((.twoNodeCandidatePriority // "") != "") | $p ] | unique) as $worker_prio
        | ([ $cp[] | .twoNodeCandidatePriority // "" | select(. != "") ]) as $prio
        | if $two then
            [ ( if ($cp | length) != 2 then "isTwoNodeCluster with \($cp | length) control plane host(s): Palette refuses it with \"Two-node cluster can only support two control-plane edge hosts\"" else empty end ),
              ( if (($prio | index("primary")) == null) or (($prio | index("secondary")) == null) then "the two-node candidate priorities are \($prio | join(", ") | if . == "" then "not set" else . end): Palette needs one primary and one secondary (InvalidTwoNodeCandidatesPriority)" else empty end ),
              ( if ((.profiles // []) | length) > 0 and ((k8s_names | length) == 0 or (k8s_names | all(.[]; test("k3s")) | not)) then "the Kubernetes pack is \(k8s_names | join(", ")): Palette refuses a two-node cluster without the k3s engine (TwoNodeClusterPackMissing); the docs also list Palette Optimized Canonical, and Palette takes K3s alone" else empty end ),
              ( $worker_prio[] | "worker pool \(.) sets twoNodeCandidatePriority: candidates are control plane hosts alone (InvalidTwoNodeCandidates)" ) ]
          else
            [ ( if ($prio | length) > 0 then "twoNodeCandidatePriority is set on \($prio | length) host(s) and isTwoNodeCluster is off: Palette refuses it with TwoNodeClusterNotEnabled" else empty end ) ]
          end
    fix:
      owner: palette
      text: Run the two-node count and priority checks in the validate route.
    evidence:
      - kind: source
        note: Palette checks a two-node edge cluster and the priority of each candidate host
      - kind: source
        note: the pack annotation spectrocloud.com/edge-native/k8s-engine must be k3s
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/architecture/two-node/
        note: exactly two nodes in the control plane; K3s and Palette Optimized Canonical Kubernetes
    tests:
      - fault: fixtures/edge/two-node-three-hosts.json
        clean: fixtures/edge/two-node-clean.json
      - fault: fixtures/edge/two-node-pxk.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/two-node-two-primary.json

  - id: edge-host-in-use
    title: Each edge host of the cluster is registered and free
    engines: [edge]
    tier: palette
    severity: fail
    status: source
    what: |
      An edge-native cluster has no cloud account; its machines are the registered hosts it names
      by uid. A uid that is not in the project fails the create. A
      host that is part of another cluster is refused with `EdgeHostDeviceAlreadyInUse`. The
      validate route reads neither. `GET /v1/edgehosts/{uid}` gives `status.state` and
      `status.inUseClusters`. The check reads each host of each pool, one request for each.
    check:
      kind: palette
      method: GET
      each: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig as $pool | (.cloudConfig.edgeHosts // [])[] | { pool: $pool, host: . } ]
      path: /v1/edgehosts/{{ $item.host.hostUid }}
      expr: |
        [ .responses[] | .item.host.hostUid as $u | .response as $r
          | if ($r.ok | not) then "edge host \($u) is not registered in this project: \($r.body.code // $r.status): \($r.body.message // ""); the create fails"
            else ($r.body.status // {}) as $s | ([ ($s.inUseClusters // [])[] | .name // .uid ]) as $used
              | if ($used | length) > 0 then "edge host \($u) (\($r.body.metadata.name // "")) is \($s.state // "?") and part of cluster(s) \($used | join(", ")): Palette refuses it with EdgeHostDeviceAlreadyInUse" else empty end
            end ]
    reproduce:
      - "for h in {{ [ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // [])[] | .hostUid ] | join(\" \") }}; do curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/edgehosts/$h\" | jq -c '{uid: .metadata.uid, name: .metadata.name, state: .status.state, health: .status.health.state, inUse: [.status.inUseClusters[]?.name]}'; done"
    fix:
      owner: palette
      text: Read each host in the validate route.
    evidence:
      - kind: source
        note: EdgeHostDeviceAlreadyInUse when the host has associated clusters other than this one
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/edge-host-view/
        note: In-Use means the host is part of an active cluster; in-use and unpaired hosts are not offered
    tests:
      - fault: fixtures/edge/host-in-use.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/host-in-use-second-pool.json
      - fault: fixtures/edge/host-missing.json

  - id: edge-host-health
    title: Each edge host of the cluster is ready and healthy
    engines: [edge]
    tier: palette
    severity: warn
    status: source
    what: |
      The console offers hosts in the `ready` state with a `healthy` report. Palette accepts an
      `unpaired` host at the create, and does not read the health. The build then waits for an
      agent that does not report. Palette marks the
      health stale after 5 minutes without a report. The check reads each host of each pool, one
      request for each.
    check:
      kind: palette
      method: GET
      each: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig as $pool | (.cloudConfig.edgeHosts // [])[] | { pool: $pool, host: . } ]
      path: /v1/edgehosts/{{ $item.host.hostUid }}
      expr: |
        [ .responses[] | .item.host.hostUid as $u | .response as $r
          | if ($r.ok | not) then "Palette cannot read edge host \($u): \($r.body.code // $r.status): \($r.body.message // "")"
            else ($r.body.status // {}) as $s
              | ( if ($s.state // "") != "ready" then "edge host \($u) is \($s.state // "in no state"), not ready: the console offers ready hosts alone; the API accepts an unpaired host, and the build then waits for its agent" else empty end ),
                ( if (($s.health.state // "") | ascii_downcase) != "healthy" then "edge host \($u) health is \($s.health.state // "not reported")\(if ($s.health.message // "") != "" then ": \($s.health.message)" else "" end); Palette marks the health stale after 5 minutes without a report, and does not read it at create" else empty end )
            end ]
    fix:
      owner: palette
      text: Refuse a host that is not ready, or not healthy, in the validate route.
    evidence:
      - kind: source
        note: Palette accepts a host that is not ready at the create, and does not read the health of a host
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/site-deployment/edge-host-view/
        note: "Ready means the host is ready to be assigned; health is Healthy or Unhealthy"
    tests:
      - fault: fixtures/edge/host-unhealthy.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/host-unhealthy-second-pool.json
      - fault: fixtures/edge/host-unpaired.json

  - id: edge-host-arch
    title: The architecture of each edge host matches its pool
    engines: [edge]
    tier: palette
    severity: fail
    status: source
    what: |
      The create compares `spec.device.archType` of each host with
      `poolConfig.machinePoolProperties.archType` of its pool and refuses a mismatch with
      `EdgeHostDoesNotBelongToArchType`; an empty value on either side is `amd64`. The validate
      route does not run it. The check reads each host of each pool, one request for each.
    check:
      kind: palette
      method: GET
      each: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig as $pool | (.cloudConfig.edgeHosts // [])[] | { pool: $pool, host: . } ]
      path: /v1/edgehosts/{{ $item.host.hostUid }}
      expr: |
        [ .responses[] | .item.pool as $pool | .item.host.hostUid as $u | .response as $r
          | (($pool.machinePoolProperties.archType // "amd64") | ascii_downcase) as $want
          | if ($r.ok | not) then "Palette cannot read edge host \($u): \($r.body.code // $r.status): \($r.body.message // "")"
            else (($r.body.spec.device.archType // "amd64") | ascii_downcase) as $have
              | if $have != $want then "edge host \($u) is \($have), and pool \($pool.name) is \($want): Palette refuses the create with EdgeHostDoesNotBelongToArchType; an empty architecture counts as amd64" else empty end
            end ]
    reproduce:
      - "for h in {{ [ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // [])[] | .hostUid ] | join(\" \") }}; do curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/edgehosts/$h\" | jq -r '[.metadata.uid, .spec.device.archType] | @tsv'; done"
    fix:
      owner: palette
      text: Run the architecture check of the create in the validate route.
    evidence:
      - kind: source
        note: Palette compares the architecture of each host of the pool with the architecture of the pool; an empty value is amd64
    tests:
      - fault: fixtures/edge/host-arm64.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/host-arm64-second-pool.json

  - id: edge-host-resources
    title: Each edge host has the cores, the memory, and the disk of the docs
    engines: [edge]
    tier: palette
    severity: warn
    status: source
    what: |
      The hardware page needs two cores, 8 GB of memory, and a 150 GB SSD as the main drive for an
      appliance host. The architecture page says 100 GB. Palette reads none of them at create. The
      docs give no floor for each Kubernetes distribution. The check reads `spec.device` of each
      host of each pool, one request for each: `cpu.cores`, `memory.sizeInMB`, and the largest
      `disks[].size` (GB).
    check:
      kind: palette
      method: GET
      each: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig as $pool | (.cloudConfig.edgeHosts // [])[] | { pool: $pool, host: . } ]
      path: /v1/edgehosts/{{ $item.host.hostUid }}
      expr: |
        [ .responses[] | .item.host.hostUid as $u | .response as $r
          | if ($r.ok | not) then "Palette cannot read edge host \($u): \($r.body.code // $r.status): \($r.body.message // "")"
            else ($r.body.spec.device // {}) as $d | ($d.cpu.cores // 0) as $cores | ($d.memory.sizeInMB // 0) as $mem | ([ ($d.disks // [])[] | .size // 0 ] | sort | .[-1] // 0) as $disk
              | ( if $cores < 2 then "edge host \($u) has \($cores) core(s); the docs need 2" else empty end ),
                ( if $mem < 8192 then "edge host \($u) has \($mem) MB of memory; the docs need 8 GB" else empty end ),
                ( if $disk < 150 then "edge host \($u) has a \($disk) GB main disk; the hardware page needs 150 GB on an SSD, and the architecture page says 100 GB" else empty end )
            end ]
    reproduce:
      - "for h in {{ [ .entity.spec.machinepoolconfig[] | (.cloudConfig.edgeHosts // [])[] | .hostUid ] | join(\" \") }}; do curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/edgehosts/$h\" | jq -c '{uid: .metadata.uid, cores: .spec.device.cpu.cores, memMB: .spec.device.memory.sizeInMB, disksGB: [.spec.device.disks[].size]}'; done"
    fix:
      owner: palette
      text: Compare the device with the floors of the docs in the validate route, and make the two pages agree.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/hardware-requirements/
        note: "minimum two cores; minimum 8 GB; main drive requires a minimum of 150 GB storage, an SSD"
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/edge/architecture/
        note: a minimum of 100 GB storage
      - kind: source
        note: disk size is in GB
    tests:
      - fault: fixtures/edge/host-small.json
        clean: fixtures/edge/clean.json
      - fault: fixtures/edge/host-small-second-pool.json

  - id: edge-host-duplicate
    title: No edge host is in two pools, and no host name is used two times
    engines: [edge]
    tier: static
    severity: fail
    status: source
    what: |
      The create refuses a host uid that is in two pools, or two times in one pool
      (`EdgeHostDuplicateWithinEdgeNativeCluster`, `EdgeHostDuplicateWithinEdgeNativePool`), and
      a host name used two times (`DuplicateHostName`). The validate route does not run these
      checks.
    check:
      kind: static
      expr: |
        ([ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.edgeHosts // [])[] | { uid: .hostUid, name: (.hostName // ""), pool: $p } ]) as $hosts
        | ([ $hosts | group_by(.uid)[] | select(length > 1) | "host \(.[0].uid) is in pool(s) \([ .[] | .pool ] | join(", ")): Palette refuses a host in two pools or two times in one (EdgeHostDuplicateWithinEdgeNativeCluster)" ])
          + ([ $hosts | map(select(.name != "")) | group_by(.name)[] | select(length > 1) | "host name \(.[0].name) is used by \(length) hosts: Palette refuses it with DuplicateHostName" ])
    fix:
      owner: palette
      text: Run the two duplicate checks of the create in the validate route.
    evidence:
      - kind: source
        note: Palette refuses an edge host that is in two pools, and a host name that is used two times
    tests:
      - fault: fixtures/edge/host-duplicate.json
        clean: fixtures/edge/clean.json

  - id: vsphere-placement-fields
    title: A vSphere placement names its datacenter, folders, cluster, datastore, and network
    engines: [vsphere]
    tier: static
    severity: fail
    status: source
    what: |
      The docs mark the datacenter, the deployment folder, the image template folder, and the
      network type as required. Each pool has a compute cluster, a resource pool, a datastore, and
      a network. The converter checks none of them for emptiness. It copies the cluster placement
      into a pool with none. An empty field fails in vCenter during the build. The
      check reads the cluster placement and the effective placement of each pool.
    check:
      kind: static
      expr: |
        (.entity.spec.cloudConfig.placement // {}) as $cp
        | ([ ("datacenter", "folder", "imageTemplateFolder") | . as $f | select(($cp[$f] // "") == "") | "placement.\($f) is empty: the docs mark it required, the converter checks none of them, and the build fails in vCenter" ])
          + [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | ((.cloudConfig.placements // []) | if length == 0 then [$cp] else . end)[] | . as $pl
              | ("cluster", "datastore") | . as $f | select((($pl[$f] // $cp[$f]) // "") == "") | "pool \($p): placement \($f) is empty, and the cluster placement has none either" ]
          + [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | ((.cloudConfig.placements // []) | if length == 0 then [$cp] else . end)[]
              | select((((.network.networkName // $cp.network.networkName) // "") == "")) | "pool \($p): placement network.networkName is empty" ]
    fix:
      owner: palette
      text: Check the placement fields in the converter.
    evidence:
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/vmware/create-manage-vmware-clusters/
        note: Datacenter, Deployment Folder, Image Template Folder, and Network Type are required; each pool has Compute Cluster, Resource Pool, Datastore, Network
      - kind: source
        note: each field falls back to the cluster placement, and none is checked for emptiness
    tests:
      - fault: fixtures/vsphere/no-datacenter.json
        clean: fixtures/vsphere/clean.json

  - id: vsphere-datacenter
    title: The datacenter, the compute clusters, and the template folder exist in vCenter
    engines: [vsphere]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null
    what: |
      `GET /v1/cloudaccounts/vsphere/{uid}/properties/datacenters` lists, through the PCG of the
      account, each datacenter with its compute clusters and its VM folders. The check looks for
      the placement datacenter, the compute cluster of each pool, and the image template folder.
      The docs say to make that folder in advance, with the Spectro role. The deployment folder is made
      by the build when it is missing (connected installs), so the check does not need it.
    check:
      kind: palette
      method: GET
      path: /v1/cloudaccounts/vsphere/{{ .entity.spec.cloudAccountUid }}/properties/datacenters
      expr: |
        (.entity.spec.cloudConfig.placement // {}) as $cp
        | if (.response.ok | not) then ["Palette cannot list the datacenters of the vSphere account: \(.response.body.code // .response.status): \(.response.body.message // ""); the route goes through the PCG of the account"]
          else ([ (.response.body.items // [])[] | select(.datacenter == $cp.datacenter) ] | first) as $dc
            | if $dc == null then ["datacenter \($cp.datacenter) is not in vCenter (it has \([ (.response.body.items // [])[] | .datacenter ] | join(", ")))"]
              else ([ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | ((.cloudConfig.placements // []) | if length == 0 then [$cp] else . end)[] | ((.cluster // $cp.cluster) // "") | select(. != "")
                      | select(. as $c | (($dc.computeclusters // []) | index($c)) == null)
                      | "compute cluster \(.) of pool \($p) is not in datacenter \($cp.datacenter) (\(($dc.computeclusters // []) | join(", ")))" ] | unique)
                + (if ($cp.imageTemplateFolder // "") != "" and ((($dc.folders // []) | index($cp.imageTemplateFolder)) == null) then ["imageTemplateFolder \($cp.imageTemplateFolder) is not a VM folder of \($cp.datacenter) (\(($dc.folders // []) | join(", "))): the docs say to make it in advance with the Spectro role, and the PCG imports the OVA template into it"] else [] end)
              end
          end
    reproduce:
      - "GOVC_URL=https://{{ .account.spec.vcenterServer // \"<vcenter>\" }} GOVC_USERNAME={{ .account.spec.username // \"<user>\" }} GOVC_PASSWORD=<password> GOVC_INSECURE=1 govc ls /{{ .entity.spec.cloudConfig.placement.datacenter }}/host /{{ .entity.spec.cloudConfig.placement.datacenter }}/vm/{{ .entity.spec.cloudConfig.placement.imageTemplateFolder }}"
    fix:
      owner: palette
      text: Read the datacenter and the folders in the validate route.
    evidence:
      - kind: source
        note: the PCG answers items[{datacenter, computeclusters, folders}]
      - kind: doc
        ref: https://docs.spectrocloud.com/clusters/data-center/vmware/permissions/
        note: the spectro-templates folder must be manually created in advance; the target VM folder is created automatically for connected installs
    tests:
      - fault: fixtures/vsphere/datacenter-unknown.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/vsphere/template-folder-missing.json

  - id: vsphere-compute-resources
    title: The datastore, the network, and the resource pool exist in the compute cluster
    engines: [vsphere]
    tier: palette
    severity: fail
    status: source
    when: .entity.spec.cloudAccountUid != null
    what: |
      `GET /v1/cloudaccounts/vsphere/{uid}/properties/computecluster/resources` lists, through the
      PCG, the datastores, the networks, and the resource pools of one compute cluster. A name
      that is not there fails the build in vCenter. The check reads the placement of each pool, with
      one request for each compute cluster that the pools name.
    check:
      kind: palette
      method: GET
      each: |
        (.entity.spec.cloudConfig.placement // {}) as $cp
        | [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $pool
            | ((.cloudConfig.placements // []) | if length == 0 then [{}] else . end)[]
            | { pool: $pool, cluster: (.cluster // $cp.cluster // ""), datastore: (.datastore // $cp.datastore // ""), network: (.network.networkName // $cp.network.networkName // ""), resourcePool: (.resourcePool // $cp.resourcePool // "") }
            | select(.cluster != "") ]
        | group_by(.cluster)
        | map({ cluster: .[0].cluster, wants: . })
      path: /v1/cloudaccounts/vsphere/{{ .entity.spec.cloudAccountUid }}/properties/computecluster/resources?datacenter={{ .entity.spec.cloudConfig.placement.datacenter }}&computecluster={{ $item.cluster }}
      expr: |
        [ .responses[] | .item as $i | .response as $r
          | if ($r.ok | not) then "Palette cannot list the resources of compute cluster \($i.cluster): \($r.body.code // $r.status): \($r.body.message // ""); the route goes through the PCG of the account"
            else ($r.body.computecluster // {}) as $cc
              | $i.wants[] | . as $w
              | ( if $w.datastore != "" and (($cc.datastores // []) | index($w.datastore)) == null then "pool \($w.pool): datastore \($w.datastore) is not in compute cluster \($i.cluster) (\(($cc.datastores // []) | join(", ")))" else empty end ),
                ( if $w.network != "" and (($cc.networks // []) | index($w.network)) == null then "pool \($w.pool): network \($w.network) is not in compute cluster \($i.cluster) (\(($cc.networks // []) | join(", ")))" else empty end ),
                ( if $w.resourcePool != "" and $w.resourcePool != "Resources" and (($cc.resourcePools // []) | index($w.resourcePool)) == null then "pool \($w.pool): resource pool \($w.resourcePool) is not in compute cluster \($i.cluster) (\(($cc.resourcePools // []) | join(", ")))" else empty end )
            end ]
    reproduce:
      - "for c in {{ [ .entity.spec.cloudConfig.placement.cluster // empty, (.entity.spec.machinepoolconfig[] | (.cloudConfig.placements // [])[] | .cluster // empty) ] | unique | join(\" \") }}; do curl -s -H \"ApiKey: $PALETTE_API_KEY\" -H \"ProjectUid: $PALETTE_PROJECT_UID\" \"${PALETTE_API:-https://api.spectrocloud.com}/v1/cloudaccounts/vsphere/{{ .entity.spec.cloudAccountUid }}/properties/computecluster/resources?datacenter={{ .entity.spec.cloudConfig.placement.datacenter }}&computecluster=$c\" | jq .computecluster; done"
    fix:
      owner: palette
      text: Read the resources of each placement in the validate route.
    evidence:
      - kind: source
        note: the PCG answers computecluster{datastores, networks, resourcePools} for a datacenter and a compute cluster
      - kind: source
        note: the API of Palette gives the datastores, the networks, and the resource pools of each compute cluster
    tests:
      - fault: fixtures/vsphere/datastore-missing.json
        clean: fixtures/vsphere/clean.json
      - fault: fixtures/vsphere/datastore-missing-second-pool.json
      - fault: fixtures/vsphere/datastore-missing-second-cluster.json

  - id: vsphere-instance-floor
    title: Each vSphere pool has one CPU, 1024 MiB, and a 20 GiB disk or more
    engines: [vsphere]
    tier: static
    severity: fail
    status: source
    what: |
      The converter refuses `numCPUs` under 1, `memoryMiB` under 1024, and `diskGiB` under 20, and
      dereferences a missing `instanceType`. The docs give no floor for a workload node. The
      tutorials use 4 CPUs, 8 GiB, and 60 GiB. The PCG needs 4 CPUs, 4 GiB, and 60 GiB.
      `worker-cpu-floor` reads the CPU the packs need across the workers.
    check:
      kind: static
      expr: |
        [ .entity.spec.machinepoolconfig[] | .poolConfig.name as $p | (.cloudConfig.instanceType // null) as $i
          | if $i == null then "pool \($p) has no instanceType: the converter dereferences it, and the create fails"
            else ( if ($i.numCPUs // 0) < 1 then "pool \($p) has \($i.numCPUs // 0) CPU(s); the converter needs 1 or more, and the tutorials use 4" else empty end ),
                 ( if ($i.memoryMiB // 0) < 1024 then "pool \($p) has \($i.memoryMiB // 0) MiB; the converter needs 1024 or more, and the tutorials use 8192" else empty end ),
                 ( if ($i.diskGiB // 0) < 20 then "pool \($p) has a \($i.diskGiB // 0) GiB disk; the converter needs 20 or more, and the tutorials use 60" else empty end ) end ]
    fix:
      owner: none
      text: The check exists in the converter; strata-preflight runs it before the request.
    evidence:
      - kind: source
        note: "\"equal or greater than 1\", \"equal or greater than 1024 MiB\", \"equal or greater than 20 GiB\""
      - kind: doc
        ref: https://docs.spectrocloud.com/tutorials/getting-started/palette/vmware/deploy-k8s-cluster/
        note: CPU 4 cores, memory 8 GB, disk 60 GB
    tests:
      - fault: fixtures/vsphere/small-instance.json
        clean: fixtures/vsphere/clean.json
