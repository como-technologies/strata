apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-observer
  labels: {{- include "observer.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strata-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strata-observer
    spec:
      serviceAccountName: strata-observer
      automountServiceAccountToken: false
      securityContext: {{- include "observer.podSecurity" . | nindent 8 }}
      {{- include "observer.pullSecrets" . | nindent 6 }}
      containers:
        - name: observer
          image: {{ include "observer.image" . }}
          args:
            - serve
            - --strata=/usr/local/bin/strata
            - --cluster-uid=$(STRATA_CLUSTER_UID)
            - --records=/records
            - --work=/work
            - --state=/state
            - --content-every={{ .Values.contentEvery }}
            - --versions-every={{ .Values.versionsEvery }}
            {{- if .Values.readPods }}
            - --read-pods
            - --kube-dir=/var/run/secrets/kubernetes.io/serviceaccount
            {{- end }}
          env:
            {{- include "observer.env" . | nindent 12 }}
            - name: XDG_STATE_HOME
              value: /state
          startupProbe:
            exec:
              command: [/usr/local/bin/strata-observer, health]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [/usr/local/bin/strata-observer, health]
            periodSeconds: 30
          securityContext: {{- include "observer.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: records, mountPath: /records, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: state, mountPath: /state }
            {{- if .Values.readPods }}
            - { name: kube-credentials, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            {{- end }}
      volumes:
        - name: records
          projected:
            defaultMode: 0440
            sources:
              - secret: { name: strata-observer-records-0, optional: true }
              - secret: { name: strata-observer-records-1, optional: true }
              - secret: { name: strata-observer-records-2, optional: true }
              - secret: { name: strata-observer-records-3, optional: true }
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: state
          emptyDir:
            sizeLimit: 16Mi
        {{- if .Values.readPods }}
        - name: kube-credentials
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
