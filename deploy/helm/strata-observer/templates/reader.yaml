# The role of a person who opens the page: a port-forward to the pod, and no Secret and no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strata-observer-reader
  labels: {{- include "observer.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [strata-observer]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
{{- if .Values.readerGroup }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strata-observer-reader
  labels: {{- include "observer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strata-observer-reader
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.readerGroup }}
{{- end }}
