apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-observer
  labels:
    app.kubernetes.io/name: strata-observer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strata-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strata-observer
    spec:
      serviceAccountName: strata-observer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: ghcr.io/como-technologies/strata-observer:VERSION
          args:
            - serve
            - --strata=/usr/local/bin/strata
            - --cluster-uid=$(STRATA_CLUSTER_UID)
            - --records=/records
            - --work=/work
            - --state=/state
          env:
            - name: STRATA_CLUSTER_UID
              valueFrom:
                configMapKeyRef:
                  name: strata-observer
                  key: cluster-uid
            - name: PALETTE_API
              valueFrom:
                configMapKeyRef:
                  name: strata-observer
                  key: palette-api
            - name: PALETTE_PROJECT_UID
              valueFrom:
                configMapKeyRef:
                  name: strata-observer
                  key: project-uid
            - name: PALETTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: strata-observer-key
                  key: api-key
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work
            - name: XDG_STATE_HOME
              value: /state
          # The listener is on 127.0.0.1, so a probe runs in the container.
          startupProbe:
            exec:
              command: [/usr/local/bin/strata-observer, health]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [/usr/local/bin/strata-observer, health]
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: records, mountPath: /records, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: state, mountPath: /state }
      volumes:
        # The pipeline writes the records. Four Secrets give room for 4 MiB, with no change here.
        - name: records
          projected:
            defaultMode: 0440
            sources:
              - secret: { name: strata-observer-records-0, optional: true }
              - secret: { name: strata-observer-records-1, optional: true }
              - secret: { name: strata-observer-records-2, optional: true }
              - secret: { name: strata-observer-records-3, optional: true }
        # A cycle can write the values of a cluster here, and removes them. It stays in memory.
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        # The first-seen times and the counts of each move. It holds no value.
        - name: state
          emptyDir:
            sizeLimit: 16Mi
