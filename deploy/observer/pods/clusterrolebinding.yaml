# The binding gives the role to the service account of the observer. A delete of the namespace does
# not delete the binding or the role. Delete both by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strata-observer-pods
  labels:
    app.kubernetes.io/name: strata-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: strata-observer-pods
subjects:
  - kind: ServiceAccount
    name: strata-observer
    namespace: strata-observer
