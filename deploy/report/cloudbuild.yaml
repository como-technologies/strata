# The build of the image of the endpoint of the report, on Cloud Build. deploy.sh submits it from
# the root of the repository with the substitution _IMAGE, the full name of the image. The build
# runs as the account strata-report-build: deploy.sh names it with --service-account.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/report/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
# A release build of Rust takes more than the default time of 10 minutes.
timeout: 2400s
options:
  # A build with its own account must say where the log goes. The log goes to Cloud Logging only,
  # so the build needs no bucket of logs.
  logging: CLOUD_LOGGING_ONLY
