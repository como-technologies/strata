name: strata retire gate

# Reusable workflow. A repository calls it before it deletes a profile version, to check that no
# cluster still runs that version; see docs/src/use-cases/retire.md.
# Exit 0 means no cluster in the projects the key can read uses the version, and the delete can
# follow. Exit 1 means a cluster does,
# and the report names each one. A cluster that strata cannot read counts as a consumer, so it also
# exits 1. Exit 2 means strata could not answer at all. Strata deletes nothing: the delete is the
# caller's own step, after this one.
# It downloads the strata release binary and checks it against SHA256SUMS. Other CI systems run
# `strata consumers` directly, which is all this workflow does.
on:
  workflow_call:
    inputs:
      version:
        description: The profile version to retire, as name@version or a profile uid.
        required: true
        type: string
      project:
        description: The Palette project that holds the version, by name; empty means tenant scope.
        default: ""
        type: string
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: A token that can read como-technologies/strata (contents read), needed while that repository is private. The caller's own token cannot read another private repository.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY, which consumers needs to read the clusters
        required: true

permissions:
  contents: read

jobs:
  retire-gate:
    runs-on: ubuntu-latest
    steps:
      - name: install strata
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          mkdir -p .strata/bin && cd .strata/bin
          gh release download "$VERSION" --repo como-technologies/strata \
            --pattern strata-x86_64-unknown-linux-musl --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x strata-x86_64-unknown-linux-musl
          mv strata-x86_64-unknown-linux-musl strata
          ./strata --version
      - name: no cluster runs the version
        env:
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_API: ${{ inputs.palette-api }}
          PALETTE_PROJECT: ${{ inputs.project }}
          VERSION_REF: ${{ inputs.version }}
        run: |
          # consumers asks Palette at the time of the command, so run this immediately before the
          # delete: a cluster can move onto the version between this check and a later step
          .strata/bin/strata consumers "$VERSION_REF"
