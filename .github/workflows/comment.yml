name: strata comment

# Reusable workflow. A repository calls it from its own pull request workflow to post the
# comparison of two refs as one comment and set a label from the impact; see docs/src/automation/pr-comments.md. It
# installs the strata release with scripts/ci/install-strata.sh, which checks the signature of
# SHA256SUMS and the binary, and runs scripts/ci/pr-comment.sh from the same tag. Other CI systems
# run the script directly.
on:
  workflow_call:
    inputs:
      a:
        description: The base ref, a snapshot file in the caller's checkout, a profile uid, or name@version
        required: true
        type: string
      b:
        description: The candidate ref
        required: true
        type: string
      label:
        description: The label to add when the impact reaches the threshold
        default: repave
        type: string
      threshold:
        description: The impact level that earns the label (none, sync, in-place, cluster-wide, may-repave, repave)
        default: repave
        type: string
      repave:
        description: Ask Palette if the change repaves the cluster, and let its answer decide the label. One ref must be a cluster, and the other a profile version that Palette holds
        default: false
        type: boolean
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: A token that can read como-technologies/strata (contents read), needed while that repository is private. The caller's own token cannot read another private repository.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY, needed only when a ref is not a snapshot file, or when repave is true
        required: false
      palette-project-uid:
        description: PALETTE_PROJECT_UID for refs that are not snapshot files, and for repave
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # the caller's repository, where snapshot files live
      - uses: actions/checkout@v7
      # this repository at the requested tag, for the installer and the script
      - uses: actions/checkout@v7
        with:
          repository: como-technologies/strata
          ref: ${{ inputs.strata-version }}
          path: .strata
          token: ${{ secrets.strata-token || github.token }}
      # the installer checks the signature of SHA256SUMS, and cosign 3 reads its bundle
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install strata
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          .strata/scripts/ci/install-strata.sh --version "$VERSION" --dir .strata/bin --bin-only \
            --require-signature
      - name: comment and label
        env:
          # the caller's token: it owns the pull request being commented on
          GH_TOKEN: ${{ github.token }}
          STRATA_BIN: ${{ github.workspace }}/.strata/bin/strata
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_API: ${{ inputs.palette-api }}
          PALETTE_PROJECT_UID: ${{ secrets.palette-project-uid }}
          A: ${{ inputs.a }}
          B: ${{ inputs.b }}
          LABEL: ${{ inputs.label }}
          THRESHOLD: ${{ inputs.threshold }}
          REPAVE: ${{ inputs.repave }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          repave=""
          if [ "$REPAVE" = true ]; then repave=--repave; fi
          .strata/scripts/ci/pr-comment.sh "$A" "$B" --pr "$PR" --repo "$REPO" \
            --label "$LABEL" --threshold "$THRESHOLD" $repave
