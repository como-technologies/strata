name: strata preflight

# Reusable workflow. A repository calls it from its own pull request or build workflow to check that
# Palette can build a cluster before the build: the body of the create, or an existing cluster, against
# the catalog of strata-preflight; see docs/src/automation/preflight.md. The report goes to the job
# summary and to an artifact, and the exit status of strata is the status of the job. With the input
# `comment`, a pull request also gets the report as a comment. It downloads the two release
# binaries, checks them against SHA256SUMS, and runs `strata preflight`; the comment runs
# scripts/ci/pr-comment.sh from the same tag. Other CI systems run the binary directly.
on:
  workflow_call:
    inputs:
      source:
        description: The body of the create as a file in the caller's checkout, or cluster:UID for a cluster as Palette holds it
        required: true
        type: string
      cloud:
        description: "The engine of a file: aws, eks, gcp, gke, azure, aks, maas, edge, or vsphere. A cluster names its own"
        default: ""
        type: string
      change:
        description: A change of the cluster as a file, for cluster:UID
        default: ""
        type: string
      tier:
        description: "The tiers to run, as a list: static, palette, cloud. Empty runs all three; static needs no key"
        default: ""
        type: string
      records:
        description: Records of the profiles in the caller's checkout, snapshot files or patterns such as releases/**/*.json, separated by spaces. With none, strata records each profile from Palette
        default: ""
        type: string
      probes:
        description: A file of custom probes in the caller's checkout, in the format of the rules
        default: ""
        type: string
      release:
        description: The Palette release, such as 4.10; a tenant key cannot read it
        default: ""
        type: string
      strict:
        description: Count a failed probe as a failed check
        default: false
        type: boolean
      ready:
        description: Exit 1 when the readiness is under this percentage; empty is no gate
        default: ""
        type: string
      no-exec:
        description: Run no command of a cloud tool; each cloud rule is NOT CHECKED
        default: false
        type: boolean
      rule:
        description: Only these rules, by id, separated by spaces; an id that is not in the catalog is an error. Empty runs every rule
        default: ""
        type: string
      verbose:
        description: Print what each check ran to the log of the job; the report does not change
        default: false
        type: boolean
      watch:
        description: Watch the build of the cluster, with source cluster:UID, until it is Running or stuck; needs the key
        default: false
        type: boolean
      every:
        description: With watch, the seconds between two readings; empty is 30
        default: ""
        type: string
      limit:
        description: With watch, the longest watch in seconds; empty is 3600
        default: ""
        type: string
      out:
        description: The directory in the checkout that gets report.md, report.json, report.html, world.json, and entity.json; the artifact holds it
        default: preflight
        type: string
      comment:
        description: Also post report.md as one comment on the pull request, updated on each push; the caller must grant pull-requests write
        default: false
        type: boolean
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: A token that can read como-technologies/strata (contents read), needed while that repository is private. The caller's own token cannot read another private repository.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY, needed for the palette tier and for cluster:UID; the static tier runs without it
        required: false
      palette-project-uid:
        description: PALETTE_PROJECT_UID, the project of the cluster
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      # the caller's repository, where the entity and the records live
      - uses: actions/checkout@v7
      # this repository at the requested tag, for the script that posts the comment
      - uses: actions/checkout@v7
        if: ${{ inputs.comment }}
        with:
          repository: como-technologies/strata
          ref: ${{ inputs.strata-version }}
          path: .strata
          token: ${{ secrets.strata-token || github.token }}
      # the release workflow of this repository signed SHA256SUMS; cosign 3 reads its bundle
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install strata and strata-preflight
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          mkdir -p .strata/bin && cd .strata/bin
          gh release download "$VERSION" --repo como-technologies/strata \
            --pattern strata-x86_64-unknown-linux-musl --pattern strata-preflight-x86_64-unknown-linux-musl \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/como-technologies/strata/.github/workflows/release.yml@refs/tags/$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x strata-x86_64-unknown-linux-musl strata-preflight-x86_64-unknown-linux-musl
          mv strata-x86_64-unknown-linux-musl strata
          mv strata-preflight-x86_64-unknown-linux-musl strata-preflight
          ./strata --version && ./strata-preflight --version
      - name: preflight
        env:
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_PROJECT_UID: ${{ secrets.palette-project-uid }}
          PALETTE_API: ${{ inputs.palette-api }}
          SOURCE: ${{ inputs.source }}
          CLOUD: ${{ inputs.cloud }}
          CHANGE: ${{ inputs.change }}
          TIER: ${{ inputs.tier }}
          RECORDS: ${{ inputs.records }}
          PROBES: ${{ inputs.probes }}
          RELEASE: ${{ inputs.release }}
          STRICT: ${{ inputs.strict }}
          READY: ${{ inputs.ready }}
          NO_EXEC: ${{ inputs.no-exec }}
          RULE: ${{ inputs.rule }}
          VERBOSE: ${{ inputs.verbose }}
          WATCH: ${{ inputs.watch }}
          EVERY: ${{ inputs.every }}
          LIMIT: ${{ inputs.limit }}
          OUT: ${{ inputs.out }}
        run: |
          args=("$SOURCE")
          [ -z "$CHANGE" ] || args+=("$CHANGE")
          [ -z "$CLOUD" ] || args+=(--cloud "$CLOUD")
          [ -z "$TIER" ] || args+=(--tier "$TIER")
          [ -z "$PROBES" ] || args+=(--probes "$PROBES")
          [ -z "$RELEASE" ] || args+=(--release "$RELEASE")
          [ -z "$READY" ] || args+=(--ready "$READY")
          [ -z "$EVERY" ] || args+=(--every "$EVERY")
          [ -z "$LIMIT" ] || args+=(--limit "$LIMIT")
          [ "$STRICT" != "true" ] || args+=(--strict)
          [ "$NO_EXEC" != "true" ] || args+=(--no-exec)
          [ "$WATCH" != "true" ] || args+=(--watch)
          # --quiet wins over --verbose, so a verbose run omits it
          [ "$VERBOSE" != "true" ] || args+=(--verbose)
          [ "$VERBOSE" = "true" ] || args+=(--quiet)
          # each rule id is one argument
          read -ra rules <<< "$RULE"
          for r in "${rules[@]}"; do args+=(--rule "$r"); done
          # with no key, the static tier alone, and nothing read from Palette
          [ -n "$PALETTE_API_KEY" ] || args+=(--offline)
          # each record pattern is one argument, which strata expands; the shell must not expand
          # it first, because bash reads `**` as `*` and drops the files it does not match
          read -ra records <<< "$RECORDS"
          for r in "${records[@]}"; do args+=(--records "$r"); done
          set +e
          .strata/bin/strata preflight "${args[@]}" --out "$OUT" --format markdown > preflight.md
          code=$?
          set -e
          cat preflight.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      # also after a failed preflight: a person must read a failed report
      - name: comment on the pull request
        if: ${{ always() && inputs.comment && github.event.pull_request }}
        env:
          # the caller's token: it owns the pull request being commented on
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ inputs.out }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: .strata/scripts/ci/pr-comment.sh --preflight "$OUT/report.md" --pr "$PR" --repo "$REPO"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preflight
          path: ${{ inputs.out }}/
          if-no-files-found: ignore
