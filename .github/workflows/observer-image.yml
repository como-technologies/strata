name: Observer image

# Builds the image of the observer from deploy/observer/ for linux/amd64 and linux/arm64, and pushes
# it to the registry of GitHub. A release also pushes the chart of deploy/helm/strata-observer. Then it signs the digest with cosign (keyless, through the OIDC
# identity of the workflow) and verifies the signature. The image holds the signed binary of one
# release of strata and the observer of the commit that runs.
#
# release.yml calls this workflow after it publishes a release. A pull request that changes the
# observer builds a test tag, as session-image.yml does for the session image. A manual run starts
# only when this file is on the default branch, so it cannot test a branch. It builds a test tag of
# main for a run on a cluster before a release.
#
# `version` is the release of the binaries: a tag such as v0.29.0, or latest. `tag` is the tag of
# the image. With no tag, the image gets test-<short sha>.
on:
  workflow_call:
    inputs:
      version:
        description: 'The release of the binaries, such as v0.29.0, or latest'
        type: string
        required: true
      tag:
        description: 'The tag of the image'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'The release of the binaries, such as v0.29.0, or latest'
        type: string
        default: latest
      tag:
        description: 'The tag of the image. With no tag, the image gets test-<short sha>'
        type: string
        default: ''
  pull_request:
    paths: [observer/**, deploy/observer/**, .github/workflows/observer-image.yml]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the installer verifies the signature of SHA256SUMS with cosign, and cosign signs the image
      - uses: sigstore/cosign-installer@v4.1.2
      - name: name the image
        env:
          TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-observer" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${TAG:-test-${HEAD_SHA::7}}" >> "$GITHUB_ENV"
      # the installer holds the rule of the signature: it stops when a file of the release fails the check
      - name: install the binaries of the release
        env:
          RELEASE: ${{ inputs.version || 'latest' }}
          STRATA_TOKEN: ${{ github.token }}
          STRATA_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
            scripts/ci/install-strata.sh --version "$RELEASE" --dir ".install/${pair#*:}" \
              --target "${pair%%:*}" --bin-only --require-signature
            cp ".install/${pair#*:}/strata" "dist/strata-${pair#*:}"
          done
      # the observer reports the version of the binary beside it
      - id: version
        name: read the version of the binary
        run: echo "number=$(dist/strata-amd64 --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/observer/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.number }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
      - name: the image has both platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee inspect.txt
          grep -q 'Platform: *linux/amd64' inspect.txt
          grep -q 'Platform: *linux/arm64' inspect.txt
      - name: sign the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # a run of this workflow, also one that a release calls, signs with the identity of this file
      - name: check the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/observer-image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: write the image to the summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image = \"$IMAGE:$IMAGE_TAG\", digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # A release also publishes the chart of the observer as an OCI chart, beside the image, and signs its
      # digest as it signs the image. The version of the chart is the version of the release, and its default
      # image is the image of that release. A test tag publishes no chart.
      - name: push and sign the chart
        if: startsWith(env.IMAGE_TAG, 'v')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart_version=$(sed -n 's/^version: //p' deploy/helm/strata-observer/Chart.yaml)
          [ "v$chart_version" = "$IMAGE_TAG" ] || { echo "the chart is $chart_version, and the tag is $IMAGE_TAG" >&2; exit 1; }
          helm package deploy/helm/strata-observer --destination chart
          printf %s "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          charts="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm push "chart/strata-observer-$chart_version.tgz" "oci://$charts" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: //p' push.txt)
          [ -n "$digest" ] || { echo "helm push gave no digest" >&2; exit 1; }
          cosign sign --yes "$charts/strata-observer@$digest"
          echo "chart = \"oci://$charts/strata-observer\", version $chart_version, digest $digest" >> "$GITHUB_STEP_SUMMARY"
