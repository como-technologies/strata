name: release

# Pushing a tag v* builds static binaries for four targets, writes SHA256SUMS, signs every file
# with cosign (keyless, through the workflow's OIDC identity), verifies the signatures, and
# publishes a GitHub release. Cut the tag with `just release`, then push it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  # the checks first: a tag must not ship what CI refuses. v0.6.1 was built, signed and published
  # from a commit whose CI was red, because nothing held the two together.
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  build:
    name: build ${{ matrix.target }}
    needs: checks
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}
      # the two binaries of a release: strata, and strata-preflight, which `strata preflight` runs
      - run: |
          cp "target/${{ matrix.target }}/release/strata" "strata-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/strata-preflight" "strata-preflight-${{ matrix.target }}"
      - run: |
          ./strata-${{ matrix.target }} --version
          ./strata-preflight-${{ matrix.target }} --version
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
      - uses: actions/upload-artifact@v7
        with:
          name: strata-${{ matrix.target }}
          path: |
            strata-${{ matrix.target }}
            strata-preflight-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # the sources, for the CI scripts the release carries beside the binaries
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: strata-*
          path: dist
          merge-multiple: true
      # a release with a target missing is worse than no release: v0.6.3 shipped without
      # strata-x86_64-unknown-linux-musl, and only the install job afterwards found it
      - name: every target is here
        working-directory: dist
        run: |
          missing=0
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "strata-$t" ] || { echo "::error::the build of $t is not here"; missing=1; }
            [ -f "strata-preflight-$t" ] || { echo "::error::the build of strata-preflight for $t is not here"; missing=1; }
          done
          for f in *; do
            case "$f" in strata-*) ;; *) echo "::error::$f is not a target binary"; missing=1 ;; esac
          done
          [ "$missing" = 0 ]
      # installer v4 installs cosign 3, whose bundle format current verifiers read; there is no floating v4 tag
      - uses: sigstore/cosign-installer@v4.1.2
      - name: checksums and signatures
        working-directory: dist
        run: |
          # a CI job on any host downloads one release: the binary and the scripts that use it
          cp ../scripts/ci/pr-comment.sh ../scripts/ci/merge-gate.sh ../scripts/ci/verify-report.sh \
            ../scripts/ci/upstream-report.sh ../scripts/ci/preflight.sh \
            ../scripts/ci/observer-records.sh ../scripts/ci/install-strata.sh .
          sha256sum strata-* ./*.sh > SHA256SUMS
          files=(strata-* *.sh SHA256SUMS)
          for f in "${files[@]}"; do
            cosign sign-blob --yes "$f" --bundle "$f.sigstore.json"
          done
          ls -la
      - name: verify what will be published
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          for f in strata-* *.sh SHA256SUMS; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes dist/*

  check:
    name: install what was published
    needs: release
    runs-on: ubuntu-latest
    steps:
      # the release as a consumer gets it: the installer asks the release for each file it needs,
      # so a release that lacks one fails here instead of in somebody's pipeline
      - uses: actions/checkout@v7
      # the installer verifies the signature of SHA256SUMS with cosign, as a consumer does
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install the tag that was just published
        env:
          STRATA_TOKEN: ${{ github.token }}
          STRATA_REPO: ${{ github.repository }}
        run: |
          scripts/ci/install-strata.sh --version "${{ github.ref_name }}" --dir .published \
            --require-signature
      - name: run the binaries and each script it installed
        run: |
          .published/strata --version
          .published/strata-preflight --version
          # `strata preflight` finds strata-preflight beside it
          .published/strata preflight --rules --cloud eks > /dev/null
          # the scripts the installer installs; it does not install itself, because running it
          # is how you got it
          for s in pr-comment.sh merge-gate.sh verify-report.sh upstream-report.sh preflight.sh observer-records.sh; do
            echo "== $s"
            .published/"$s" --help > /dev/null
          done

  # The image of the observer holds the signed binary of this release, so it comes after the
  # release. A called workflow gets no more permission than the job that calls it. When the job
  # grants less, GitHub refuses the whole run at its start, and the next release does not ship.
  observer-image:
    name: observer image
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/observer-image.yml
    with:
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
