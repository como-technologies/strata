name: strata verify report

# Reusable workflow. A repository calls it from its own scheduled workflow to verify its strata
# records and keep one issue open per record that drifted or could not be checked; see
# docs/src/automation/drift-issues.md.
# The caller sets the schedule. It installs the strata release with
# scripts/ci/install-strata.sh, which checks the signature of SHA256SUMS and the binary, and runs
# scripts/ci/verify-report.sh from the same tag. Other CI systems run the script directly.
on:
  workflow_call:
    inputs:
      records:
        description: The records to verify in the checkout of the caller, snapshot files or patterns such as releases/**/*.json, separated by spaces or new lines. Strata expands the patterns.
        required: true
        type: string
      label:
        description: The label of the issues the report keeps
        default: strata-drift
        type: string
      allow-no-digest:
        description: Accept a pack with no upstream digest, which some registries do not list; the report still names it. Without it, such a record has an issue
        default: false
        type: boolean
      who:
        description: Add who changed a record that drifted, and when, from the audit log of Palette, to its issue
        default: false
        type: boolean
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: A token that can read como-technologies/strata (contents read), needed while that repository is private. The token of the caller cannot read another private repository.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY, which verify needs to read each record's profile or cluster
        required: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # the repository of the caller, where the records live
      - uses: actions/checkout@v7
      # this repository at the requested tag, for the installer and the script
      - uses: actions/checkout@v7
        with:
          repository: como-technologies/strata
          ref: ${{ inputs.strata-version }}
          path: .strata
          token: ${{ secrets.strata-token || github.token }}
      # the installer checks the signature of SHA256SUMS, and cosign 3 reads its bundle
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install strata
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          .strata/scripts/ci/install-strata.sh --version "$VERSION" --dir .strata/bin --bin-only \
            --require-signature
      - name: verify and report
        env:
          # the token of the caller: it owns the issues
          GH_TOKEN: ${{ github.token }}
          STRATA_BIN: ${{ github.workspace }}/.strata/bin/strata
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_API: ${{ inputs.palette-api }}
          RECORDS: ${{ inputs.records }}
          LABEL: ${{ inputs.label }}
          ALLOW_NO_DIGEST: ${{ inputs.allow-no-digest && '--allow-no-digest' || '' }}
          WHO: ${{ inputs.who && '--who' || '' }}
          REPO: ${{ github.repository }}
        run: |
          # split the records on whitespace and leave each pattern for strata to expand
          set -f
          # shellcheck disable=SC2086
          .strata/scripts/ci/verify-report.sh $RECORDS --repo "$REPO" --label "$LABEL" $ALLOW_NO_DIGEST $WHO
