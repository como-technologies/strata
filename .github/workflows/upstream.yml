name: strata upstream report

# Reusable workflow. A repository calls it from its own scheduled workflow to report the pack
# versions that its strata records pin behind a newer version of the registry, and keep one issue
# open per pack that is behind; see docs/src/automation/upstream-issues.md.
# The caller sets the schedule. It installs the strata release with
# scripts/ci/install-strata.sh, which checks the signature of SHA256SUMS and the binary, and runs
# scripts/ci/upstream-report.sh from the same tag. Other CI systems run the script directly.
on:
  workflow_call:
    inputs:
      records:
        description: The records whose pins to check in the caller's checkout, snapshot files or patterns such as releases/**/*.json, separated by spaces or newlines. Strata expands the patterns.
        required: true
        type: string
      label:
        description: The label of the issues the report keeps
        default: strata-behind
        type: string
      no-impact:
        description: Do not compare each pin that is behind with the newest version, and do not ask Palette about the move
        default: false
        type: boolean
      save:
        description: A file in the checkout that keeps the report of the run as JSON; the artifact strata-behind holds it. Empty keeps none
        default: ""
        type: string
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: A token that can read como-technologies/strata (contents read), needed while that repository is private. The caller's own token cannot read another private repository.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY, which strata needs to read the registries
        required: true

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      # the caller's repository, where the records live
      - uses: actions/checkout@v7
      # this repository at the requested tag, for the installer and the script
      - uses: actions/checkout@v7
        with:
          repository: como-technologies/strata
          ref: ${{ inputs.strata-version }}
          path: .strata
          token: ${{ secrets.strata-token || github.token }}
      # the installer checks the signature of SHA256SUMS, and cosign 3 reads its bundle
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install strata
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          .strata/scripts/ci/install-strata.sh --version "$VERSION" --dir .strata/bin --bin-only \
            --require-signature
      - name: check the pins and report
        env:
          # the caller's token: it owns the issues
          GH_TOKEN: ${{ github.token }}
          STRATA_BIN: ${{ github.workspace }}/.strata/bin/strata
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_API: ${{ inputs.palette-api }}
          RECORDS: ${{ inputs.records }}
          LABEL: ${{ inputs.label }}
          NO_IMPACT: ${{ inputs.no-impact && '--no-impact' || '' }}
          SAVE: ${{ inputs.save }}
          REPO: ${{ github.repository }}
        run: |
          save=()
          [ -z "$SAVE" ] || save=(--save "$SAVE")
          # split the records on whitespace and leave each pattern for strata to expand
          set -f
          # shellcheck disable=SC2086
          .strata/scripts/ci/upstream-report.sh $RECORDS --repo "$REPO" --label "$LABEL" $NO_IMPACT "${save[@]}"
      # also after a run that found a pack behind, which exits with 1
      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.save != '' }}
        with:
          name: strata-behind
          path: ${{ inputs.save }}
          if-no-files-found: ignore
