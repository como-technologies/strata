name: checks

# Every check this repository has, as one reusable workflow. The ci workflow runs it on a push and
# a pull request, and the release workflow runs it before it builds anything, so a tag cannot ship
# what the checks refuse. It deploys nothing, so it needs no more than `contents: read`, and a
# caller that grants no more can still call it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # The version of Go comes out of observer/go.mod, as the version of Rust comes out of Cargo.toml
      - uses: actions/setup-go@v6
        with:
          go-version-file: observer/go.mod
          cache: false
      # CI runs the same recipes a developer runs locally
      - run: just lint
      - run: just test
      # a separate crate that depends on strata as a library
      - run: just library-example
      # the examples are built, not tracked: this keeps the generator working
      - run: just examples
      # the documents of the strata binary of this commit go through the allow-list of the observer
      - run: just observer-contract
      # the runner has kubectl: the base renders four objects, the base with the pods component six, and the base with the alerts component five
      - run: just observer-manifests
      - run: just observer-manifests-pods
      - run: just observer-manifests-alerts
      - run: just observer-chart

  msrv:
    name: the lowest Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes out of Cargo.toml, so the number a reader trusts and the number this job
      # builds with cannot drift apart. Edition 2024 alone says 1.85, and the `if let` chains that
      # the edition's lints introduced say 1.88, which no edition field records.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::Cargo.toml names no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # A build, and not the lints: clippy and rustfmt follow stable, and this job asks one
      # question only, which is whether the oldest compiler the crate claims still compiles it.
      - run: cargo check --workspace --all-targets

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # A benchmark that does not build or that panics fails the job. No step fails on a time. The
      # runner is a shared machine, so a time is a number to read in the log and not a limit.
      - run: just bench-short

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: ./.github/actions/mdbook
      # a step of the book runs the observer, which the recipe builds with the version of Go of its module
      - uses: actions/setup-go@v6
        with:
          go-version-file: observer/go.mod
          cache: false
      # each output in the book is the output of this build of strata
      - run: just docs-check
      # mdbook builds a broken link with no message; mdbook-lint finds it
      - run: just docs-lint
      - run: just docs
      # the book the checks passed is the book that is published, so it is built once. There is
      # no configure-pages step: it reads the Pages API, which this job has no token for, and
      # mdbook needs nothing from it. Pages is already set to build from a workflow.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/book

  build:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the same step the release workflow uses, so CI checks the binary a release would ship
      - uses: ./.github/actions/build
        with:
          target: x86_64-unknown-linux-musl
      # the name carries the `checks-` prefix on purpose: release.yml calls this workflow, and its
      # own build job uploads `strata-<target>`. Two artifacts of one name in one run collide, and
      # v0.6.3 published this job's bare `strata` in place of the release binary.
      - uses: actions/upload-artifact@v7
        with:
          name: checks-strata-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/strata
            target/x86_64-unknown-linux-musl/release/strata-preflight
          if-no-files-found: error

