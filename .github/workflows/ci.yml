name: ci

# The checks on every push, pull request, and merge group, and the one deployment that follows them.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue of main. GitHub makes a merge group commit of main and the pull request, and the
  # required checks run again on it. See "The merge" in docs/src/development/changes.md.
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  # The scan of the text and the path of each tracked file for each entry of the deny list: see
  # "The deny list" in docs/src/development/build-test.md. The list is a secret, because a file of
  # a public tree names what it denies. A run with no secret, such as a pull request from a fork,
  # gives a notice and passes. The job has no `if`, so it runs on each event.
  deny-list:
    name: deny list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: scan the tracked files
        env:
          STEP14_DENY: ${{ secrets.STEP14_DENY }}
        run: just deny-list

  # The one check that a verify reads. `riff verify pass` needs a successful run named `Gate` on
  # the head commit. The job needs `checks` and `deny-list`, so GitHub runs it only when
  # each check passed, and skips it when one failed. A skipped run is not a success. It does no
  # other work.
  gate:
    name: Gate
    needs: [checks, deny-list]
    runs-on: ubuntu-latest
    steps:
      - run: echo "each check passed"

  # The verify is a status of the head commit of a pull request, so a merge group commit has none.
  # The queue waits for it. This job sets riff/verify on the merge group commit from the status of
  # the head commit, and starts no verify. A pull request with no passed verify gets failure, and
  # the queue removes it.
  merge-verify:
    name: verify of the merge group
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.merge_group.head_ref }}
      HEAD_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/dev/merge-group-verify.sh "$HEAD_REF" "$HEAD_SHA"

  # The book goes out only after every check passed, and only from main. A merge group runs on a
  # branch of the queue, so it skips this job: the push to main after the merge publishes the book.
  publish-docs:
    name: publish the book
    needs: [checks, deny-list]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and never cancel one that is running: a half-deployed site is
    # worse than a site one commit behind
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
