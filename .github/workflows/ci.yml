name: ci

# The checks on every push and pull request, and the one deployment that follows them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  # The one check that a verify reads: `riff verify pass` needs a run named `Gate` with a success
  # on the head commit of the pull request. The job needs `checks`, so GitHub runs it only when
  # each check passed, and skips it when one failed. A skipped run is not a success. It does no
  # other work.
  gate:
    name: Gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: echo "each check passed"

  # the book goes out only after every check passed, and only from main
  publish-docs:
    name: publish the book
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and never cancel one that is running: a half-deployed site is
    # worse than a site one commit behind
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
