name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # CI runs the same recipes a developer runs locally
      - run: just lint
      - run: just test

  build:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the same step the release workflow uses, so CI checks the binary a release would ship
      - uses: ./.github/actions/build
        with:
          target: x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: strata-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/strata
          if-no-files-found: error
