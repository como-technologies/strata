name: ci

# Every check this repository has, and the one deployment that follows them. The release workflow
# calls this workflow before it builds anything, so a tag cannot ship what the checks refuse.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # CI runs the same recipes a developer runs locally
      - run: just lint
      - run: just test
      # a separate crate that depends on strata as a library
      - run: just library-example
      # the examples are built, not tracked: this keeps the generator working
      - run: just examples

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: ./.github/actions/mdbook
      # each output in the book is the output of this build of strata
      - run: just docs-check
      # mdbook builds a broken link with no message; mdbook-lint finds it
      - run: just docs-lint
      - run: just docs
      # the book the checks passed is the book that is published, so it is built once. There is
      # no configure-pages step: it reads the Pages API, which this job has no token for, and
      # mdbook needs nothing from it. Pages is already set to build from a workflow.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/book

  build:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the same step the release workflow uses, so CI checks the binary a release would ship
      - uses: ./.github/actions/build
        with:
          target: x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: strata-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/strata
          if-no-files-found: error

  # the book goes out only after every check passed, and only from main
  publish-docs:
    name: publish the book
    needs: [check, docs, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and never cancel one that is running: a half-deployed site is
    # worse than a site one commit behind
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
