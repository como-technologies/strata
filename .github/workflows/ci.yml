name: ci

# The checks on every push and pull request, and the one deployment that follows them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  # The scan of each tracked file for each entry of the deny list: see "The deny list" in
  # docs/src/development/build-test.md. The list is a secret, because a file of a public tree
  # names what it denies. A run with no secret, such as a pull request from a fork, gives a
  # notice and passes. The job has no `if`, so it runs on each event.
  deny-list:
    name: deny list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: scan the tracked files
        env:
          STEP14_DENY: ${{ secrets.STEP14_DENY }}
        run: just deny-list

  # The one check that a verify reads. `riff verify pass` needs a successful run named `Gate` on
  # the head commit. The job needs `checks` and `deny-list`, so GitHub runs it only when
  # each check passed, and skips it when one failed. A skipped run is not a success. It does no
  # other work.
  gate:
    name: Gate
    needs: [checks, deny-list]
    runs-on: ubuntu-latest
    steps:
      - run: echo "each check passed"

  # the book goes out only after every check passed, and only from main
  publish-docs:
    name: publish the book
    needs: [checks, deny-list]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and never cancel one that is running: a half-deployed site is
    # worse than a site one commit behind
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
