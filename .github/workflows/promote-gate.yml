name: strata promote gate

# Reusable workflow. A repository calls it from its promotion job to check that the records it
# promotes are one release; see docs/src/use-cases/promote.md.
# Give the records in promotion order, `dev.json test.json prod.json`. Exit 0 means every pair is
# the same release. Exit 1 means a pair is not, and the report names the pack and the value path.
# It installs the strata release with scripts/ci/install-strata.sh, which checks the signature of
# SHA256SUMS and the binary. Other CI systems run `strata same-release` directly, which is all this
# workflow does after the install.
on:
  workflow_call:
    inputs:
      records:
        description: The records to check, in promotion order, separated by spaces or new lines. A record is a snapshot file in the checkout of the caller, or a ref such as name@version.
        required: true
        type: string
      allow:
        description: 'The differences to accept, as a list separated by spaces or new lines: registry-move, for a promotion that moves packs to another registry, renumber, for a release under new version numbers, and no-digest. Empty accepts none.'
        default: ""
        type: string
      project:
        description: The Palette project that holds a ref such as name@version, by name; empty means tenant scope. A file needs none.
        default: ""
        type: string
      palette-api:
        description: The Palette API address, for a self-hosted Palette; empty means https://api.spectrocloud.com
        default: ""
        type: string
      strata-version:
        description: The strata release to use, a tag of this repository
        required: true
        type: string
    secrets:
      strata-token:
        description: Optional. A token that reads como-technologies/strata. When it is empty, the workflow reads that public repository with the token of the caller.
        required: false
      palette-api-key:
        description: PALETTE_API_KEY. Records are files and need no key; a ref does.
        required: false
      palette-project-uid:
        description: PALETTE_PROJECT_UID, the project of a ref by its uid. It has priority over project.
        required: false

permissions:
  contents: read

jobs:
  promote-gate:
    runs-on: ubuntu-latest
    steps:
      # the repository of the caller, where the records live
      - uses: actions/checkout@v7
      # this repository at the requested tag, for the installer
      - uses: actions/checkout@v7
        with:
          repository: como-technologies/strata
          ref: ${{ inputs.strata-version }}
          path: .strata
          token: ${{ secrets.strata-token || github.token }}
      # the installer checks the signature of SHA256SUMS, and cosign 3 reads its bundle
      - uses: sigstore/cosign-installer@v4.1.2
      - name: install strata
        env:
          GH_TOKEN: ${{ secrets.strata-token || github.token }}
          VERSION: ${{ inputs.strata-version }}
        run: |
          .strata/scripts/ci/install-strata.sh --version "$VERSION" --dir .strata/bin --bin-only \
            --require-signature
      - name: the records are one release
        env:
          PALETTE_API_KEY: ${{ secrets.palette-api-key }}
          PALETTE_PROJECT_UID: ${{ secrets.palette-project-uid }}
          PALETTE_PROJECT: ${{ inputs.project }}
          PALETTE_API: ${{ inputs.palette-api }}
          RECORDS: ${{ inputs.records }}
          ALLOW: ${{ inputs.allow }}
        run: |
          # split the records on whitespace, and keep their order: same-release reads each pair
          set -f
          # one --allow for each difference: same-release takes the option more than one time
          allow=()
          for a in $ALLOW; do allow+=(--allow "$a"); done
          # shellcheck disable=SC2086
          .strata/bin/strata same-release $RECORDS "${allow[@]}"
