[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
# The floor of the workspace: the msrv job builds the tooling too.
rust-version.workspace = true
description = "Development tooling for strata: the stand-in for the Palette API, and the book's examples"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The facts of the clouds hold dates, and the check reads them.
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The list of the facts of Palette is YAML, as the rules of strata-preflight are.
serde_yaml = "0.9"
# The stand-in makes the uid and the digest of a new pack version with a hash. Its rule does not
# change with the Rust version, so each run of the book gives the same uids.
sha2 = "0.10"
# The run reads the latest release of two repositories from GitHub, with the HTTP client of strata.
ureq = { version = "3", features = ["json"] }
# The stand-in serves the download of a profile version: a tar archive that gzip compresses.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The size check and the scan of the code read the sources with a parser, and not with a pattern. A
# line number of a token needs `span-locations`, which a parser outside a macro does not give by
# default.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# The order of versions comes from strata, the one parse of a version: see "Types and data" in
# docs/src/development/code.md.
strata = { path = "..", package = "strata-palette" }
# The list of the facts compares with the rules that the catalog of strata-preflight gives, the
# one parse of a rule file.
strata-preflight = { path = "../crates/strata-preflight" }

[dev-dependencies]
tempfile = "3"
# A test compares the answer of the stand-in for the endpoint of the report with the answer of the
# real service. This way, the stand-in cannot go stale.
strata-report-endpoint = { path = "../crates/strata-report-endpoint" }

[lints.rust]
unsafe_code = "forbid"
