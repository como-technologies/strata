[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Development tooling for strata: the stand-in for the Palette API, and the book's examples"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
# The order of versions comes from strata, the one parse of a version: see "Types and data" in
# docs/src/development/code.md.
strata = { path = ".." }

[lints.rust]
unsafe_code = "forbid"
