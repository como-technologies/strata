[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Development tooling for strata: the stand-in for the Palette API, and the book's examples"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The contract run writes the time of the run into its document.
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The list of the facts of Palette is YAML, as the rules of strata-preflight are.
serde_yaml = "0.9"
# The run reads the latest release of two repositories from GitHub, with the HTTP client of strata.
ureq = { version = "3", features = ["json"] }
# The order of versions comes from strata, the one parse of a version: see "Types and data" in
# docs/src/development/code.md.
strata = { path = ".." }
# The rules that the list of the facts is compared with come from the catalog of strata-preflight,
# the one parse of a rule file.
strata-preflight = { path = "../preflight" }

[dev-dependencies]
tempfile = "3"
# A test compares the answer of the stand-in for the endpoint of the report with the answer of the
# real service, so the stand-in cannot go stale.
strata-report-endpoint = { path = "../report-endpoint" }

[lints.rust]
unsafe_code = "forbid"
