schema: strata-facts/1
facts:
  - id: cluster-document
    kind: request
    request: GET /v1/spectroclusters/{uid}
    reads:
      fields:
        - metadata.uid
        - metadata.name
        - metadata.labels
        - metadata.isDeleted
        - metadata.deletionTimestamp
        - metadata.annotations.projectUid
        - spec.cloudType
        - spec.cloudConfigRef.kind
        - spec.cloudConfigRef.uid
        - spec.clusterProfileTemplates
        - spec.clusterConfig
        - status.state
        - status.spcApply
        - status.packs
        - status.fips.mode
        - status.repave.state
      values:
        status.state: [Running, Provisioning, Pending, Importing, Deleting, Deleted, Error, Adopting, Unknown, Paired, Pairing]
      sets:
        status.state: ClusterState
    stand_in:
      - v1/spectroclusters/{uid}
    live:
      - verify.sh:snapshot-cluster
      - verify.sh:cluster-runs-release
      - tiers.sh:a-applied
      - cluster.sh:doc-after-deleted
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-tiers
      - internals/palette/clusters.md#a-deleted-cluster
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/cluster.rs
      - src/ops/live.rs
      - src/ops/consumers/mod.rs
    rules:
      - delete-blockers
      - delete-pending-repave
      - delete-while-provisioning
      - pause-agent-upgrades

  - id: cluster-pack-manifests
    kind: request
    request: GET /v1/spectroclusters/{uid}/profiles/packs/manifests
    reads:
      fields:
        - profiles[].metadata
        - profiles[].spec.packs[].spec.manifests[]
    stand_in:
      - v1/spectroclusters/{uid}/profiles/packs/manifests
    live:
      - in-place.sh:a-owns-manifest-copy
      - in-place.sh:a-kept-old-content
      - in-place.sh:b-owns-manifest-copy
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-copies
    code:
      - src/api/palette/clusters.rs
      - src/api/raw.rs
    rules: []

  - id: cluster-variables
    kind: request
    request: GET /v1/spectroclusters/{uid}/variables
    reads:
      fields:
        - "[].profileUid"
        - "[].variables[].name"
        - "[].variables[].value"
    stand_in:
      - v1/spectroclusters/{uid}/variables
    live:
      - verify.sh:cluster-variables-endpoint
      - verify.sh:addon-copy-variables-hash
      - cluster.sh:variables-after
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-copies
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/cluster.rs
    rules: []

  - id: cluster-rbacs
    kind: request
    request: GET /v1/spectroclusters/{uid}/config/rbacs
    reads:
      fields:
        - items[].spec.bindings[].namespace
        - items[].spec.bindings[].role
        - items[].spec.bindings[].subjects
        - items[].spec.bindings[].type
    stand_in:
      - v1/spectroclusters/{uid}/config/rbacs
    live:
      - tiers.sh:rbac-before
      - tiers.sh:rbac-in-record
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/policy.rs
    rules: []

  - id: cluster-namespaces
    kind: request
    request: GET /v1/spectroclusters/{uid}/config/namespaces
    reads:
      fields:
        - items[].metadata.name
        - items[].spec.isRegex
        - items[].spec.resourceAllocation
    stand_in:
      - v1/spectroclusters/{uid}/config/namespaces
    live: []
    unchecked: No script reads the namespaces of a cluster. A read by hand shows the empty list of a deleted cluster.
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/policy.rs
    rules: []

  - id: cluster-listing
    kind: request
    request: GET /v1/dashboard/spectroclusters/meta
    reads:
      fields:
        - metadata.name
        - metadata.uid
        - metadata.creationTimestamp
        - metadata.lastModifiedTimestamp
        - metadata.deletionTimestamp
        - metadata.labels
        - metadata.annotations
        - metadata.annotations.projectUid
        - spec.cloudType
        - spec.cloudAccountUid
        - spec.cloudRegion
        - spec.clusterType
        - spec.archType
        - spec.location
        - spec.tags
        - status.state
    stand_in:
      - v1/dashboard/spectroclusters/meta
    live:
      - verify.sh:cluster-listing
      - verify.sh:listing-profile-fields
      - cluster.sh:listing-has-cluster
      - fleet.sh:listing-labels
      - cluster-group.sh:member-not-in-listing
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#what-the-cluster-listing-answers
    code:
      - src/api/palette/listings.rs
      - src/ops/list.rs
      - src/ops/fleet.rs
    rules: []

  - id: cluster-summary
    kind: request
    request: GET /v1/dashboard/spectroclusters/{uid}
    reads:
      fields:
        - status.health.state
      values:
        status.health.state: [Healthy, UnHealthy]
    stand_in: []
    live:
      - knurl.sh:instance-<name>-health
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#what-the-cluster-listing-answers
    code:
      - src/api/palette/clusters.rs
      - crates/strata-preflight/src/run/watch.rs
      - crates/strata-knurl/src/lib.rs
    rules: []

  - id: cluster-notifications
    kind: request
    request: GET /v1/notifications/spectrocluster/{uid}
    reads:
      fields:
        - items[].metadata.creationTimestamp
        - items[].action.actionType
        - items[].action.isDone
        - items[].action.events.*.profileUid
        - items[].action.events.*.type
        - items[].action.events.*.message
        - listmeta.continue
    stand_in:
      - v1/notifications/spectrocluster/{uid}
    live:
      - pending.sh:base-none
      - pending.sh:addon-record
      - pending.sh:addon-names
      - macro-repave.sh:edit-notification
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-copies
    code:
      - src/api/palette/clusters.rs
      - src/ops/list.rs
      - src/snapshot/cluster.rs
    rules: []

  - id: cluster-events
    kind: request
    request: GET /v1/events/components/spectrocluster/{uid}
    reads:
      fields:
        - items[]
    stand_in: []
    live: []
    unchecked: Only the watch of a preflight run reads it. No check of the book names it.
    pages:
      - reference/palette-api.md#a-cluster
    code:
      - src/api/palette/clusters.rs
      - crates/strata-preflight/src/run/watch.rs
    rules: []

  - id: cloud-account
    kind: request
    request: GET /v1/cloudaccounts/{cloudType}/{uid}
    reads:
      fields:
        - metadata.annotations
        - spec
    stand_in:
      - v1/cloudaccounts/{cloudType}/{uid}
    live: []
    unchecked: Only the runs of preflight-plan.sh read it, and their checks have names with a variable.
    pages:
      - reference/palette-api.md#a-cluster
    code:
      - src/api/palette/clusters.rs
      - crates/strata-preflight/src/world/mod.rs
    rules:
      - account-missing

  - id: cloud-account-listing
    kind: request
    request: GET /v1/cloudaccounts/aws
    reads:
      fields:
        - items[].metadata.uid
    stand_in:
      - v1/cloudaccounts/aws
    live: []
    unchecked: Only the contract run sends it, to find the account for the query of the regions route. The run reports an error when the route fails.
    pages:
      - reference/palette-api.md#other-reads
      - development/facts.md#the-weekly-contract-run
    code:
      - xtask/src/contract/subject.rs
    rules: []

  - id: cluster-repave-status
    kind: request
    request: GET /v1/spectroclusters/{uid}/repave/status
    absent_codes:
      - ResourceNotFound
    reads:
      fields:
        - spec.source
        - spec.reasons[].code
        - spec.reasons[].message
        - spec.reasons[].pack.current.name
        - spec.reasons[].pack.target.name
        - spec.reasons[].pack.diffConfigKeys
        - status.repaveTransitionTime
    stand_in:
      - v1/spectroclusters/{uid}/repave/status
    live:
      - macro-repave.sh:repave-record
      - macro-repave.sh:repave-names
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/profiles.md#macros
    code:
      - src/api/palette/clusters.rs
      - src/model/repave.rs
    rules: []

  - id: cluster-profile-updates
    kind: request
    request: GET /v1/spectroclusters/{uid}/profileUpdates
    reads:
      fields:
        - profiles[]
    stand_in:
      - v1/spectroclusters/{uid}/profileUpdates
    live:
      - pending.sh:base-profile-updates
      - pending.sh:addon-at-pending
      - pending.sh:addon-pending-root
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/other-objects.md#the-update-that-waits
      - internals/palette/clusters.md#cluster-copies
    code:
      - src/api/palette/clusters.rs
    rules: []

  - id: cloud-config
    kind: request
    request: GET /v1/cloudconfigs/{cloudType}/{configUid}
    reads:
      fields:
        - spec.machinePoolConfig[]
        - spec.clusterConfig
    stand_in:
      - v1/cloudconfigs/{cloudType}/{configUid}
    live:
      - tiers.sh:a-shape
      - tiers.sh:a-arch
      - eks.sh:shape-pool
      - gke.sh:shape-pool
    pages:
      - reference/palette-api.md#a-cluster
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/shape.rs
    rules: []

  - id: cluster-search-schema
    kind: request
    request: GET /v1/dashboard/spectroclusters/search/schema
    reads:
      fields:
        - schema.properties[].name
        - schema.properties[].type
      names:
        schema.properties[].name: [tags, clusterProfiles, environment]
    stand_in:
      - v1/dashboard/spectroclusters/search/schema
    live:
      - fleet.sh:tag-search
      - cluster-group.sh:search-profile-runs
      - cluster-group.sh:member-listed
    pages:
      - reference/palette-api.md#the-fleet
      - internals/palette/clusters.md#an-imported-cluster
    code:
      - src/api/palette/listings.rs
      - src/ops/list.rs
      - src/ops/consumers/reads.rs
    rules: []

  - id: cluster-search
    kind: request
    request: POST /v1/dashboard/spectroclusters/search
    reads:
      fields:
        - items[].metadata.name
        - items[].metadata.uid
        - items[].metadata.labels
        - items[].status.virtual.clusterGroup
        - items[].status.virtual.hostCluster
        - listmeta.continue
    stand_in:
      - v1/dashboard/spectroclusters/search
    live:
      - fleet.sh:tag-search
      - fleet.sh:by-filter
      - cluster-group.sh:search-profile-runs
      - cluster-group.sh:search-nested-misses-member
      - cluster-group.sh:member-by-name
    pages:
      - reference/palette-api.md#the-fleet
      - internals/palette/clusters.md#an-imported-cluster
    code:
      - src/api/palette/listings.rs
      - src/ops/list.rs
      - src/ops/fleet.rs
      - src/ops/consumers/reads.rs
    rules: []

  - id: tag-filter-listing
    kind: request
    request: GET /v1/filters/metadata?filterType=tag
    scope: tenant
    reads:
      fields:
        - items[].metadata.name
        - items[].metadata.uid
    stand_in:
      - v1/filters/metadata
    live:
      - fleet.sh:filters
      - fleet.sh:by-filter
      - fleet.sh:filters-project-says
    pages:
      - reference/palette-api.md#the-fleet
      - internals/palette/clusters.md#an-imported-cluster
    code:
      - src/api/palette/listings.rs
      - src/ops/fleet.rs
    rules: []

  - id: tag-filter
    kind: request
    request: GET /v1/filters/tag/{uid}
    scope: tenant
    reads:
      fields:
        - spec.filterGroup.conjunction
        - spec.filterGroup.filters[]
    stand_in:
      - v1/filters/tag/{uid}
    live:
      - fleet.sh:by-filter
      - fleet.sh:set
      - fleet.sh:filter-project-says
    pages:
      - reference/palette-api.md#the-fleet
      - internals/palette/clusters.md#an-imported-cluster
    code:
      - src/api/palette/listings.rs
      - src/ops/fleet.rs
    rules: []

  - id: edge-host-document
    kind: request
    request: GET /v1/edgehosts/{uid}
    reads:
      fields:
        - metadata.uid
        - metadata.name
        - spec.clusterProfileTemplates
        - status.state
    stand_in:
      - v1/edgehosts/{uid}
    live:
      - edge-host.sh:host-record
      - edge-host.sh:host-flag
      - edge-host.sh:host-verify
      - edge-host.sh:edit-host-raw
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#edge-hosts
    code:
      - src/api/palette/clusters.rs
      - src/ops/live.rs
    rules:
      - edge-agent-version
      - edge-host-arch
      - edge-host-health
      - edge-host-in-use
      - edge-host-nic
      - edge-host-resources

  - id: edge-host-manifest
    kind: request
    request: GET /v1/edgehosts/{uid}/pack/manifests/{manifestUid}
    reads:
      fields:
        - spec.published.content
    stand_in:
      - v1/edgehosts/{uid}/pack/manifests/{manifestUid}
    live:
      - edge-host.sh:edit-host-own-uid
      - edge-host.sh:edit-host-copy
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#edge-hosts
    code:
      - src/api/palette/profiles.rs
      - src/api/palette/clusters.rs
    rules: []

  - id: edge-host-search
    kind: request
    request: POST /v1/dashboard/edgehosts/search
    reads:
      fields:
        - items[].metadata.uid
        - items[].metadata.name
        - items[].spec.clusterProfileTemplates[].uid
        - items[].spec.clusterProfileTemplates[].name
        - items[].spec.clusterProfileTemplates[].version
        - listmeta.continue
    stand_in:
      - v1/dashboard/edgehosts/search
    live:
      - edge-host.sh:host-by-name
      - edge-host.sh:consumers-host
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#edge-hosts
    code:
      - src/api/palette/listings.rs
      - src/ops/consumers/reads.rs
    rules: []

  - id: cluster-group-document
    kind: request
    request: GET /v1/clustergroups/{uid}
    reads:
      fields:
        - spec.clusterProfileTemplates
        - spec.clustersConfig
        - status.isActive
    stand_in:
      - v1/clustergroups/{uid}
    live:
      - cluster-group.sh:group-record
      - cluster-group.sh:group-kind
      - cluster-group.sh:edit-group-raw
      - cluster-group.sh:limit-record
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#cluster-groups
    code:
      - src/api/palette/clusters.rs
      - src/ops/live.rs
      - src/snapshot/policy.rs
    rules: []

  - id: cluster-group-listing
    kind: request
    request: GET /v1/clustergroups/hostCluster/metadata
    reads:
      fields:
        - items[].name
        - items[].uid
    stand_in:
      - v1/clustergroups/hostCluster/metadata
    live:
      - cluster-group.sh:group-by-name
      - cluster-group.sh:member-consumer-group
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#cluster-groups
    code:
      - src/api/palette/listings.rs
      - src/ops/consumers/reads.rs
    rules: []

  - id: cluster-group-virtual-clusters
    kind: request
    request: POST /v1/dashboard/clustergroups/{uid}/virtualClusters
    reads:
      fields:
        - items[].metadata.uid
        - items[].metadata.name
        - items[].metadata.annotations.projectUid
        - listmeta.continue
    stand_in:
      - v1/dashboard/clustergroups/{uid}/virtualClusters
    live:
      - cluster-group.sh:group-members
      - cluster-group.sh:group-virtual-clusters
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#cluster-groups
    code:
      - src/api/palette/clusters.rs
      - src/ops/consumers/reads.rs
      - src/ops/list.rs
    rules: []

  - id: app-profile-document
    kind: request
    request: GET /v1/appProfiles/{uid}
    reads:
      fields:
        - metadata.name
        - metadata.uid
        - metadata.lastModifiedTimestamp
        - spec.version
        - status.inUseApps[].uid
        - status.inUseApps[].name
        - status.inUseApps[].projectUid
    stand_in:
      - v1/appProfiles/{uid}
    live:
      - app-profile.sh:record
      - app-profile.sh:edit-same-version
      - app-profile.sh:edit-last-modified
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#app-profiles
    code:
      - src/api/palette/profiles.rs
      - src/ops/consumers/app.rs
      - src/ops/live.rs
    rules: []

  - id: app-deployment-document
    kind: request
    request: GET /v1/appDeployments/{uid}
    reads:
      fields:
        - metadata.name
        - metadata.annotations.projectUid
        - spec.profile.metadata.version
        - status.state
      values:
        status.state: [Pending, Deploying, Deployed, Updating]
    stand_in:
      - v1/appDeployments/{uid}
    live: []
    unchecked: No run makes an app deployment, so no check reads this route.
    pages:
      - reference/palette-api.md#an-edge-host-a-cluster-group-and-an-app-profile
      - internals/palette/other-objects.md#app-profiles
    code:
      - src/api/palette/profiles.rs
      - src/ops/consumers/app.rs
    rules: []

  - id: app-profile-tiers
    kind: request
    request: GET /v1/appProfiles/{uid}/tiers
    reads:
      fields:
        - spec.appTiers[].metadata.name
        - spec.appTiers[].metadata.uid
        - spec.appTiers[].spec.type
        - spec.appTiers[].spec.version
        - spec.appTiers[].spec.sourceAppTierUid
        - spec.appTiers[].spec.registryUid
