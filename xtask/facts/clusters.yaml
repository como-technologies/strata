  # ---- clusters.md: Cluster tiers

  - id: cluster-tier-fields
    kind: behavior
    reads:
      fields:
        - status.spcApply.spcHash
        - status.spcApply.spcInfraHash
        - status.spcApply.actionType
        - status.packs[].name
        - status.packs[].version
        - status.packs[].profileUid
        - status.packs[].condition
        - spec.clusterConfig.timezone
        - spec.clusterConfig.clusterResources
        - spec.clusterConfig.clusterRbac
        - status.fips.mode
        - metadata.labels
        - spec.cloudConfigRef.kind
        - spec.cloudConfigRef.uid
    live:
      - tiers.sh:a-tiers
      - tiers.sh:a-applied
      - tiers.sh:a-running
    pages:
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/snapshot/cluster.rs
      - src/snapshot/policy.rs

  - id: cluster-config-items
    kind: behavior
    reads:
      fields:
        - spec.clusterConfig.clusterResources
        - items[]
    live:
      - tiers.sh:rbac-before
      - tiers.sh:rbac-after-read
    pages:
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs
      - src/snapshot/policy.rs

  - id: cluster-config-deleted
    kind: behavior
    reads:
      fields:
        - items[]
    live: []
    unchecked: A read by hand shows that a deleted cluster gives an empty list for each route. No script holds the check.
    pages:
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs

  - id: cluster-config-not-found
    kind: behavior
    reads:
      codes: [ResourceNotFound]
    live: []
    unchecked: A read by hand shows the answer for a uid that is not a cluster of the project. No script holds the check.
    pages:
      - internals/palette/clusters.md#cluster-tiers
    code:
      - src/api/palette/clusters.rs

  - id: cluster-config-access-denied
    kind: behavior
    reads:
      codes: [ResourceAccessDenied]
      fields:
        - code
        - message
    live:
      - tiers.sh:limited-read
      - tiers.sh:limited-status
      - tiers.sh:limited-code-says
      - tiers.sh:limited-message
    pages:
