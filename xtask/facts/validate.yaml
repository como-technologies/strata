      - iaas-pod-identity

  - id: validate-aws-key-pair-refused
    kind: behavior
    reads:
      codes:
        - AwsKeyPairNotFound
    stand_in: []
    live: []
    unchecked: A call by hand shows it. The check properties-key-pair of preflight-plan.sh has no result yet.
    pages:
      - internals/palette/validate-routes.md#the-list-routes
      - development/live-runs.md#preflight-plansh
    rules:
      - iaas-pod-identity

  - id: validate-aws-pod-identity-refused
    kind: behavior
    reads:
      codes:
        - FeatureNotSupported
    stand_in: []
    live: []
    unchecked: No live run shows it. Palette refuses the create of a Pod Identity account in the SaaS mode, so a lab on SaaS cannot hold the account.
    pages:
      - internals/palette/validate-routes.md#the-property-routes
    rules:
      - iaas-pod-identity

  - id: validate-eks-properties
    kind: request
    request: "POST /v1/clouds/eks/properties/validate"
    reads:
      fields:
        - code
        - message
    stand_in: []
    live: []
    unchecked: No live run calls the EKS property route.
    pages:
      - internals/palette/validate-routes.md#the-property-routes
      - reference/palette-api.md#the-checks-of-strata-preflight
