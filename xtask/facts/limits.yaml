schema: strata-facts/1
facts:
  - id: limit-release-route
    kind: behavior
    reads:
      fields:
        - version.installedVersion
    live:
      - release.sh:release-no-key
      - release.sh:release-no-key-says
      - release.sh:release-with-key
      - release.sh:release-with-key-says
    pages:
      - internals/palette/limits.md#the-release-of-palette
      - commands/preflight.md#options
    code:
      - preflight/src/main.rs

  - id: limit-spectro-pack-digest
    kind: behavior
    reads:
      fields:
        - spec.published.packs[].digest
    unchecked: Every record of every run carries a pack-ref digest of a Spectro pack registry. No check asserts it.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/packs.md#the-digest-of-each-registry-kind
    code:
      - src/snapshot/pack.rs

  - id: limit-edge-repave
    kind: behavior
    reads:
      fields:
        - isRepaveRequired
        - reasons[].code
        - reasons[].pack.diffConfigKeys
    unchecked: No run uses an Edge cluster. The public pages give a repave rule for Edge that differs from the table of impact levels.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - reference/impact.md
    code:
      - src/diff/impact.rs
      - src/ops/repave.rs

  - id: limit-fips-mode
    kind: behavior
    reads:
      fields:
        - tags[].tag
        - tags[].version
        - tags[].packUid
    unchecked: No run uses a Palette in FIPS mode. The registry route then omits each version that is not FIPS compliant, and answers 404 when none is left.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/packs.md#the-fips-rule
    code:
      - src/ops/packs.rs
      - src/ops/behind.rs

  - id: limit-byoi-image-id
    kind: behavior
    reads:
      fields:
        - spec.published.packs[].annotations.imageId
        - spec.clusterProfileTemplates[].packs[].annotations.imageId
        - packValues[].annotations.imageId
    unchecked: No run gives an OS pack an imageId. So no run shows if Palette replaces the nodes for a new image, or which imageId a cluster copy holds.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - use-cases/os-image.md
      - reference/impact.md#a-new-machine-image
    code:
      - src/snapshot/pack.rs
      - src/diff/mod.rs
    rules:
      - root-volume

  - id: limit-cluster-group-config
    kind: behavior
    reads:
      fields:
        - spec.clustersConfig.endpointType
        - spec.clustersConfig.values
        - spec.clustersConfig.hostClustersConfig[].endpointConfig
    unchecked: The run of cluster-group.sh changes the CPU limit alone. No run changes the endpoint or the values of a cluster group.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - commands/snapshot/other-objects.md#the-config-that-a-cluster-group-gives
    code:
      - src/snapshot/policy.rs
      - src/api/raw.rs

  - id: limit-invalid-pack-create
    kind: behavior
    reads:
      fields:
        - spec.published.packs[].isInvalid
        - spec.published.packs[].inValidReason
        - metadata.annotations.isInValid
    unchecked: No run creates a cluster from a version with an invalid pack. A run shows the flag and the reason.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/packs.md#a-tag-that-a-registry-deletes
    code:
      - src/snapshot/pack.rs
      - src/render/notes.rs

  - id: limit-validate-packs-dependency
    kind: behavior
    reads:
      fields:
        - packs.results[].name
        - packs.results[].errors[].code
        - packs.results[].errors[].message
    unchecked: No pack of the Public Repo lists a dependency. So no run sends a pack with a missing required pack to this route.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/validate-routes.md#post-v1clusterprofilesvalidatepacks
    code:
      - src/ops/validate.rs
      - src/model/validation.rs

  - id: limit-import-validate-existing-name
    kind: behavior
    reads:
      codes:
        - ClusterProfileAlreadyExists
    unchecked: A run shows the refusal of the name route alone. No run shows the answer of the import validate route to a name and a version that the project holds.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/validate-routes.md#post-v1clusterprofilesimportvalidate
    code:
      - src/ops/validate.rs
      - src/model/validation.rs
      - src/api/codes.rs

  - id: limit-forbidden-config-routes
    kind: behavior
    reads:
      codes:
        - AccessDenied
    unchecked: No run shows an HTTP 403 body on these routes. The stand-in of the book gives the body AccessDenied.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/clusters.md#cluster-tiers
      - commands/snapshot/cluster.md#the-policy-tier
    code:
      - src/api/palette/mod.rs
      - src/api/palette/clusters.rs
      - src/snapshot/policy.rs
      - src/snapshot/cluster.rs

  - id: limit-no-role-key
    kind: behavior
    reads:
      codes:
        - ResourceAccessDenied
    live:
      - tiers.sh:limited-status
      - tiers.sh:limited-code-says
      - tiers.sh:limited-message
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/clusters.md#cluster-tiers
      - commands/snapshot/cluster.md#the-policy-tier
    code:
      - src/api/palette/clusters.rs

  - id: limit-imported-cluster
    kind: behavior
    reads:
      fields:
        - spec.clusterType
        - specSummary.clusterType
      values:
        spec.clusterType: [AlloyMonitor, AlloyAssist, AlloyExtend]
    unchecked: No run imports a cluster. The stand-in of the book models the three import types.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/clusters.md#an-imported-cluster
    code:
      - src/ops/list.rs
      - src/render/list.rs

  - id: limit-repave-variable-move
    kind: behavior
    reads:
      fields:
        - isRepaveRequired
        - reasons[].code
        - reasons[].pack.diffConfigKeys
    live:
      - repave.sh:var-strata-answer
      - repave.sh:var-none
      - repave.sh:var-control
      - repave.sh:var-control-says
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/profiles.md#a-variable-in-a-field-that-repaves
    code:
      - src/ops/repave.rs
      - src/diff/mod.rs

  - id: limit-gcp-instance-types
    kind: behavior
    reads:
      fields:
        - instanceTypes[].type
        - instanceTypes[].nonSupportedZones
    unchecked: No run shows the GCP answer of the instance type route. The check of the shape has no GCP result yet.
    pages:
      - internals/palette/limits.md#what-no-run-covers
      - internals/palette/validate-routes.md#the-list-routes
    rules:
      - instance-offering

  - id: limit-install-order-profiles
    kind: behavior
    reads:
      fields:
        - spec.clusterProfileTemplates[].uid
        - spec.clusterProfileTemplates[].name
        - spec.clusterProfileTemplates[].profileVersion
        - spec.clusterProfileTemplates[].type
    live:
      - template.sh:addon-order
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/clusters.md#the-order-of-the-profiles-of-a-cluster
    code:
      - src/snapshot/cluster.rs
    rules:
      - profile-order

  - id: limit-tier-install-order
    kind: behavior
    reads:
      fields:
        - spec.appTiers[].spec.installOrder
    unchecked: The page states these rules from the source of Palette, and no run shows them. A run shows that Palette keeps the order of the create.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/other-objects.md#app-profiles
    code:
      - src/api/palette/profiles.rs
      - src/api/palette/mod.rs

  - id: limit-retired-pack-pinned
    kind: behavior
    reads:
      fields:
        - spec.annotations.system_state
      codes:
        - ClusterProfileInvalidPackState
      values:
        spec.annotations.system_state: [deprecated, disabled, deleted]
    unchecked: The page states the rule from the source of Palette, and no run shows it. A run shows the refusal of a new profile that pins a retired pack.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/packs.md#pack-states
    code:
      - src/api/registry.rs
    rules:
      - pack-state

  - id: limit-template-option-presets
    kind: behavior
    reads:
      fields:
        - spec.template.parameters.inputParameters[].targetKey
        - spec.template.parameters.inputParameters[].options
    unchecked: The page states the rule from the source of Palette, and no run shows it. A run shows that no route gives the presets.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/packs.md#the-presets-of-a-template-option
    code:
      - src/candidate/presets.rs

  - id: limit-helm-oci-endpoint
    kind: behavior
    reads:
      fields:
        - items[].spec.endpoint
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/packs.md#the-digest-of-each-registry-kind
    rules:
      - helm-oci-endpoint

  - id: limit-published-mask
    kind: behavior
    reads:
      fields:
        - spec.published.packs[].values
        - spec.clusterProfileTemplates[].packs[].values
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/profiles.md#secrets-in-the-values
      - use-cases/masked-value.md
    code:
      - src/snapshot/pack.rs
      - src/api/mask.rs

  - id: limit-draft-mask
    kind: behavior
    reads:
      fields:
        - spec.draft.packs[].values
        - packValues[].schema[].name
        - packValues[].schema[].format
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/profiles.md#secrets-in-the-values
    code:
      - src/api/mask.rs
      - src/api/palette/profiles.rs

  - id: limit-repave-field-lists
    kind: behavior
    reads:
      fields:
        - isRepaveRequired
        - reasons[].code
    live:
      - repave.sh:k8s
      - repave.sh:os-value
      - repave.sh:csi-value
      - eks.sh:k8s-bump-repave
      - gke.sh:k8s-bump-repave
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - reference/impact.md
    code:
      - src/diff/impact.rs
      - src/ops/repave.rs

  - id: limit-notification-event-values
    kind: behavior
    reads:
      fields:
        - action.events.*.packValues
        - action.events.*.passwordFields
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - commands/snapshot/no-network.md#the-saved-answers-of-palette
    code:
      - src/api/raw.rs

  - id: limit-instance-type-zones
    kind: behavior
    reads:
      fields:
        - instanceTypes[].nonSupportedZones
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/validate-routes.md#the-list-routes
    rules:
      - instance-offering

  - id: limit-eks-key-pair
    kind: behavior
    reads:
      fields:
        - keyNames[]
    unchecked: The page states the rule from the source of Palette, and no run shows it. A run shows the key pair route and the property route of AWS.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/validate-routes.md#the-list-routes
    rules:
      - ssh-key-pair

  - id: limit-trial-cluster-limit
    kind: behavior
    reads:
      codes:
        - FreemiumActiveClusterLimitExceeded
    unchecked: The page states the rule from the source of Palette, and no run shows it.
    pages:
      - internals/palette/limits.md#what-the-source-of-palette-says
      - internals/palette/validate-routes.md#post-v1spectroclusterscloudtypevalidate
    rules:
      - palette-validate
